: "Написание «Критики Готской программы»"}]}, {"l": "1876", "a": 1876, "b": 1876, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Окончание гимназии и поступление в Берлинский университет"}]}, {"l": "1876–1881", "a": 1876, "b": 1881, "p": 1, "e": [{"w": "Георг Зиммель", "t": "Изучение истории, философии и других гуманитарных дисциплин"}]}, {"l": "1876–1896", "a": 1876, "b": 1896, "p": 1, "e": [{"w": null, "t": "Герберт Спенсер публикует многотомный труд «Основания социологии» («Принципы социологии»). В нём он подробно рассматривает происхождение и развитие общественных институтов: семьи, государства, религии, хозяйства и других социальных структур. Спенсер продолжает сравнивать общество с живым организмом, части которого взаимозависимы. Этот труд стал одним из наиболее значительных произведений классической социологии."}]}, {"l": "1879", "a": 1879, "b": 1879, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Поступил в Высшую нормальную школу в Париже"}]}, {"l": "1880–1920-е гг.", "a": 1880, "b": 1929, "p": 1, "e": [{"w": null, "t": "Наступает поздний классический период развития социологии. В это время появляются новые направления: психологическая социология, формальная социология, понимающая социология и неопозитивизм. Значительный вклад в развитие науки вносят Фердинанд Тённис, Георг Зиммель, Макс Вебер, Эмиль Дюркгейм, Вильфредо Парето и другие исследователи. Социологи начинают уделять больше внимания не только обществу в целом, но и поведению отдельных людей, социальным отношениям и механизмам взаимодействия."}]}, {"l": "1881", "a": 1881, "b": 1881, "p": 0, "e": [{"w": "Карл Маркс", "t": "Смерть жены Женни Маркс"}, {"w": "Георг Зиммель", "t": "Получение докторской степени по философии"}]}, {"l": "1882", "a": 1882, "b": 1882, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Получил право преподавать философию"}]}, {"l": "1883", "a": 1883, "b": 1883, "p": 0, "e": [{"w": "Карл Маркс", "t": "14 марта: Смерть Карла Маркса в Лондоне"}]}, {"l": "1884", "a": 1884, "b": 1884, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Неудачная первая попытка пройти хабилитацию"}]}, {"l": "1885", "a": 1885, "b": 1885, "p": 0, "e": [{"w": "Карл Маркс", "t": "Посмертная публикация второго тома «Капитала» Энгельсом"}, {"w": "Георг Зиммель", "t": "Получение хабилитации и начало преподавания в Берлинском университете"}]}, {"l": "1885–1886", "a": 1885, "b": 1886, "p": 1, "e": [{"w": "Эмиль Дюркгейм", "t": "Научная поездка в Германию"}]}, {"l": "1887", "a": 1887, "b": 1887, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует главный труд «Община и общество». В нём он выделяет два основных типа социальных отношений. Община основана на близости, традициях, родственных связях и эмоциональной привязанности, а общество — на расчёте, личных интересах и формальных договорённостях. Эта теория стала важной основой для изучения перехода от традиционного общества к современному."}, {"w": "Эмиль Дюркгейм", "t": "Назначен на курс социальной науки и педагогики в университете Бордо (по Chicago Durkheim Archive)"}]}, {"l": "1890", "a": 1890, "b": 1890, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «О социальной дифференциации»"}, {"w": "Георг Зиммель", "t": "Женитьба на Гертруде Кинель"}]}, {"l": "1891", "a": 1891, "b": 1891, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует работу «Предупреждение преступности». В ней он обращается к проблеме преступного поведения и возможностям его предотвращения. Исследователь рассматривает преступность как явление, связанное не только с отдельным человеком, но и с условиями общественной жизни. Работа отражает его интерес к практическому применению социологических знаний."}]}, {"l": "1892", "a": 1892, "b": 1892, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «Проблем философии истории»"}]}, {"l": "1892–1893", "a": 1892, "b": 1893, "p": 1, "e": [{"w": "Георг Зиммель", "t": "Публикация «Введения в науку о нравственности»"}]}, {"l": "1893", "a": 1893, "b": 1893, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Опубликована работа «О разделении общественного труда»"}]}, {"l": "1894", "a": 1894, "b": 1894, "p": 0, "e": [{"w": "Карл Маркс", "t": "Посмертная публикация третьего тома «Капитала» Энгельсом"}]}, {"l": "1895", "a": 1895, "b": 1895, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Опубликованы «Правила социологического метода»; в Бордо создано первое в Европе отделение (кафедра) социологии (по Wikipedia)"}, {"w": null, "t": "Фердинанд Тённис публикует работу «Преступность как социальное явление». В ней он изучает влияние общественных условий на поведение людей."}]}, {"l": "1897", "a": 1897, "b": 1897, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Опубликована работа «Самоубийство»"}]}, {"l": "1898", "a": 1898, "b": 1898, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Начал выходить журнал «Социологический ежегодник»"}]}, {"l": "1900", "a": 1900, "b": 1900, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «Философии денег»"}]}, {"l": "1901", "a": 1901, "b": 1901, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Получение должности внештатного экстраординарного профессора философии"}]}, {"l": "1902", "a": 1902, "b": 1902, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Начал преподавать в Сорбонне"}]}, {"l": "1903", "a": 1903, "b": 1903, "p": 0, "e": [{"w": null, "t": "8 декабря в Брайтоне умер Герберт Спенсер. Он оставил после себя масштабную систему философских и социологических трудов, основанную на идее эволюции. Его сравнение общества с живым организмом оказало значительное влияние на развитие органицизма и функционального подхода. Спенсер считается одним из важнейших представителей классической социологии."}, {"w": "Георг Зиммель", "t": "Публикация «Больших городов и духовной жизни»"}]}, {"l": "1905", "a": 1905, "b": 1905, "p": 0, "e": [{"w": null, "t": "Макс Вебер публикует работу «Протестантская этика и дух капитализма». В ней он исследует связь между религиозными убеждениями протестантов и развитием капиталистической экономики. Вебер показывает, что определённые религиозные ценности, например трудолюбие, дисциплина и бережливость, могли способствовать формированию капиталистического хозяйства. Работа стала одним из важнейших исследований в области социологии религии и экономики."}, {"w": "Георг Зиммель", "t": "Публикация «Философии моды»"}]}, {"l": "1906", "a": 1906, "b": 1906, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация работы «Религия»"}, {"w": "Эмиль Дюркгейм", "t": "Получил профессорскую должность в Сорбонне"}]}, {"l": "1908", "a": 1908, "b": 1908, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация главного социологического труда «Социология. Исследования форм обобществления»"}]}, {"l": "1909", "a": 1909, "b": 1909, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует работу «Обычай» (Die Sitte). В ней он продолжает изучать влияние общественных условий на поведение людей и нравственные нормы. В этом же году создаётся Немецкое социологическое общество, первым президентом которого становится Тённис. Он возглавляет его до 1933 года, способствуя институциональному развитию социологии в Германии."}, {"w": "Георг Зиммель", "t": "Участие в создании Немецкого социологического общества"}]}, {"l": "1910", "a": 1910, "b": 1910, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «Главных проблем философии»"}]}, {"l": "1911", "a": 1911, "b": 1911, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «Философской культуры»"}]}, {"l": "1912", "a": 1912, "b": 1912, "p": 0, "e": [{"w": "Эмиль Дюркгейм", "t": "Опубликована работа «Элементарные формы религиозной жизни»"}]}, {"l": "1913", "a": 1913, "b": 1913, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация работы «Гёте»"}]}, {"l": "1914", "a": 1914, "b": 1914, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Получение профессорской должности в Страсбургском университете"}, {"w": "Эмиль Дюркгейм", "t": "Начало Первой мировой войны"}]}, {"l": "1916", "a": 1916, "b": 1916, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация работы «Рембрандт»"}]}, {"l": "1917", "a": 1917, "b": 1917, "p": 0, "e": [{"w": null, "t": "Макс Вебер выступает с лекцией «Наука как призвание и профессия». В ней он рассуждает о роли учёного, его ответственности и особенностях научной деятельности. Вебер подчёркивает, что наука должна стремиться к объективности, а исследователь не должен выдавать личные политические или моральные убеждения за научные факты. Он также рассматривает возможности и ограничения научного познания."}, {"w": "Георг Зиммель", "t": "Публикация «Основных вопросов социологии»"}, {"w": "Эмиль Дюркгейм", "t": "15 ноября умер в Париже"}]}, {"l": "1918", "a": 1918, "b": 1918, "p": 0, "e": [{"w": "Георг Зиммель", "t": "Публикация «Взгляда на жизнь»"}, {"w": "Георг Зиммель", "t": "26 сентября: Смерть Георга Зиммеля в Страсбурге"}]}, {"l": "1919", "a": 1919, "b": 1919, "p": 0, "e": [{"w": null, "t": "Макс Вебер выступает с лекцией «Политика как призвание и профессия». В ней он анализирует сущность государства, политической власти и деятельности профессиональных политиков. Вебер формулирует известное определение государства как организации, обладающей монополией на легитимное физическое насилие в пределах определённой территории. Также в этот период он продолжает работать над исследованиями хозяйственной этики мировых религий."}]}, {"l": "1920", "a": 1920, "b": 1920, "p": 0, "e": [{"w": null, "t": "14 июня в Мюнхене умер Макс Вебер. Он оставил значительное научное наследие, оказавшее огромное влияние на развитие мировой социологии. Его идеи о социальном действии, типах господства, бюрократии и взаимосвязи религии с экономикой стали основой многих современных социологических теорий."}]}, {"l": "1920-е гг.", "a": 1920, "b": 1929, "p": 1, "e": [{"w": null, "t": "Начинается современный этап развития социологии согласно периодизации конспекта. Постепенно центр развития социологической науки перемещается в США, где активно формируются университетские исследовательские центры. Социологи всё чаще обращаются к изучению конкретных социальных проблем, используя опросы, статистику и наблюдения. Усиливается значение эмпирических исследований, основанных на сборе и анализе фактических данных."}]}, {"l": "1920–1930-е гг.", "a": 1920, "b": 1939, "p": 1, "e": [{"w": null, "t": "В социологии активно развивается эмпирическое направление. Исследователи начинают массово изучать реальные общественные процессы с помощью анкетирования, интервью, наблюдения и статистического анализа. Особое внимание уделяется городскому населению, миграции, преступности, безработице и социальным конфликтам. Социология постепенно становится не только теоретической, но и прикладной наукой, способной помогать в решении конкретных общественных проблем."}]}, {"l": "1921", "a": 1921, "b": 1921, "p": 0, "e": [{"w": null, "t": "Посмертно начинает выходить главный труд Макса Вебера «Хозяйство и общество». В нём собраны и систематизированы его исследования социальной структуры, власти, религии, права и экономики. Особое место занимает теория социального действия и классификация типов господства: традиционного, харизматического и легального. Работа стала одним из фундаментальных произведений мировой социологии."}]}, {"l": "1922", "a": 1922, "b": 1922, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует работу «Критика общественного мнения». В ней он исследует природу общественного мнения, его формирование и влияние на общественную жизнь. Учёный рассматривает, каким образом представления и убеждения людей распространяются в обществе и воздействуют на поведение социальных групп. Работа связана с его более широкими исследованиями общественных связей и социальных институтов."}]}, {"l": "1926", "a": 1926, "b": 1926, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует работы «Собственность» и «Прогресс и социальное развитие». В них он продолжает исследовать изменения общественных отношений, экономических институтов и форм социальной организации. Учёный обращает внимание на влияние собственности и хозяйственных отношений на устройство общества. Эти исследования отражают его стремление объяснить закономерности развития современного общества."}]}, {"l": "1927", "a": 1927, "b": 1927, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует исследования «Самоубийство в Шлезвиг-Гольштейне» (1927) и «Преступность в Шлезвиг-Гольштейне» (три части, 1924–1929). В этих работах он обращается к статистическим данным конкретного региона Германии. Учёный анализирует социальные явления с опорой на реальные показатели, что позволяет выявлять их распространённость и особенности. Эти исследования демонстрируют развитие эмпирических методов в социологии."}]}, {"l": "1931", "a": 1931, "b": 1931, "p": 0, "e": [{"w": null, "t": "Фердинанд Тённис публикует «Введение в социологию». В работе он систематизирует основные положения социологической науки и рассматривает её предмет, методы и задачи. Автор стремится объяснить, каким образом общественные отношения образуют различные формы социальной организации. Книга стала важным обобщением его многолетней научной деятельности."}]}, {"l": "1933", "a": 1933, "b": 1933, "p": 0, "e": [{"w": null, "t": "После прихода нацистов к власти в Германии Фердинанд Тённис лишается права преподавания. Причиной стало его неприятие нацистской идеологии и критическое отношение к политике нового режима. Немецкое социологическое общество фактически прекращает нормальную деятельность под его руководством. Этот период стал тяжёлым для немецкой социологии, поскольку многие учёные подверглись преследованиям или были вынуждены эмигрировать."}]}, {"l": "1936", "a": 1936, "b": 1936, "p": 0, "e": [{"w": null, "t": "9 апреля в городе Киль умер Фердинанд Тённис. Он вошёл в историю социологии прежде всего благодаря теории общины и общества. Его работы оказали влияние на развитие формальной социологии, изучение социальных отношений и исследование процессов модернизации. Тённис также сыграл важную роль в становлении социологии как самостоятельного академического направления в Германии."}]}, {"l": "1940–1960-е гг.", "a": 1940, "b": 1969, "p": 1, "e": [{"w": null, "t": "В социологии усиливается внимание к теоретико-методологическим исследованиям. Учёные стремятся систематизировать накопленные знания, уточнить методы исследования и создать общие теоретические модели общества. Значительное влияние приобретает структурный функционализм, связанный с работами Толкотта Парсонса и Роберта Мертона. Главной задачей становится объяснение того, как различные социальные институты поддерживают устойчивость общественной системы."}]}, {"l": "1970-е — середина 1980-х гг.", "a": 1970, "b": 1985, "p": 1, "e": [{"w": null, "t": "Социологи начинают активно искать способы объединения теоретических и эмпирических исследований. Возникает необходимость преодолеть противопоставление микро- и макросоциологии. Микросоциология изучает поведение отдельных людей и небольших групп, а макросоциология — общество в целом, крупные социальные структуры и институты. Исследователи стремятся показать, как действия отдельных людей связаны с масштабными общественными процессами."}]}, {"l": "Конец 1980-х — настоящее время", "a": 1985, "b": 2026, "p": 1, "e": [{"w": null, "t": "В социологии усиливается стремление к созданию интегративных теорий, объединяющих разные научные подходы. Учёные стараются рассматривать общество одновременно на уровне личности, социальных групп и крупных общественных структур. Развиваются новые направления: социология глобализации, цифрового общества, массовых коммуникаций и социальных сетей. Современная социология использует как традиционные методы исследования, так и новые технологии анализа больших объёмов информации."}]}], "dates": [{"name": "Огюст Конт", "y": "1798–1857", "intro": "Огюст Конт — французский философ, основатель позитивизма и один из основоположников социологии. Он считал, что общество необходимо изучать научными методами, опираясь на наблюдения и факты. Именно Конт ввёл термин «социология» и предложил рассматривать её как самостоятельную науку об обществе.", "ev": [["1798 год", "19 января в городе Монпелье родился Огюст Конт. Впоследствии он стал одним из главных представителей позитивизма. Его научные идеи были направлены на создание самостоятельной науки об обществе."], ["1830–1842 годы", "Конт публикует шеститомный труд «Курс позитивной философии». В нём он формулирует закон трёх стадий развития человеческого мышления: теологической, метафизической и позитивной. Согласно Конту, человечество постепенно переходит от объяснения мира через сверхъестественные силы к научному познанию. Также он определяет место социологии в системе наук и разделяет её на социальную статику и социальную динамику."], ["1848 год", "публикует работу «Общий обзор позитивизма». В ней он более доступно излагает основные положения позитивистской философии. Конт подчёркивает, что достоверное знание должно основываться на научном наблюдении, а не на религиозных или отвлечённых философских рассуждениях. Он также рассматривает возможность применения позитивистских принципов для улучшения общественной жизни."], ["1851–1854 годы", "издаёт четырёхтомную работу «Система позитивной политики». В ней он продолжает развивать идеи социальной статики и динамики, а также предлагает проект «религии Человечества». Конт полагал, что обществу необходимы общие моральные ценности, которые смогут поддерживать порядок и единство людей. Его интерес постепенно смещается от научного объяснения общества к вопросам его нравственной организации."], ["1857 год", "5 сентября в Париже умер Огюст Конт. Несмотря на то что при жизни его идеи не всегда получали широкое признание, впоследствии они оказали огромное влияние на развитие социологии. Конт заложил основы позитивистского подхода и помог сформировать представление о социологии как самостоятельной науке."]]}, {"name": "Герберт Спенсер", "y": "1820–1903", "intro": "Герберт Спенсер — английский философ и социолог, один из главных представителей эволюционизма. Он сравнивал общество с живым организмом, в котором различные части выполняют определённые функции и взаимосвязаны между собой.", "ev": [["1820 год", "27 апреля родился Герберт Спенсер в английском городе Дерби. Впоследствии он стал одним из наиболее известных представителей эволюционного направления в социологии. Основой его взглядов стала идея постепенного развития общества от простых форм организации к более сложным."], ["1851 год", "публикует книгу «Социальная статика». В ней он рассматривает общество как систему, которая развивается постепенно, подобно живому организму. Спенсер выступает за естественное развитие общественных институтов и ограниченное вмешательство государства в жизнь человека. Важное место в его взглядах занимают свобода личности и идея общественной эволюции."], ["1862 год", "публикует «Основные начала» — первый том своей масштабной «Системы синтетической философии». В работе он рассматривает общие закономерности развития природы, жизни, человеческого мышления и общества. Центральной идеей становится эволюция — постепенный переход от простых форм организации к более сложным. Спенсер стремился создать единую систему знаний, которая объясняла бы развитие всего мира."], ["1873 год", "публикует книгу «Социологические исследования». В ней он объясняет задачи социологии и трудности научного изучения общества. Спенсер обращает внимание на то, что исследователю необходимо преодолевать личные предубеждения и учитывать сложность социальных процессов. Работа способствует развитию социологии как самостоятельной научной дисциплины."], ["1873–1881 годы", "издаёт восьмитомную «Описательную социологию». Это масштабное собрание сведений о различных обществах, их обычаях, религии, политическом устройстве и хозяйственной жизни. Материалы собирались для сравнения разных народов и выявления общих закономерностей их развития. Работа стала примером попытки опереться на большой объём фактических данных при изучении общества."], ["1876–1896 годы", "публикует многотомный труд «Основания социологии» («Принципы социологии»). В нём он подробно рассматривает происхождение и развитие общественных институтов: семьи, государства, религии, хозяйства и других социальных структур. Спенсер продолжает сравнивать общество с живым организмом, части которого взаимозависимы. Этот труд стал одним из наиболее значительных произведений классической социологии."], ["1903 год", "8 декабря в Брайтоне умер Герберт Спенсер. Он оставил после себя масштабную систему философских и социологических трудов, основанную на идее эволюции. Его сравнение общества с живым организмом оказало значительное влияние на развитие органицизма и функционального подхода."]]}, {"name": "Фердинанд Тённис", "y": "1855–1936", "intro": "Фердинанд Тённис — немецкий социолог, один из основателей формальной социологии. Наибольшую известность ему принесла теория двух типов общественных отношений: общины (Gemeinschaft) и общества (Gesellschaft). Он исследовал изменения социальных связей при переходе от традиционного уклада к современному индустриальному обществу.", "ev": [["1855 год", "26 июля родился Фердинанд Тённис близ Ольденсворта (герцогство Шлезвиг). Впоследствии он стал одним из основателей формальной социологии. Его исследования были направлены на изучение общественных отношений и изменений социальной организации."], ["1887 год", "публикует главный труд «Община и общество». В нём он выделяет два основных типа социальных отношений. Община основана на близости, традициях, родственных связях и эмоциональной привязанности, а общество — на расчёте, личных интересах и формальных договорённостях. Эта теория стала важной основой для изучения перехода от традиционного общества к современному."], ["1891 год", "публикует работу «Предупреждение преступности». В ней он обращается к проблеме преступного поведения и возможностям его предотвращения. Исследователь рассматривает преступность как явление, связанное не только с отдельным человеком, но и с условиями общественной жизни. Работа отражает его интерес к практическому применению социологических знаний."], ["1895 год", "публикует работу «Преступность как социальное явление». В ней он изучает влияние общественных условий на поведение людей."], ["1909 год", "публикует работу «Обычай» (Die Sitte). В ней он продолжает изучать влияние общественных условий на поведение людей и нравственные нормы. В этом же году создаётся Немецкое социологическое общество, первым президентом которого становится Тённис. Он возглавляет его до 1933 года, способствуя институциональному развитию социологии в Германии."], ["1922 год", "публикует работу «Критика общественного мнения». В ней он исследует природу общественного мнения, его формирование и влияние на общественную жизнь. Учёный рассматривает, каким образом представления и убеждения людей распространяются в обществе и воздействуют на поведение социальных групп."], ["1926 год", "публикует работы «Собственность» и «Прогресс и социальное развитие». В них он продолжает исследовать изменения общественных отношений, экономических институтов и форм социальной организации. Учёный обращает внимание на влияние собственности и хозяйственных отношений на устройство общества."], ["1927 год", "публикует исследования «Самоубийство в Шлезвиг-Гольштейне» (1927) и «Преступность в Шлезвиг-Гольштейне» (три части, 1924–1929). В этих работах он обращается к статистическим данным конкретного региона Германии. Учёный анализирует социальные явления с опорой на реальные показатели, что позволяет выявлять их распространённость и особенности."], ["1931 год", "публикует «Введение в социологию». В работе он систематизирует основные положения социологической науки и рассматривает её предмет, методы и задачи. Автор стремится объяснить, каким образом общественные отношения образуют различные формы социальной организации."], ["1933 год", "после прихода нацистов к власти в Германии Тённис лишается права преподавания. Причиной стало его неприятие нацистской идеологии и критическое отношение к политике нового режима. Немецкое социологическое общество фактически прекращает нормальную деятельность под его руководством."], ["1936 год", "9 апреля в городе Киль умер Фердинанд Тённис. Он вошёл в историю социологии прежде всего благодаря теории общины и общества. Его работы оказали влияние на развитие формальной социологии, изучение социальных отношений и исследование процессов модернизации."]]}, {"name": "Макс Вебер", "y": "1864–1920", "intro": "Макс Вебер — немецкий социолог, историк и экономист, один из основоположников понимающей социологии и теории социального действия. Он считал, что для изучения общества необходимо понимать мотивы и смыслы, которые люди вкладывают в свои поступки.", "ev": [["1864 год", "21 апреля родился Макс Вебер в городе Эрфурт. Он получил юридическое и историческое образование, но впоследствии сосредоточился на изучении общественных отношений, экономики и политики. Вебер стал одним из наиболее влиятельных социологов классического периода."], ["1905 год", "публикует работу «Протестантская этика и дух капитализма». В ней он исследует связь между религиозными убеждениями протестантов и развитием капиталистической экономики. Вебер показывает, что определённые религиозные ценности, например трудолюбие, дисциплина и бережливость, могли способствовать формированию капиталистического хозяйства. Работа стала одним из важнейших исследований в области социологии религии и экономики."], ["1917 год", "выступает с лекцией «Наука как призвание и профессия». В ней он рассуждает о роли учёного, его ответственности и особенностях научной деятельности. Вебер подчёркивает, что наука должна стремиться к объективности, а исследователь не должен выдавать личные политические или моральные убеждения за научные факты. Он также рассматривает возможности и ограничения научного познания."], ["1919 год", "выступает с лекцией «Политика как призвание и профессия». В ней он анализирует сущность государства, политической власти и деятельности профессиональных политиков. Вебер формулирует известное определение государства как организации, обладающей монополией на легитимное физическое насилие в пределах определённой территории. Также в этот период он продолжает работать над исследованиями хозяйственной этики мировых религий."], ["1920 год", "14 июня в Мюнхене умер Макс Вебер. Он оставил значительное научное наследие, оказавшее огромное влияние на развитие мировой социологии. Его идеи о социальном действии, типах господства, бюрократии и взаимосвязи религии с экономикой стали основой многих современных социологических теорий."], ["1921 год", "посмертно начинает выходить главный труд Макса Вебера «Хозяйство и общество». В нём собраны и систематизированы его исследования социальной структуры, власти, религии, права и экономики. Особое место занимает теория социального действия и классификация типов господства: традиционного, харизматического и легального. Работа стала одним из фундаментальных произведений мировой социологии."]]}, {"name": "Карл Маркс", "y": "1818–1883", "intro": "Немецкий философ, экономист, историк, публицист, политический деятель и один из основоположников классической социологической мысли.", "ev": [["5 мая 1818", "Рождение Карла Маркса в Трире, Пруссия"], ["1835 год", "Окончание гимназии в Трире"], ["1835 год", "Поступление в Боннский университет"], ["1836 год", "Переход в Берлинский университет"], ["1836 год", "Помолвка с Женни фон Вестфален"], ["1841 год", "Докторская диссертация по философии подана заочно в Йенский университет; степень присуждена"], ["1842 год", "Начало работы в «Рейнской газете»"], ["1842 год", "Назначение главным редактором газеты"], ["1843 год", "Закрытие «Рейнской газеты»"], ["1843 год", "Женитьба на Женни фон Вестфален"], ["1843 год", "Написание работы «К критике гегелевской философии права»"], ["1843 год", "Переезд в Париж"], ["1843–1844 годы", "Работа над критикой философии Гегеля и проблемами политического освобождения"], ["1844 год", "Начало тесного сотрудничества с Фридрихом Энгельсом"], ["1844 год", "Написание «Экономическо-философских рукописей»"], ["1845 год", "Переезд в Брюссель"], ["1845 год", "Написание «Тезисов о Фейербахе»"], ["1845 год", "Публикация «Святого семейства» совместно с Энгельсом"], ["1845–1846 годы", "Работа над «Немецкой идеологией»"], ["1847 год", "Публикация «Нищеты философии»"], ["1847 год", "Участие в Союзе коммунистов"], ["1848 год", "Публикация «Манифеста Коммунистической партии»"], ["1848–1849 годы", "Участие в революционных событиях в Европе, работа в «Новой Рейнской газете»"], ["1849 год", "Переезд в Лондон"], ["1852 год", "Публикация «Восемнадцатого брюмера Луи Бонапарта»"], ["1859 год", "Публикация «К критике политической экономии»"], ["1864 год", "Создание Первого интернационала, участие Маркса в его деятельности"], ["1867 год", "Публикация первого тома «Капитала»"], ["1871 год", "Парижская коммуна, её анализ Марксом в контексте классовой борьбы"], ["1875 год", "Написание «Критики Готской программы»"], ["1881 год", "Смерть жены Женни Маркс"], ["14 марта 1883", "Смерть Карла Маркса в Лондоне"], ["1885 год", "Посмертная публикация второго тома «Капитала» Энгельсом"], ["1894 год", "Посмертная публикация третьего тома «Капитала» Энгельсом"]]}, {"name": "Георг Зиммель", "y": "1858–1918", "intro": "Немецкий философ и социолог, один из основоположников формальной социологии, представитель классической социологической мысли.", "ev": [["1 марта 1858", "Рождение Георга Зиммеля в Берлине"], ["1870–1876 годы", "Обучение в гимназии Фридриха Вердера"], ["1874 год", "Смерть отца, назначение Юлиуса Фридлендера опекуном"], ["1876 год", "Окончание гимназии и поступление в Берлинский университет"], ["1876–1881 годы", "Изучение истории, философии и других гуманитарных дисциплин"], ["1881 год", "Получение докторской степени по философии"], ["1884 год", "Неудачная первая попытка пройти хабилитацию"], ["1885 год", "Получение хабилитации и начало преподавания в Берлинском университете"], ["1890 год", "Публикация «О социальной дифференциации»"], ["1890 год", "Женитьба на Гертруде Кинель"], ["1892 год", "Публикация «Проблем философии истории»"], ["1892–1893 годы", "Публикация «Введения в науку о нравственности»"], ["1900 год", "Публикация «Философии денег»"], ["1901 год", "Получение должности внештатного экстраординарного профессора философии"], ["1903 год", "Публикация «Больших городов и духовной жизни»"], ["1905 год", "Публикация «Философии моды»"], ["1906 год", "Публикация работы «Религия»"], ["1908 год", "Публикация главного социологического труда «Социология. Исследования форм обобществления»"], ["1909 год", "Участие в создании Немецкого социологического общества"], ["1910 год", "Публикация «Главных проблем философии»"], ["1911 год", "Публикация «Философской культуры»"], ["1913 год", "Публикация работы «Гёте»"], ["1914 год", "Получение профессорской должности в Страсбургском университете"], ["1916 год", "Публикация работы «Рембрандт»"], ["1917 год", "Публикация «Основных вопросов социологии»"], ["1918 год", "Публикация «Взгляда на жизнь»"], ["26 сентября 1918", "Смерть Георга Зиммеля в Страсбурге"]]}, {"name": "Эмиль Дюркгейм", "y": "1858–1917", "intro": "Дюркгейм посвятил свою жизнь превращению социологии в самостоятельную научную дисциплину.", "ev": [["1858 год", "15 апреля родился в городе Эпиналь, Франция"], ["1879 год", "Поступил в Высшую нормальную школу в Париже"], ["1882 год", "Получил право преподавать философию"], ["1885–1886 годы", "Научная поездка в Германию"], ["1887 год", "Назначен на курс социальной науки и педагогики в университете Бордо (по Chicago Durkheim Archive)"], ["1893 год", "Опубликована работа «О разделении общественного труда»"], ["1895 год", "Опубликованы «Правила социологического метода»; в Бордо создано первое в Европе отделение (кафедра) социологии (по Wikipedia)"], ["1897 год", "Опубликована работа «Самоубийство»"], ["1898 год", "Начал выходить журнал «Социологический ежегодник»"], ["1902 год", "Начал преподавать в Сорбонне"], ["1906 год", "Получил профессорскую должность в Сорбонне"], ["1912 год", "Опубликована работа «Элементарные формы религиозной жизни»"], ["1914 год", "Начало Первой мировой войны"], ["1917 год", "15 ноября умер в Париже"]]}], "bios": {"weber": {"name": "Макс Вебер", "y": "1864–1920", "facts": [["Страна", "Германия."], ["Направление", "понимающая социология."], ["Основной вклад", "теория социального действия, концепция рационализации, типология господства."]], "blocks": [["h", "Детство и семья"], ["p", "Макс Вебер родился 21 апреля 1864 года в городе Эрфурт, который в то время входил в состав Пруссии. Он происходил из обеспеченной и образованной семьи немецкой буржуазии."], ["p", "Его отец, Макс Вебер-старший, был юристом и политическим деятелем, участвовал в работе парламента и придерживался либеральных политических взглядов. Мать, Хелена Фалленштейн, происходила из образованной семьи с гугенотскими корнями. Она была глубоко религиозным человеком и отличалась серьёзным отношением к нравственным вопросам."], ["p", "Родители обладали разными характерами и мировоззрением. Отец был ориентирован на политическую и общественную деятельность, а мать — на религиозные и нравственные ценности. Это противоречие оказало влияние на формирование личности Вебера и его последующие размышления о соотношении политики, религии и личной ответственности."], ["p", "В семье также рос младший брат Альфред, который впоследствии стал известным экономистом и социологом."], ["h", "Образование"], ["p", "Вебер с раннего возраста проявлял интерес к истории, философии и литературе. Он много читал, самостоятельно изучал труды известных мыслителей и достаточно рано заинтересовался вопросами общественного устройства."], ["p", "В 1882 году поступил в Гейдельбергский университет, где изучал право. В процессе обучения он также интересовался историей, экономикой и философией. Некоторое время Вебер прерывал учёбу, поскольку проходил военную службу."], ["p", "Позднее он продолжил образование в Берлинском университете. В 1889 году защитил докторскую диссертацию, посвящённую истории средневековых торговых товариществ. В 1891 году завершил исследование, необходимое для получения права преподавать в университете, посвящённое римскому аграрному законодательству и истории землевладения."], ["p", "Таким образом, первоначально Вебер формировался как специалист в области права и экономической истории, а не как социолог в современном понимании."], ["h", "Начало научной и преподавательской деятельности"], ["p", "В начале 1890-х годов Вебер участвовал в исследовательских проектах, связанных с экономическими и социальными проблемами Германии. Одним из наиболее значимых стало исследование положения сельскохозяйственных рабочих в Восточной Пруссии."], ["p", "В ходе этой работы он изучал изменения в сельском хозяйстве, положение немецких и польских рабочих, миграцию и влияние экономических преобразований на социальную структуру региона."], ["p", "В 1894 году Вебер получил должность профессора политической экономии во Фрайбургском университете. В 1896 году он перешёл в Гейдельбергский университет, где продолжил преподавательскую и исследовательскую деятельность."], ["p", "В этот период его дом стал местом встреч учёных, философов и общественных деятелей. Вокруг Вебера сформировался интеллектуальный круг, в котором обсуждались вопросы экономики, религии, политики и развития современного общества."], ["p", "В 1893 году он женился на Марианне Шнитгер, которая впоследствии стала известной исследовательницей и одной из первых женщин, активно участвовавших в развитии немецкой социологии."], ["h", "Личный кризис и изменение научной деятельности"], ["p", "В 1897 году после смерти отца Вебер пережил тяжёлый личный и психологический кризис. Незадолго до этого между ними произошёл серьёзный конфликт, который стал одним из факторов ухудшения его состояния."], ["p", "Вебер на длительное время практически прекратил регулярную преподавательскую деятельность. Его здоровье не позволяло поддерживать прежний темп работы, поэтому он постепенно отошёл от университетских обязанностей."], ["p", "Несмотря на это, он продолжал заниматься научными исследованиями. Именно в этот период усилился его интерес к философии, религии, методологии социальных наук и проблемам современного капиталистического общества."], ["p", "В 1904 году Вебер совершил поездку в США. Он посетил крупные города, изучал американские общественные институты, религиозные организации и экономические отношения. Поездка оказала влияние на его представления о современном капитализме и особенностях западного общества."], ["h", "Основные научные идеи и труды"], ["p", "Одной из важнейших работ Вебера стала «Протестантская этика и дух капитализма», опубликованная в 1904–1905 годах. В ней он исследовал влияние религиозных представлений протестантов на формирование капиталистической хозяйственной культуры."], ["p", "Вебер не утверждал, что протестантизм единолично создал капитализм. Он показывал, что определённые религиозные установки — дисциплина, трудолюбие, бережливость и рациональная организация жизни — способствовали развитию капиталистических отношений."], ["p", "Важнейшим вкладом Вебера стала понимающая социология. Он считал, что социолог должен не просто фиксировать внешнее поведение людей, но и понимать субъективный смысл, который сами люди придают своим поступкам."], ["p", "Также Вебер разработал понятие идеального типа — специальной аналитической модели, которая позволяет сравнивать реальные социальные явления с теоретически выделенными признаками."], ["p", "Большое значение имела его теория типов господства. Вебер выделял три основных типа легитимного господства:"], ["li", "Традиционное — основано на вере в святость обычаев и традиций."], ["li", "Харизматическое — основано на признании исключительных качеств конкретного лидера."], ["li", "Легальное — основано на соблюдении установленных законов и формальных правил."], ["h", "Политическая деятельность и последние годы"], ["p", "В 1909 году Вебер участвовал в создании Немецкого социологического общества. Он стремился укрепить положение социологии как самостоятельной научной дисциплины и повысить требования к научной объективности."], ["p", "Во время Первой мировой войны его взгляды на политику Германии постепенно изменились. Сначала он поддерживал участие страны в войне, но позднее стал критиковать действия германского правительства и выступать за политические реформы."], ["p", "В 1917 году он прочитал лекцию «Наука как призвание и профессия», а в 1919 году — «Политика как призвание и профессия». В этих работах Вебер рассматривал ответственность учёного и политика, а также различия между научной и политической деятельностью."], ["p", "После окончания войны он участвовал в обсуждении проекта Веймарской конституции и продолжал заниматься преподаванием. В 1918 году он преподавал в Венском университете, а в 1919 году — в Мюнхенском."], ["p", "Макс Вебер умер 14 июня 1920 года в Мюнхене от пневмонии. Его важнейший труд «Хозяйство и общество» был опубликован посмертно в 1921 году."], ["h", "Основные труды:"], ["li", "«История торговых товариществ в Средние века» — 1889."], ["li", "«Римская аграрная история и её значение для государственного и частного права» — 1891."], ["li", "«Протестантская этика и дух капитализма» — 1904–1905."], ["li", "«Наука как призвание и профессия» — 1917."], ["li", "«Политика как призвание и профессия» — 1919."], ["li", "«Хозяйство и общество» — 1921, посмертное издание."], ["v", "Значение", "Вебер стал одним из основоположников современной социологии. Его работы оказали влияние на изучение власти, религии, экономики, бюрократии, социального поведения и методов социологического исследования."]]}, "comte": {"name": "Огюст Конт", "y": "1798–1857", "facts": [["Полное имя", "Изидор Огюст Мари Франсуа Ксавье Конт."], ["Страна", "Франция."], ["Направление", "позитивизм."], ["Основной вклад", "введение понятия «социология», разработка основ позитивистской науки об обществе."]], "blocks": [["h", "Детство и образование"], ["p", "Огюст Конт родился 19 января 1798 года в городе Монпелье на юге Франции. Он происходил из католической семьи, придерживавшейся монархических и традиционных взглядов. Его детство и юность пришлись на период серьёзных политических и общественных преобразований во Франции после Великой французской революции."], ["p", "С ранних лет Конт проявлял способности к математике и другим точным наукам. В 1814 году он поступил в престижную Парижскую политехническую школу (École Polytechnique), заняв четвёртое место в списке поступивших. Однако уже в 1816 году учебное заведение было закрыто властями Бурбонов, а студенты распущены. Поэтому полноценного высшего образования в привычном смысле Конт не получил, но продолжил самостоятельно заниматься математикой, философией и естественными науками."], ["h", "Начало научной и общественной деятельности"], ["p", "Важнейшее влияние на формирование взглядов Конта оказал французский мыслитель Анри де Сен-Симон. В 1817 году Конт познакомился с ним и стал его секретарём и ближайшим интеллектуальным сотрудником. В течение нескольких лет он участвовал в подготовке публикаций Сен-Симона и занимался вопросами общественного переустройства."], ["p", "Именно в этот период сформировались первые представления Конта о необходимости научного изучения общества. Он считал, что после революционных потрясений Франции необходимо создать новую систему общественной организации, основанную не на религиозных догмах и традициях, а на научном знании. В 1824 году отношения между Контом и Сен-Симоном ухудшились, и они прекратили сотрудничество из-за разногласий относительно авторства и содержания совместных идей."], ["p", "В 1825 году Конт женился на Каролине Массен. Их семейная жизнь была непростой и сопровождалась материальными и личными трудностями."], ["h", "Формирование позитивизма"], ["p", "В 1826 году Конт начал читать публичный курс позитивной философии. Его слушателями были представители научной и интеллектуальной среды, в том числе известные учёные. Однако курс пришлось прервать из-за тяжёлого нервного кризиса, после которого Конт некоторое время находился на лечении."], ["p", "В 1829 году он возобновил занятия, а в 1830 году начал публикацию своего главного труда — шеститомного «Курса позитивной философии». Работа над ним продолжалась до 1842 года."], ["p", "Главной идеей Конта стало утверждение, что общество должно изучаться так же научно, как природа. Он полагал, что социология способна выявлять закономерности общественного развития и объяснять причины социальных изменений. Для обозначения новой науки он использовал термин «социология», образованный от латинского слова societas (общество) и греческого logos (учение)."], ["h", "Основные научные идеи"], ["p", "Конт разработал закон трёх стадий развития человеческого мышления. Согласно этому закону, человечество последовательно проходит три этапа:"], ["li", "Теологический — явления объясняются действием сверхъестественных сил и богов."], ["li", "Метафизический — объяснение строится на абстрактных понятиях и отвлечённых сущностях."], ["li", "Позитивный — человек отказывается от поиска абсолютных причин и стремится устанавливать закономерности на основе наблюдений и научных исследований."], ["p", "Также Конт разделил социологию на два основных раздела. Социальная статика изучает условия существования общества, его структуру и факторы устойчивости. Социальная динамика рассматривает общественное развитие, изменения и закономерности исторического процесса."], ["h", "Поздний период жизни"], ["p", "В 1844 году Конт познакомился с Клотильдой де Во. Их отношения оказали большое влияние на его мировоззрение, особенно на поздние философские и религиозные взгляды. После её смерти в 1846 году Конт всё больше внимания уделял нравственным и духовным вопросам."], ["p", "В 1851–1854 годах он опубликовал четырёхтомную «Систему позитивной политики». В ней Конт предложил проект новой светской «религии Человечества», которая должна была объединять людей на основе общих нравственных ценностей. Он считал, что одной науки недостаточно для организации общества: необходимы также моральные нормы и общественная солидарность."], ["p", "В последние годы жизни его взгляды стали более своеобразными и вызвали критику даже среди некоторых сторонников позитивизма. 5 сентября 1857 года Огюст Конт умер в Париже."], ["h", "Основные труды:"], ["li", "«План научных работ, необходимых для реорганизации общества» — 1822."], ["li", "«Курс позитивной философии» — 1830–1842."], ["li", "«Общий обзор позитивизма» — 1848."], ["li", "«Система позитивной политики» — 1851–1854."], ["v", "Значение", "Конт заложил основы позитивистской социологии, предложил рассматривать общество как самостоятельный объект научного исследования и сформулировал одну из первых целостных программ развития социологической науки."]]}, "tonnis": {"name": "Фердинанд Тённис", "y": "1855–1936", "facts": [["Страна", "Германия."], ["Направление", "формальная социология."], ["Основной вклад", "теория общины и общества, исследование форм социальных связей."]], "blocks": [["h", "Детство и образование"], ["p", "Фердинанд Тённис родился 26 июля 1855 года близ Ольденсворта (герцогство Шлезвиг), на территории современной Германии. Он происходил из семьи, связанной с сельским хозяйством и лютеранской традицией. Его детство прошло в условиях традиционного сельского общества, что впоследствии отразилось на его интересе к общинным отношениям, обычаям и формам социальной организации."], ["p", "Тённис получил хорошее образование и проявил интерес к гуманитарным наукам, философии и истории. Он обучался в нескольких немецких университетах, включая Страсбургский, Йенский, Боннский, Лейпцигский и Тюбингенский. В 1877 году он защитил докторскую диссертацию по классической филологии в Тюбингенском университете."], ["p", "Позднее Тённис много занимался философией Томаса Гоббса: его книга о Гоббсе вышла в 1896 году. Особенно его интересовали природа общественных связей, происхождение государства и причины объединения людей в социальные группы."], ["h", "Формирование научных взглядов"], ["p", "После получения докторской степени Тённис продолжил научную деятельность. Он занимался философией, историей и общественными науками, постепенно сосредоточившись на проблеме изменения социальных отношений."], ["p", "В XIX веке Германия переживала интенсивную индустриализацию и урбанизацию. Традиционные сельские сообщества постепенно уступали место крупным городам, промышленным предприятиям и новым формам организации труда. Тённис стремился объяснить, как эти изменения влияют на отношения между людьми."], ["p", "В отличие от Спенсера, который сравнивал общество с живым организмом, Тённис сосредоточился на различных формах человеческих связей и на том, какие основания лежат в основе объединения людей."], ["h", "Главный труд и теория общины и общества"], ["p", "В 1887 году Тённис опубликовал свою наиболее известную работу — «Община и общество». Именно она принесла ему широкую известность в социологии."], ["p", "В этой работе учёный выделил два идеальных типа социальных отношений."], ["p", "Первый тип — община (Gemeinschaft). Она основана на естественных, близких и эмоциональных отношениях между людьми. Такие отношения характерны для семьи, родственных связей, небольших сельских поселений и традиционных сообществ."], ["p", "Второй тип — общество (Gesellschaft). Он основан на рациональном расчёте, личной выгоде, договорных отношениях и формальных правилах. Такие отношения особенно характерны для крупных городов, рыночной экономики и современного индустриального общества."], ["p", "Тённис не утверждал, что один тип полностью исчезает при появлении другого. Он использовал эти понятия как теоретические модели, позволяющие анализировать различные формы общественной организации."], ["h", "Деятельность в Немецком социологическом обществе"], ["p", "Важной частью научной деятельности Тённиса стало развитие социологии как самостоятельной университетской и общественной дисциплины."], ["p", "В 1909 году он участвовал в основании Немецкого социологического общества вместе с Максом Вебером и Георгом Зиммелем. Тённис стал его первым президентом и занимал эту должность до 1933 года."], ["p", "Помимо теоретических исследований, он занимался изучением общественного мнения, преступности, статистики и социальных изменений. Таким образом, его научная деятельность сочетала философское осмысление общества с конкретными эмпирическими исследованиями."], ["h", "Последние годы"], ["p", "В 1933 году после прихода нацистов к власти Тённис был лишён возможности преподавать. Он критически относился к нацистскому режиму и не поддерживал его идеологию."], ["p", "В последние годы жизни он продолжал заниматься научной работой, однако политическая обстановка существенно ограничивала его деятельность."], ["p", "Фердинанд Тённис умер 9 апреля 1936 года в городе Киль."], ["h", "Основные труды:"], ["li", "«Община и общество» — 1887."], ["li", "«Преступность как социальное явление» — 1895."], ["li", "«Обычай» — 1909."], ["li", "«Критика общественного мнения» — 1922."], ["li", "«Введение в социологию» — 1931."], ["v", "Значение", "Тённис стал одним из основоположников формальной социологии. Его теория общины и общества до сих пор используется для объяснения различий между традиционными и современными формами социальных отношений."]]}, "spencer": {"name": "Герберт Спенсер", "y": "1820–1903", "facts": [["Страна", "Англия."], ["Направление", "эволюционизм, органицизм."], ["Основной вклад", "теория общественной эволюции, сравнение общества с живым организмом."]], "blocks": [["h", "Детство и происхождение"], ["p", "Герберт Спенсер родился 27 апреля 1820 года в английском городе Дерби. Он был старшим ребёнком в семье, в которой религиозные и общественные взгляды отличались от традиционных англиканских представлений. Его отец, Джордж Спенсер, работал школьным учителем и придерживался независимых религиозных и политических взглядов."], ["p", "Большое влияние на формирование характера будущего учёного оказал его отец, который воспитывал в нём самостоятельность мышления и критическое отношение к авторитетам. Значительную роль сыграл и дядя Томас Спенсер, познакомивший Герберта с идеями индивидуальной свободы и философского радикализма."], ["p", "Образование Спенсера было преимущественно домашним и не имело строгой систематической структуры. Он изучал математику, естественные науки и философию, много занимался самостоятельно. Его дядя предлагал ему поступить в Кембриджский университет, однако Спенсер отказался, предпочтя самостоятельное образование."], ["h", "Начало профессиональной деятельности"], ["p", "В молодости Спенсер получил инженерную подготовку и работал на строительстве железных дорог. С 1837 по 1841 год он занимался инженерной деятельностью, что позволило ему познакомиться с техническими и экономическими изменениями, происходившими в Англии во время промышленной революции."], ["p", "Однако инженерная карьера не стала его главным призванием. В начале 1840-х годов он начал заниматься журналистикой и политической публицистикой. В 1848 году Спенсер устроился помощником редактора в журнал The Economist, где работал до 1853 года."], ["p", "Работа в журнале позволила ему познакомиться с представителями интеллектуальной среды Великобритании. Он общался с известными философами, писателями и общественными деятелями, участвовал в обсуждении вопросов экономики, политики и общественного устройства."], ["h", "Начало научной деятельности"], ["p", "В 1851 году Спенсер опубликовал первую крупную книгу — «Социальная статика». В ней он рассматривал условия существования общества, развитие свободы личности и роль государства. Учёный выступал за ограниченное вмешательство государства в жизнь граждан и считал, что общественные институты должны развиваться естественным путём."], ["p", "В 1853 году после смерти дяди Томаса Спенсер получил небольшое наследство. Это позволило ему отказаться от постоянной работы и сосредоточиться на научной и литературной деятельности."], ["p", "В 1855 году вышла его работа «Основания психологии». В ней он пытался применить эволюционный подход к изучению человеческого сознания и психики. В этот период у Спенсера появились серьёзные проблемы со здоровьем, которые впоследствии ограничивали его работоспособность и заставляли вести более замкнутый образ жизни."], ["h", "Разработка эволюционной теории"], ["p", "Главной идеей Спенсера стало представление об эволюции как универсальном законе развития мира. Он полагал, что все явления — от природных организмов до человеческого общества — развиваются от простых форм к более сложным и дифференцированным."], ["p", "Особенно известной стала его теория общества как живого организма. Спенсер сравнивал общество с биологическим организмом: как в организме существуют органы, выполняющие разные функции, так и в обществе существуют институты, отвечающие за производство, управление, распределение ресурсов и другие задачи."], ["p", "При этом Спенсер подчёркивал, что общество не является буквальным биологическим организмом. В отличие от него, общество состоит из отдельных людей, которые обладают собственной волей и сознанием."], ["p", "В 1862 году вышли «Основные начала» — первая часть его масштабной «Системы синтетической философии». В последующие десятилетия Спенсер развивал свою теорию, распространяя эволюционный подход на биологию, психологию, социологию и этику."], ["h", "Научное признание и последние годы"], ["p", "В 1870–1880-е годы Спенсер приобрёл широкую известность не только в Англии, но и за её пределами. Его труды активно читали в США, где они повлияли на развитие ранней американской социологии."], ["p", "В 1873–1881 годах выходила его «Описательная социология», представлявшая собой масштабный сборник сведений об истории, обычаях и общественном устройстве различных народов."], ["p", "В 1876–1896 годах публиковались тома «Оснований социологии» — одного из важнейших его произведений. Спенсер продолжал научную работу, несмотря на ухудшение здоровья."], ["p", "8 декабря 1903 года он умер в Брайтоне после продолжительной болезни."], ["h", "Основные труды:"], ["li", "«Социальная статика» — 1851."], ["li", "«Основания психологии» — 1855."], ["li", "«Основные начала» — 1862."], ["li", "«Социологические исследования» — 1873."], ["li", "«Описательная социология» — 1873–1881."], ["li", "«Основания социологии» — 1876–1896."], ["v", "Значение", "Спенсер развил эволюционный подход к изучению общества, заложил основы органицизма и оказал значительное влияние на становление социологии в Великобритании и США."]]}, "marx": {"name": "Карл Маркс", "y": "1818–1883", "facts": [["Полное имя", "Карл Генрих Маркс"], ["Годы жизни", "5 мая 1818 года — 14 марта 1883 года"]], "blocks": [["lead", "Немецкий философ, экономист, историк, публицист, политический деятель и один из основоположников классической социологической мысли."], ["h", "Детство и образование"], ["p", "Карл Маркс родился 5 мая 1818 года в городе Трире, который тогда входил в состав Пруссии. Он происходил из образованной семьи. Его отец, Генрих Маркс, был адвокатом, а мать, Генриетта Маркс, занималась семьёй. Родители происходили из еврейских семей, однако отец принял протестантство, поскольку действовавшие в Пруссии ограничения затрудняли профессиональную деятельность евреев."], ["p", "С ранних лет Маркс находился в окружении образованных людей. Его отец интересовался философией эпохи Просвещения и придерживался либеральных взглядов. Это способствовало формированию у будущего учёного интереса к общественным проблемам, политике и вопросам человеческой свободы."], ["p", "После окончания гимназии в Трире в 1835 году Маркс поступил в Боннский университет, где изучал юриспруденцию. Однако право не стало его главным интересом. Он всё больше увлекался философией, литературой и историей."], ["p", "В 1836 году Маркс перевёлся в Берлинский университет. Там он познакомился с философией Георга Вильгельма Фридриха Гегеля, которая оказала огромное влияние на его дальнейшее мировоззрение."], ["p", "Особенно важным для Маркса стало знакомство с идеей диалектики — представлением о том, что развитие мира и общества происходит через противоречия и их преодоление. Однако позднее Маркс пересмотрел философию Гегеля: если Гегель объяснял развитие мира прежде всего движением идей, то Маркс поставил в центр материальную жизнь людей и реальные общественные отношения."], ["p", "В 1841 году Маркс заочно подал докторскую диссертацию по философии в Йенский университет и получил степень доктора. Диссертация была посвящена различиям между философией природы Демокрита и Эпикура."], ["p", "Первоначально Маркс рассчитывал заниматься преподавательской деятельностью, однако его радикальные политические взгляды и цензура в Пруссии сделали академическую карьеру практически невозможной."], ["h", "Начало журналистской и политической деятельности"], ["p", "В 1842 году Маркс начал работать в газете «Рейнская газета» (Rheinische Zeitung), которая выступала за политические преобразования и критиковала существующий порядок."], ["p", "Вскоре он стал главным редактором издания. Работая журналистом, Маркс столкнулся с конкретными социальными и экономическими проблемами: бедностью крестьян, ограничением свободы печати, имущественным неравенством и влиянием собственников на государственную политику."], ["p", "Именно журналистская деятельность помогла ему перейти от отвлечённых философских рассуждений к исследованию реальных общественных отношений."], ["p", "В 1843 году прусские власти закрыли газету из-за её критической направленности."], ["p", "В июне 1843 года он женился на Женни фон Вестфален, с которой был знаком ещё с юности. Женни стала его спутницей на протяжении практически всей жизни."], ["p", "В 1843 году Маркс написал работу «К критике гегелевской философии права», в которой критически пересмотрел гегелевское учение о государстве и праве."], ["p", "После этого Маркс покинул Германию и переехал в Париж."], ["h", "Парижский период и сотрудничество с Энгельсом"], ["note", "Фридрих Энгельс (1820–1895)", "Немецкий философ, экономист и политический деятель. Ближайший соратник Маркса, его интеллектуальный партнёр и финансовая поддержка на протяжении многих лет."], ["p", "Парижский период (1843–1845) имел огромное значение для формирования взглядов Маркса."], ["p", "В Париже он познакомился с французскими социалистическими учениями и начал глубже изучать английскую политическую экономию. Его всё больше интересовали причины бедности, эксплуатации работников и имущественного неравенства."], ["p", "Особенно важным событием стало начало тесного сотрудничества с Фридрихом Энгельсом в 1844 году. Энгельс уже исследовал положение рабочего класса в условиях промышленной революции. Его наблюдения и исследования помогли Марксу лучше понять противоречия капиталистического общества."], ["p", "Между учёными установились дружеские и профессиональные отношения, которые продолжались до смерти Маркса."], ["p", "В этот период Маркс начал разрабатывать концепцию отчуждения труда. Он пришёл к выводу, что при капитализме работник не контролирует ни процесс собственного труда, ни его результаты. Работа становится для него вынужденной деятельностью, а произведённый продукт принадлежит владельцу средств производства."], ["p", "В 1844 году Маркс написал «Экономическо-философские рукописи», в которых впервые подробно изложил свои представления об отчуждении человека в капиталистическом обществе. При жизни автора эти рукописи опубликованы не были."], ["p", "В 1845 году по требованию прусских властей Маркс был вынужден покинуть Париж и переехать в Брюссель."], ["h", "Брюссельский период и формирование материалистического понимания истории"], ["p", "В Брюсселе Маркс продолжил сотрудничество с Энгельсом. Именно в этот период они начали совместную разработку концепции материалистического понимания истории."], ["p", "Маркс пришёл к выводу, что для понимания общества необходимо исследовать прежде всего не идеи, религию или политические взгляды людей, а материальные условия их жизни."], ["p", "Людям необходимо производить пищу, одежду, жильё и другие средства существования. Для этого они вступают в определённые экономические отношения. Именно эти отношения во многом определяют устройство общества, его политическую систему и господствующие идеи."], ["p", "В 1845–1846 годах Маркс и Энгельс написали «Немецкую идеологию». В ней они подвергли критике немецкую идеалистическую философию и изложили основы материалистического понимания истории."], ["p", "В 1847 году Маркс опубликовал работу «Нищета философии», в которой критиковал взгляды французского социалиста Пьера-Жозефа Прудона."], ["p", "В этот же период Маркс участвовал в деятельности международного рабочего движения и вступил в Союз коммунистов."], ["h", "«Манифест Коммунистической партии» и революции 1848 года"], ["p", "В феврале 1848 года Маркс и Энгельс опубликовали один из самых известных политических текстов в истории — «Манифест Коммунистической партии»."], ["p", "В нём авторы изложили основные положения своего понимания истории и общественного развития."], ["p", "Главная идея произведения выражена в словах: «история всех до сих пор существовавших обществ была историей борьбы классов». Авторы рассматривали развитие капитализма как процесс, который обостряет противоречия между буржуазией и пролетариатом."], ["p", "Маркс и Энгельс считали, что рабочий класс способен стать самостоятельной политической силой и изменить существующий общественный порядок."], ["p", "В 1848 году в Европе начались революционные выступления. Маркс вернулся в Германию и участвовал в политической деятельности, связанной с революционными событиями. Он работал в газете «Новая Рейнская газета»."], ["p", "Однако революции потерпели поражение, а политическая реакция усилилась. Маркс был вынужден покинуть Германию."], ["h", "Лондонский период: главные научные исследования"], ["p", "В 1849 году Маркс переехал в Лондон, где прожил оставшуюся часть жизни."], ["p", "Этот период был наиболее продолжительным и научно продуктивным. Маркс продолжал политическую деятельность, но основное внимание уделял изучению экономики и капиталистического производства."], ["p", "Жизнь семьи Маркса в Лондоне была очень тяжёлой. Они испытывали серьёзные финансовые трудности. Значительную помощь оказывал Энгельс, который работал на предприятии своего отца в Манчестере."], ["p", "Маркс много времени проводил в Британском музее, изучая экономическую статистику, отчёты фабричных инспекторов, работы экономистов и исторические материалы."], ["p", "Его главной задачей стало исследование капитализма как особой общественно-экономической системы."], ["p", "В 1859 году вышла работа «К критике политической экономии», в предисловии к которой Маркс сформулировал важные положения своей теории общественного развития."], ["p", "В 1864 году он участвовал в создании Международного товарищества рабочих, известного как Первый интернационал. Организация объединяла представителей рабочего движения разных стран. Маркс принимал участие в разработке её документов и был одним из наиболее влиятельных деятелей."], ["p", "В 1867 году вышел первый том главного экономического труда Маркса — «Капитал. Критика политической экономии»."], ["p", "В нём автор подробно исследовал капиталистическое производство, товар, деньги, рабочую силу, прибавочную стоимость и накопление капитала."], ["p", "Второй и третий тома «Капитала» были подготовлены и опубликованы Энгельсом уже после смерти Маркса, в 1885 и 1894 годах соответственно."], ["h", "Последние годы и смерть"], ["p", "В последние годы жизни здоровье Маркса ухудшалось. Он продолжал заниматься научной работой, однако болезни и семейные потери мешали ему завершить все задуманные исследования."], ["p", "В 1875 году Маркс написал «Критику Готской программы» — критический разбор программы германской социал-демократии, в котором говорится о двух фазах коммунистического общества."], ["p", "В 1881 году умерла его жена Женни. Это стало тяжёлым ударом для Маркса."], ["p", "14 марта 1883 года Карл Маркс умер в Лондоне. Он был похоронен на Хайгейтском кладбище."], ["p", "После его смерти Энгельс продолжил работу над рукописями друга, подготовил к публикации второй и третий тома «Капитала» и способствовал распространению его идей."], ["h", "Основные работы Карла Маркса"], ["tbl", [["Год", "Работа", "Основное содержание"], ["1843", "«К критике гегелевской философии права» (написано)", "Критика гегелевского учения о государстве и праве"], ["1843–1844", "«К еврейскому вопросу»", "Проблема политического и человеческого освобождения"], ["1844", "«Экономическо-философские рукописи» (написано)", "Отчуждение труда, положение человека при капитализме"], ["1845", "«Тезисы о Фейербахе» (написано)", "Критика созерцательного материализма, роль практики"], ["1845", "«Святое семейство» (с Энгельсом; издано)", "Критика младогегельянцев"], ["1845–1846", "«Немецкая идеология» (с Энгельсом; написано)", "Материалистическое понимание истории"], ["1847", "«Нищета философии» (издано)", "Критика экономических взглядов Прудона"], ["1848", "«Манифест Коммунистической партии» (с Энгельсом; издано)", "Классовая борьба, историческая роль пролетариата"], ["1852", "«Восемнадцатое брюмера Луи Бонапарта»", "Анализ политической власти и классовых отношений"], ["1859", "«К критике политической экономии»", "Основы материалистического понимания истории"], ["1867", "«Капитал», том I", "Анализ товара, стоимости, рабочей силы и прибавочной стоимости"], ["1875", "«Критика Готской программы» (написано)", "Две фазы коммунистического общества"], ["1885", "«Капитал», том II (посмертно)", "Процесс обращения капитала"], ["1894", "«Капитал», том III (посмертно)", "Процесс капиталистического производства в целом"]]], ["p", "Даты некоторых ранних работ обозначают время написания, а не публикации. Второй и третий тома «Капитала» изданы Энгельсом на основе рукописей Маркса."]]}, "simmel": {"name": "Георг Зиммель", "y": "1858–1918", "facts": [["Годы жизни", "1 марта 1858 года — 26 сентября 1918 года"]], "blocks": [["lead", "Немецкий философ и социолог, один из основоположников формальной социологии, представитель классической социологической мысли."], ["h", "Детство и образование"], ["p", "Георг Зиммель родился 1 марта 1858 года в Берлине, Пруссия. Он был младшим из семи детей в обеспеченной семье. Его отец, Эдуард Зиммель, занимался предпринимательской деятельностью, а мать, Флора Бодштейн, происходила из семьи, принявшей протестантство. Сам Георг был крещён в протестантской церкви."], ["p", "В 1874 году, после смерти отца, опекуном Зиммеля стал Юлиус Фридлендер — издатель музыкальной литературы. Он также оставил Зиммелю наследство, которое впоследствии помогало ему материально. Это было особенно важно, поскольку на протяжении значительной части академической карьеры Зиммель не имел постоянной высокооплачиваемой должности."], ["p", "В 1870–1876 годах Зиммель учился в берлинской гимназии Фридриха Вердера. После окончания гимназии он поступил в Берлинский университет, где в 1876–1881 годах изучал историю, философию, психологию и искусствоведение."], ["p", "Особое влияние на формирование его взглядов оказала философия Иммануила Канта. Зиммеля интересовали вопросы познания, устройства общества, человеческой индивидуальности и взаимодействия людей."], ["p", "В 1881 году он получил докторскую степень по философии. Его диссертация была посвящена различным представлениям Канта о сущности материи."], ["p", "Первоначально Зиммель пытался защитить работу, посвящённую психологическим и этнологическим исследованиям происхождения музыки, однако она не была принята из-за формальных недостатков и недостаточной точности аргументации. В итоге университет принял другую его работу, отмеченную в рамках научного конкурса."], ["p", "Получение докторской степени позволило ему продолжить академическую карьеру и заняться преподавательской деятельностью."], ["h", "Начало научной и преподавательской деятельности"], ["p", "В 1885 году Зиммель прошёл процедуру хабилитации — дополнительную квалификацию, необходимую для получения права преподавать в университете в качестве самостоятельного учёного. Его работа была посвящена философии Канта."], ["p", "После этого он получил должность приват-доцента Берлинского университета."], ["p", "Приват-доцент — преподаватель, который имеет право читать университетские лекции, но не занимает полноценную профессорскую должность и обычно не получает гарантированного университетского жалованья."], ["p", "Зиммель быстро приобрёл популярность среди студентов. Его лекции отличались необычной подачей материала, широтой интересов и способностью рассматривать философские проблемы через повседневную жизнь."], ["p", "Он мог рассуждать о таких вопросах, как деньги, мода, отношения между людьми, положение женщин, городская жизнь, искусство и религия."], ["p", "Особенностью его научного подхода стало стремление обнаруживать глубокие общественные закономерности в привычных явлениях, которые другие исследователи часто считали незначительными."], ["p", "Несмотря на популярность, Зиммель долгое время не мог получить полноценную профессорскую должность. Одной из причин были антисемитские предубеждения в немецкой академической среде. Хотя сам Зиммель был крещён в протестантство, происхождение его семьи продолжало влиять на отношение к нему."], ["p", "Таким образом, его научная карьера развивалась успешно с точки зрения интеллектуального признания, но сопровождалась серьёзными институциональными трудностями."], ["h", "Первые социологические исследования и формирование научных взглядов"], ["p", "В 1890 году Зиммель опубликовал работу «О социальной дифференциации» (Über sociale Differenzierung). Она стала одним из первых крупных исследований, в которых он обратился непосредственно к социологическим проблемам."], ["p", "В центре внимания Зиммеля находились процессы усложнения общества, разделения труда, формирования социальных групп и изменения отношений между отдельными людьми."], ["p", "Он стремился понять, как развитие общества влияет на положение человека, его свободу и индивидуальность."], ["p", "В 1892–1893 годах были опубликованы его работы по философии истории и этике. В них Зиммель продолжал исследовать вопросы общественного развития, человеческого поведения и моральных норм."], ["p", "Постепенно он пришёл к выводу, что социология должна иметь собственный предмет исследования. По его мнению, она не должна просто повторять задачи истории, экономики, психологии или философии."], ["p", "Особенность социологического подхода должна заключаться в изучении форм взаимодействия между людьми."], ["p", "Например, отношения подчинения и господства могут существовать в семье, государстве, экономической организации или религиозной группе. Несмотря на различие содержания этих отношений, их общая форма может быть сходной."], ["p", "Именно эта идея впоследствии стала основой формальной социологии Зиммеля."], ["h", "«Философия денег» и исследование современного общества"], ["p", "В 1900 году Зиммель опубликовал одну из своих наиболее известных работ — «Философию денег» (Philosophie des Geldes)."], ["p", "Эта книга стала важнейшим этапом развития его научной мысли. В ней он исследовал деньги не только как экономический инструмент, но и как явление, которое оказывает влияние на социальные отношения, человеческую психологию и культуру."], ["p", "Зиммель считал, что распространение денежных отношений меняет характер взаимодействия людей."], ["p", "Раньше многие отношения основывались на личной зависимости, традициях и непосредственном знакомстве. Развитие денежной экономики позволило людям взаимодействовать друг с другом без необходимости устанавливать тесные личные связи."], ["p", "Например, человек может приобретать товары и услуги у совершенно незнакомых людей, не вступая с ними в длительные отношения."], ["p", "С одной стороны, это расширяет свободу человека, поскольку он становится менее зависимым от конкретных людей. С другой стороны, отношения становятся более безличными и формальными."], ["p", "Зиммель также исследовал влияние денег на ценности человека. Он полагал, что деньги постепенно становятся универсальным средством сравнения различных благ, а экономическая оценка начинает проникать в разные сферы общественной жизни."], ["p", "Эта работа позволила ему показать, что экономические явления невозможно рассматривать исключительно с точки зрения производства и обмена. Они также формируют определённые типы социальных отношений и человеческого поведения."], ["h", "Развитие формальной социологии и признание Зиммеля"], ["p", "В начале XX века Зиммель продолжил исследование социальных взаимодействий."], ["p", "В 1903 году он опубликовал работу «Большие города и духовная жизнь» (Die Großstädte und das Geistesleben), в которой исследовал влияние городской среды на психологию и поведение человека."], ["p", "В 1905 году вышла работа «Философия моды», посвящённая социальным механизмам подражания и стремления к индивидуальности."], ["p", "В 1908 году была опубликована его главная социологическая работа — «Социология. Исследования форм обобществления» (Soziologie. Untersuchungen über die Formen der Vergesellschaftung)."], ["p", "В ней Зиммель систематизировал свои представления о формах взаимодействия людей. Он исследовал конфликт, обмен, конкуренцию, подчинение, господство, образование социальных групп и другие явления."], ["p", "Особое внимание он уделял тому, как численность группы влияет на отношения между её участниками. Так появились его известные исследования диады и триады."], ["p", "В 1909 году Зиммель вместе с другими немецкими учёными, в том числе Максом Вебером и Фердинандом Тённисом, участвовал в создании Немецкого социологического общества."], ["p", "Это было важным событием для становления социологии как самостоятельной научной дисциплины в Германии."], ["p", "В 1914 году Зиммель наконец получил полноценную профессорскую должность — его пригласили в Страсбургский университет, где он стал профессором философии."], ["p", "Однако его академическая карьера в Страсбурге оказалась непродолжительной. Вскоре началась Первая мировая война, которая сильно повлияла на университетскую и научную жизнь."], ["h", "Последние годы жизни и смерть"], ["p", "В последние годы Зиммель продолжал заниматься философией, культурой и вопросами человеческого существования."], ["p", "В 1917 году он опубликовал работу «Основные вопросы социологии» (Grundfragen der Soziologie), в которой ещё раз обратился к предмету и задачам социологической науки."], ["p", "В 1918 году вышла его работа «Взгляд на жизнь» (Lebensanschauung), посвящённая философии жизни и проблемам человеческого существования."], ["p", "Первая мировая война оказала значительное влияние на его мировоззрение. В поздних работах Зиммель уделял внимание вопросам культуры, истории, духовной жизни и человеческой свободы."], ["p", "26 сентября 1918 года Георг Зиммель умер в Страсбурге от рака печени."], ["p", "К моменту смерти он оставил огромное научное наследие: около двадцати книг и сотни статей и эссе, посвящённых философии, социологии, культуре, искусству и общественным отношениям."], ["p", "При жизни Зиммель не всегда получал признание, соответствующее масштабу его работ. Однако впоследствии его идеи стали чрезвычайно важными для развития социологии, особенно для изучения повседневных взаимодействий, социальных групп и городской культуры."], ["h", "Основные работы Георга Зиммеля"], ["tbl", [["Год", "Работа", "Основное содержание"], ["1890", "«О социальной дифференциации»", "Развитие общества, разделение труда, социальные группы"], ["1892–1893", "«Введение в науку о нравственности»", "Мораль, этика и общественные нормы"], ["1892", "«Проблемы философии истории»", "Методология исторического познания"], ["1900", "«Философия денег»", "Влияние денег на общество, культуру и отношения людей"], ["1903", "«Большие города и духовная жизнь»", "Влияние городской среды на личность"], ["1905", "«Философия моды»", "Подражание, индивидуальность и социальные различия"], ["1906", "«Религия»", "Социальные и культурные аспекты религии"], ["1907", "«Шопенгауэр и Ницше»", "Философские взгляды двух мыслителей"], ["1908", "«Социология. Исследования форм обобществления»", "Формальная социология, социальные формы, конфликт, диада и триада"], ["1910", "«Главные проблемы философии»", "Основные философские вопросы"], ["1911", "«Философская культура»", "Противоречия современной культуры"], ["1913", "«Гёте»", "Философский анализ личности и творчества Гёте"], ["1916", "«Рембрандт»", "Философия искусства"], ["1917", "«Основные вопросы социологии»", "Предмет, задачи и основные категории социологии"], ["1918", "«Взгляд на жизнь»", "Философия жизни и человеческого существования"]]]]}, "durkheim": {"name": "Эмиль Дюркгейм", "y": "1858–1917", "facts": [["Годы жизни", "15 апреля 1858 — 15 ноября 1917"]], "blocks": [["h", "Детство и образование"], ["p", "Давид Эмиль Дюркгейм родился 15 апреля 1858 года во французском городе Эпиналь, расположенном в исторической области Лотарингия. Он происходил из религиозной еврейской семьи: его отец, дед и прадед были раввинами. Поэтому изначально предполагалось, что Дюркгейм также продолжит семейную традицию и станет религиозным деятелем."], ["p", "Однако со временем его интересы изменились. Он отказался от карьеры раввина и решил посвятить себя науке и преподаванию. В юности Дюркгейм проявлял интерес к философии, этике и вопросам общественного устройства. Особое значение для него имели проблемы морали, религии и отношений между человеком и обществом."], ["p", "В 1879 году Дюркгейм поступил в Высшую нормальную школу в Париже — одно из наиболее престижных учебных заведений Франции. Там он изучал философию, историю и общественные науки. В этот период на него повлияли идеи Огюста Конта и Герберта Спенсера, которые стремились изучать общество с помощью научных методов."], ["p", "В 1882 году Дюркгейм получил право преподавать философию. Некоторое время он работал учителем в провинциальных учебных заведениях, однако постепенно его научные интересы всё больше смещались в сторону изучения общества."], ["h", "Начало научной и преподавательской деятельности"], ["p", "В 1885–1886 годах Дюркгейм совершил поездку в Германию, где познакомился с развитием немецкой философии и науки. Его особенно интересовали исследования морали, образования и общественной жизни."], ["p", "В 1887 году он получил должность преподавателя в университете Бордо (по данным Chicago Durkheim Archive — назначение на курс социальной науки и педагогики). Это событие стало важным этапом его карьеры: Дюркгейм начал систематически преподавать социальные науки и постепенно добиваться признания социологии как самостоятельной научной дисциплины."], ["p", "Именно в Бордо он подготовил свои первые крупные научные труды. В этот период Дюркгейм занимался вопросами общественного разделения труда, социальной солидарности, морали и причин общественного порядка."], ["p", "В 1893 году была опубликована его первая крупная работа — «О разделении общественного труда». В ней учёный попытался объяснить, каким образом общество сохраняет единство, несмотря на различия между людьми и усложнение общественной жизни."], ["p", "В 1895 году вышла книга «Правила социологического метода». В ней Дюркгейм сформулировал основные принципы научного изучения общества. Он считал, что социология должна иметь собственный предмет исследования и использовать строгие методы, а не ограничиваться философскими рассуждениями."], ["p", "В 1895 году (по данным Wikipedia) в Бордо открылось первое в Европе отделение (кафедра) социологии, которое возглавил Дюркгейм. Это стало одним из важнейших шагов в институциональном становлении социологии во Франции."], ["p", "В 1898 году Дюркгейм основал научный журнал «Социологический ежегодник» (L’Année Sociologique). Вокруг журнала сформировалась группа исследователей, занимавшихся различными вопросами общественной жизни. Они публиковали исследования по социологии, истории, религии, праву и другим дисциплинам."], ["h", "Исследование самоубийства"], ["p", "В 1897 году Дюркгейм опубликовал одну из наиболее известных своих работ — «Самоубийство»."], ["p", "Главная задача исследования заключалась в том, чтобы показать: даже явление, которое обычно во
