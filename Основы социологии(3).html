спринимается как исключительно личное решение человека, может иметь социальные причины."], ["p", "Дюркгейм изучал статистические данные о самоубийствах в разных европейских обществах и сравнивал показатели между социальными и религиозными группами. Он стремился установить связь между уровнем самоубийств и особенностями общественной организации."], ["p", "Учёный пришёл к выводу, что на подобные явления влияют степень включённости человека в общество и сила общественных норм, регулирующих его поведение."], ["p", "В этой работе Дюркгейм выделил несколько типов самоубийства, связанных с различными нарушениями общественных связей и регулирования. Подробно эти категории рассматриваются ниже в разделе об основных трудах."], ["h", "Работа в Сорбонне и исследование религии"], ["p", "В 1902 году Дюркгейм начал преподавать в Сорбонне в Париже, а в 1906 году получил там профессорскую должность."], ["p", "В этот период он продолжал заниматься вопросами морали, образования, религии и общественного единства. Особое внимание учёный уделял тому, каким образом общество формирует общие представления, ценности и правила поведения."], ["p", "В 1912 году вышла его последняя крупная прижизненная работа — «Элементарные формы религиозной жизни»."], ["p", "В ней Дюркгейм исследовал религию как общественное явление. Он стремился показать, что религия не ограничивается верой в сверхъестественные силы, а выполняет важные социальные функции: объединяет людей, закрепляет общие ценности и поддерживает чувство принадлежности к коллективу."], ["h", "Последние годы жизни"], ["p", "Начало Первой мировой войны стало тяжёлым периодом для Дюркгейма. Война сильно повлияла на учёного."], ["p", "Вскоре после этого состояние его здоровья ухудшилось. Эмиль Дюркгейм умер 15 ноября 1917 года в Париже."], ["p", "К моменту смерти он уже был признан одним из крупнейших представителей социологической науки. Его труды заложили основы систематического изучения социальных институтов, общественных норм, религии и социальной солидарности."], ["v", "Итог биографии", "Дюркгейм посвятил свою жизнь превращению социологии в самостоятельную научную дисциплину. Он стремился доказать, что общество обладает собственными закономерностями, которые нельзя объяснить исключительно индивидуальными особенностями людей. Центральными темами его исследований стали социальный порядок, общественная солидарность, мораль, религия и отношения между человеком и коллективом."], ["h", "Основные научные работы Дюркгейма"], ["h3", "«О разделении общественного труда» (1893)"], ["p", "Это первая крупная работа Дюркгейма, написанная на основе его докторской диссертации."], ["p", "В ней учёный исследовал, каким образом разделение труда влияет на устройство общества и отношения между людьми."], ["p", "Дюркгейм считал, что по мере развития общества труд становится всё более специализированным. Люди начинают выполнять разные функции и всё сильнее зависят друг от друга."], ["p", "Для объяснения этого процесса он выделил два типа социальной солидарности:"], ["li", "Механическая солидарность характерна преимущественно для традиционных обществ. Люди в них ведут похожий образ жизни, занимаются сходной деятельностью и придерживаются общих верований и обычаев. Общество объединяется благодаря сходству своих членов."], ["li", "Органическая солидарность характерна для современных сложных обществ. Люди выполняют разные функции, обладают различными знаниями и профессиями, но зависят друг от друга. Общество объединяется благодаря взаимной необходимости и разделению труда."], ["p", "Дюркгейм не считал, что развитие разделения труда автоматически приводит к разрушению общества. Напротив, оно может создавать новую форму единства. Однако для этого необходимы общие нормы и справедливое регулирование общественных отношений."], ["p", "Учёный также рассматривал ситуации, когда разделение труда развивается неправильно и перестаёт выполнять объединяющую функцию. Такие состояния он связывал с нарушением общественного порядка и недостатком регулирования."], ["v", "Главная идея", "общество сохраняет единство не только благодаря сходству людей, но и благодаря их взаимозависимости."], ["h3", "«Правила социологического метода» (1895)"], ["p", "В этой работе Дюркгейм сформулировал основные принципы социологии как самостоятельной науки."], ["p", "Главная задача учёного заключалась в определении того, что именно должна изучать социология и каким образом необходимо проводить исследования."], ["p", "Дюркгейм ввёл в центр социологического анализа понятие социального факта. Он считал, что общество воздействует на человека через нормы, правила, обычаи, традиции, законы и институты."], ["p", "Например, язык, религиозные представления, правила поведения и правовые нормы существуют независимо от конкретного человека. Человек рождается уже в обществе, где эти правила сложились до него. Он вынужден учитывать их, а за нарушение многих из них может столкнуться с общественным осуждением или наказанием."], ["p", "Дюркгейм сформулировал известное методологическое требование: социальные факты необходимо рассматривать как вещи. Это означает, что исследователь должен изучать их объективно, не подменяя научный анализ личными оценками и предположениями."], ["p", "Также он подчёркивал необходимость объяснять социальные явления через другие социальные явления, а не сводить их только к биологическим или психологическим причинам."], ["v", "Главная идея", "общество необходимо изучать научными методами, рассматривая социальные явления как самостоятельную реальность."], ["h3", "«Самоубийство» (1897)"], ["p", "В этой работе Дюркгейм показал, что даже индивидуальные поступки могут зависеть от общественных условий."], ["p", "Он изучал статистику самоубийств, сравнивал данные разных стран и социальных групп, обращал внимание на религиозную принадлежность, семейное положение и другие обстоятельства."], ["p", "Дюркгейм выделил четыре типа самоубийства:"], ["li", "Эгоистическое — связано со слабой социальной интеграцией, то есть недостаточной включённостью человека в общественные связи и группы."], ["li", "Альтруистическое — связано с чрезмерной социальной интеграцией, когда интересы и требования коллектива полностью преобладают над индивидуальными."], ["li", "Аномическое — возникает в условиях ослабления общественных норм и регулирования. Подобное состояние может сопровождать резкие экономические и социальные изменения."], ["li", "Фаталистическое — связано с чрезмерным общественным регулированием, когда жизнь человека оказывается подчинена слишком строгим ограничениям."], ["p", "Особое значение в работе имеет понятие аномии. Дюркгейм считал, что резкие перемены могут разрушать привычные нормы, из-за чего человеку становится сложнее понимать, какие правила регулируют общественную жизнь."], ["v", "Главная идея", "индивидуальное поведение нельзя полностью объяснить личными мотивами — необходимо учитывать социальную среду и положение человека в обществе."], ["h3", "«Элементарные формы религиозной жизни» (1912)"], ["p", "В этой работе Дюркгейм исследовал происхождение и общественное значение религии."], ["p", "Он стремился понять, почему религиозные верования существуют в разных обществах и какую роль они выполняют."], ["p", "Дюркгейм рассматривал религию прежде всего как социальное явление. По его мнению, религиозные верования и обряды выражают коллективную жизнь общества и помогают людям осознавать свою принадлежность к определённой группе."], ["p", "Особое внимание он уделил различию между священным и мирским:"], ["li", "Священное — всё то, что выделяется обществом как особенное, обладает особым значением и окружено запретами или правилами."], ["li", "Мирское — повседневная сфера жизни, обычные предметы и действия, не обладающие особым религиозным статусом."], ["p", "Дюркгейм также изучал тотемизм — одну из ранних форм религиозных представлений. Он считал, что тотем выступает символом не только определённого животного или предмета, но и самого коллектива."], ["p", "Религиозные обряды, по его мнению, укрепляют единство группы, поскольку во время совместных действий люди подтверждают общие верования и ценности."], ["v", "Главная идея", "религия объединяет общество, поддерживает коллективные представления и помогает людям ощущать принадлежность к общей группе."], ["h3", "Другие важные работы"], ["tbl", [["Год", "Название", "Основное содержание"], ["1888", "«Самоубийство и рождаемость»", "Ранние исследования социальных закономерностей"], ["1893", "«О разделении общественного труда»", "Механическая и органическая солидарность"], ["1895", "«Правила социологического метода»", "Предмет и методы социологии"], ["1897", "«Самоубийство»", "Социальные причины самоубийств"], ["1912", "«Элементарные формы религиозной жизни»", "Религия, коллективные представления и обряды"], ["1922", "«Воспитание и социология»", "Посмертное издание"], ["1925", "«Моральное воспитание»", "Посмертное издание лекций"]]], ["p", "Основные четыре работы, которые особенно важно запомнить: «О разделении общественного труда», «Правила социологического метода», «Самоубийство», «Элементарные формы религиозной жизни»."]]}}, "early": {"sub": "Представители раннего классического периода (1830–1880-е гг.)", "groups": [{"g": "Российские и австрийские представители", "p": [{"n": "Максим Ковалевский", "y": "1851–1916", "t": "Российский историк, социолог, юрист и общественный деятель. Родился 27 августа 1851 года в Харьковской губернии. Окончил юридический факультет Харьковского университета, затем продолжил образование в европейских университетах. Исследовал происхождение социальных институтов, семьи, собственности и государства, широко использовал сравнительно-исторический метод. Был профессором Московского и Санкт-Петербургского университетов, одним из организаторов российской социологии. Среди известных работ — «Историко-сравнительный метод в юриспруденции и приёмы изучения истории права» (1880), «Первобытное право» (1886). Умер 23 марта 1916 года в Петрограде."}, {"n": "Людвиг Гумплович", "y": "1838–1909", "t": "Австрийский социолог и юрист польского происхождения. Родился 9 марта 1838 года в Кракове. Преподавал в Грацском университете, где занимался вопросами государства, социальных групп и общественных конфликтов. Был одним из представителей конфликтного направления в социологии: считал, что борьба между социальными группами является важным фактором исторического развития. Основные труды: «Расовая борьба» (1883), «Основы социологии» (1885), «Система социологии» (1887). Умер 19 августа 1909 года в Граце."}, {"n": "Густав Ратценхофер", "y": "1842–1904", "t": "Австрийский военный, философ и социолог. Родился 4 июля 1842 года в Вене. Сделал карьеру в австрийской армии, дослужился до высокого военного чина, позднее занялся философией и социологией. Развивал конфликтный подход к изучению общества, уделял внимание социальным интересам, политике и борьбе групп. Среди основных работ — «Сущность и цель политики» (1893), «Социологическое познание» (1898), «Позитивная этика» (1901). Умер 8 октября 1904 года во время морского путешествия между Америкой и Европой."}]}, {"g": "Американские представители", "p": [{"n": "Альбион Смолл", "y": "1854–1926", "t": "Американский социолог, один из организаторов профессиональной социологии в США. Родился 11 мая 1854 года в городе Бакфилд, штат Мэн. Получил образование в Колби-колледже, изучал теологию, затем продолжил обучение в университетах Германии. В 1892 году организовал первое в США университетское отделение социологии в Чикагском университете. Основные работы: «Общая социология» (1905), «Камерлисты» (1909), «Истоки социологии» (1924). Умер 24 марта 1926 года."}, {"n": "Уильям Грэм Самнер", "y": "1840–1910", "t": "Американский социолог, экономист и преподаватель Йельского университета. Родился 30 октября 1840 года в Патерсоне, штат Нью-Джерси. Получил образование в Йельском университете, а также изучал богословие и историю в Европе. Исследовал обычаи, традиции, социальные нормы и межгрупповые отношения; ввёл в широкое научное употребление понятие этноцентризма. Основные работы: «Что социальные классы должны друг другу» (1883), «Народные обычаи» (1907). Умер 12 апреля 1910 года."}]}, {"g": "Российские представители органицизма", "p": [{"n": "Александр Стронин", "y": "1826–1889", "t": "Российский историк, педагог и социолог, представитель органического направления. Родился 4 марта 1826 года в Курской губернии. Окончил историко-филологический факультет Киевского университета, работал преподавателем, занимался общественной и просветительской деятельностью. В своих работах сравнивал общество с живым организмом и рассматривал его развитие как закономерный процесс. Основные труды: «История и метод» (1869), «Политика как наука» (1872), «История общественности» (1885). Умер 10 февраля 1889 года в Ялте."}, {"n": "Павел Лилиенфельд", "y": "1829–1903", "t": "Российский социолог, государственный деятель и представитель органицизма. Родился в 1829 году в Российской империи. Получил образование и сделал административную карьеру, занимал государственные должности. Развивал представление об обществе как о системе, сходной с биологическим организмом, в которой отдельные элементы взаимосвязаны. Главная работа — «Мысли о социальной науке будущего» (русск. изд. 1872; нем. изд. 1873–1881, 5 томов). Умер в 1903 году."}]}, {"g": "Французские и английские представители натуралистических направлений", "p": [{"n": "Артур де Гобино", "y": "1816–1882", "t": "Французский дипломат, писатель и публицист. Родился 14 июля 1816 года во Франции, недалеко от Парижа. Известен прежде всего своей расово-антропологической теорией, изложенной в работе «Опыт о неравенстве человеческих рас» (1853–1855). В ней он пытался объяснить историческое развитие обществ через расовые различия. Его расовые теории сегодня считаются научно несостоятельными и сыграли отрицательную роль в истории расистской идеологии. Умер 13 октября 1882 года в Турине."}, {"n": "Шарль Летурно", "y": "1831–1902", "t": "Французский антрополог и социолог. Родился в 1831 году, получил медицинское образование. Занимался сравнительным изучением общественного устройства, семьи, брака, собственности и права у различных народов. Использовал антропологические и исторические материалы для объяснения развития социальных институтов. Среди его известных работ — «Эволюция брака и семьи» (1888), «Эволюция собственности» (1889). Умер в 1902 году."}, {"n": "Генри Томас Бокль", "y": "1821–1862", "t": "Английский историк, представитель географического направления в общественной мысли. Родился 24 ноября 1821 года в Лондоне. Из-за слабого здоровья получил преимущественно домашнее образование и много занимался самообразованием. Считал, что историческое развитие обществ зависит от закономерностей, которые можно изучать научными методами, в том числе с учётом природных и географических условий. Главный труд — «История цивилизации в Англии» (1857–1861), оставшийся незавершённым. Умер 29 мая 1862 года в Дамаске."}]}, {"g": "Географическое направление", "p": [{"n": "Фридрих Ратцель", "y": "1844–1904", "t": "Немецкий географ и исследователь, один из основателей антропогеографии. Родился 30 августа 1844 года в Карлсруэ. Изучал естественные науки и географию, преподавал в Лейпцигском университете. Исследовал влияние природной среды, климата и географического положения на развитие народов и государств. Основные работы: «Антропогеография» (1882–1891), «Народоведение» (1885–1888), «Политическая география» (1897). Умер 9 августа 1904 года."}, {"n": "Элизе Реклю", "y": "1830–1905", "t": "Французский географ, писатель и общественный деятель. Родился 15 марта 1830 года в Сент-Фуа-ла-Гранд. Изучал географию в Берлинском университете, путешествовал и занимался исследованием различных стран и народов. Рассматривал взаимосвязь природы, населения и общественной организации. Главный труд — многотомная «Новая всеобщая география: Земля и люди» (1876–1894). Умер 4 июля 1905 года в Бельгии."}, {"n": "Лев Мечников", "y": "1838–1888", "t": "Российский географ, социолог, публицист и общественный деятель. Родился 30 мая 1838 года в Санкт-Петербурге. Значительную часть жизни провёл за границей, занимался научной и публицистической деятельностью. Развивал географический подход к изучению истории, считая, что природные условия и доступ к водным путям влияют на общественное развитие. Главный труд — «Цивилизация и великие исторические реки» (1889, опубликован посмертно). Умер 30 июня 1888 года (18 июня по ст. ст.) в Кларане, Швейцария."}]}, {"g": "Марксистское направление", "p": [{"n": "Фридрих Энгельс", "y": "1820–1895", "t": "Немецкий философ, экономист и общественный деятель. Родился 28 ноября 1820 года в Бармене в семье состоятельного промышленника. Работал в торговом деле, в том числе в Манчестере, где непосредственно познакомился с условиями жизни и труда английских рабочих. Стал ближайшим соратником Карла Маркса, участвовал в разработке марксистской теории и после смерти Маркса подготовил к публикации второй и третий тома «Капитала». Основные работы: «Положение рабочего класса в Англии» (1845), «Манифест Коммунистической партии» (1848, совместно с Марксом), «Анти-Дюринг» (1878). Умер 5 августа 1895 года в Лондоне."}, {"n": "Георгий Плеханов", "y": "1856–1918", "t": "Российский революционер, философ и один из основателей русского марксизма. Родился 29 ноября 1856 года по старому стилю в Тамбовской губернии. Первоначально участвовал в народническом движении, но впоследствии перешёл на позиции марксизма и эмигрировал в Швейцарию. Создал группу «Освобождение труда» (1883), занимался распространением марксистских идей в России. Основные работы: «Социализм и политическая борьба» (1883), «Наши разногласия» (1885), «К вопросу о развитии монистического взгляда на историю» (1895). Умер 30 мая 1918 года в Финляндии."}, {"n": "Владимир Ленин", "y": "1870–1924", "t": "Российский революционер, политический деятель и теоретик марксизма. Родился 22 апреля 1870 года в Симбирске под именем Владимир Ульянов. Получил юридическое образование, занимался революционной и политической деятельностью, развивал марксистские идеи применительно к российским условиям. Среди наиболее известных работ — «Развитие капитализма в России» (1899), «Что делать?» (1902), «Материализм и эмпириокритицизм» (1909), «Империализм как высшая стадия капитализма» (1916). Умер 21 января 1924 года в Горках Московской губернии."}]}]}, "late": {"sub": "Представители позднего классического периода (1880–1920-е гг.)", "groups": [{"g": "Американская социология и психологическое направление", "p": [{"n": "Лестер Уорд", "y": "1841–1913", "t": "Американский социолог, ботаник и палеонтолог. Родился 18 июня 1841 года в Джолиете, штат Иллинойс. Получил образование в Колумбийском университете (ныне Университет Джорджа Вашингтона), участвовал в Гражданской войне в США. Считал, что общество можно целенаправленно совершенствовать с помощью науки и образования. Основные работы: «Динамическая социология» (1883), «Психические факторы цивилизации» (1893), «Чистая социология» (1903). Был первым президентом Американского социологического общества. Умер 18 апреля 1913 года."}, {"n": "Франклин Гиддингс", "y": "1855–1931", "t": "Американский социолог, один из представителей ранней американской академической социологии. Родился 23 марта 1855 года в Шермане, штат Коннектикут. Преподавал в Колумбийском университете, где занимал должность профессора социологии. Исследовал социальные группы, общественное сознание и процессы объединения людей. Основной труд — «Принципы социологии» (1896). Умер в 1931 году в Скарсдейле, штат Нью-Йорк."}]}, {"g": "Российская социология", "p": [{"n": "Евгений де Роберти", "y": "1843–1915", "t": "Российский философ, социолог и представитель позитивизма. Родился 25 декабря 1843 года по новому стилю в Подольской губернии. Окончил Александровский лицей, изучал естественные и общественные науки в университетах Германии и Франции. Разрабатывал позитивистскую концепцию социологии, уделял внимание взаимодействию социальных, психологических и исторических факторов. Среди его трудов — «Социология: её основные задачи и методы» и другие работы по философии и общественным наукам. Умер в 1915 году в Тверской губернии."}, {"n": "Николай Кареев", "y": "1850–1931", "t": "Российский историк, социолог и методолог исторической науки. Родился 6 декабря 1850 года в Москве. Окончил историко-филологический факультет Московского университета, занимался преподавательской и исследовательской деятельностью. Изучал закономерности исторического процесса, общественное развитие, социальные институты и методологию истории. Среди основных работ — «Основные вопросы философии истории» (1883), «Введение в изучение социологии» (1897). Умер 18 февраля 1931 года в Ленинграде."}]}, {"g": "Психологическое направление", "p": [{"n": "Вильгельм Вундт", "y": "1832–1920", "t": "Немецкий психолог, физиолог и философ. Родился 16 августа 1832 года в Неккарау, недалеко от Мангейма. Получил медицинское образование, преподавал в Гейдельбергском и Лейпцигском университетах. В 1879 году создал первую экспериментальную психологическую лабораторию в Лейпциге. Занимался также изучением коллективной психологии, языка, мифов и обычаев народов. Главные труды: «Основы физиологической психологии» (1874), «Психология народов» (1900–1920). Умер 31 августа 1920 года."}, {"n": "Габриэль Тард", "y": "1843–1904", "t": "Французский социолог, философ и криминолог. Родился 12 марта 1843 года в городе Сарла. Получил юридическое образование, работал судьёй и занимался изучением преступности. Разработал теорию подражания, согласно которой распространение социальных явлений во многом происходит благодаря копированию людьми поведения друг друга. Основные работы: «Законы подражания» (1890), «Социальная логика» (1895), «Мнение и толпа» (1901). Умер 12 мая 1904 года в Париже."}, {"n": "Гюстав Лебон", "y": "1841–1931", "t": "Французский врач, психолог и социолог. Родился 7 мая 1841 года в Ножан-ле-Ротру. Получил медицинское образование в Париже, путешествовал по Европе, Азии и Северной Африке. Изучал поведение толпы, массовую психологию и механизмы общественного воздействия. Главная работа — «Психология народов и масс» (1895), известная также под названием «Психология толп». Умер 13 декабря 1931 года во Франции."}, {"n": "Уильям Мак-Дугалл", "y": "1871–1938", "t": "Британский психолог, представитель инстинктивистского направления в социальной психологии. Родился 22 июня 1871 года в Чаддертоне, графство Ланкашир. Получил образование в Манчестерском и Кембриджском университетах, изучал биологию, медицину и психологию. Считал, что врождённые инстинкты оказывают значительное влияние на поведение человека и общественные отношения. Основные работы: «Введение в социальную психологию» (1908), «Тело и разум» (1911). Преподавал в Гарвардском и Дьюкском университетах. Умер 28 ноября 1938 года."}]}, {"g": "Формальная социология", "p": [{"n": "Чарльз Кули", "y": "1864–1929", "t": "Американский социолог и социальный психолог. Родился 17 августа 1864 года в Анн-Арборе, штат Мичиган. Получил образование в Мичиганском университете, где впоследствии преподавал. Разрабатывал концепцию «зеркального Я», согласно которой представление человека о себе формируется через восприятие и оценки окружающих. Особое внимание уделял первичным группам — семье, друзьям и небольшим коллективам. Основные работы: «Человеческая природа и социальный порядок» (1902), «Социальная организация» (1909), «Социальный процесс» (1918). Умер 7 мая 1929 года."}]}, {"g": "Итальянская социологическая школа", "p": [{"n": "Вильфредо Парето", "y": "1848–1923", "t": "Итальянский экономист, инженер и социолог. Родился 15 июля 1848 года в Париже в семье итальянского эмигранта и француженки. Получил инженерное образование в Туринском политехническом институте, занимался экономикой и общественной деятельностью. Разрабатывал теорию элит, согласно которой в любом обществе существует управляющее меньшинство, сменяющееся в процессе циркуляции элит. Основные работы: «Курс политической экономии» (1896–1897), «Трактат по общей социологии» (1916). Умер 19 августа 1923 года в Швейцарии."}]}, {"g": "Российско-американская социология", "p": [{"n": "Питирим Сорокин", "y": "1889–1968", "t": "Российско-американский социолог, один из крупнейших представителей социологии XX века. Родился 21 января 1889 года в селе Турья Вологодской губернии. Учился в Санкт-Петербурге, занимался политической деятельностью, после революции работал профессором социологии. В 1922 году был выслан из Советской России, после чего эмигрировал в США. С 1930 года работал в Гарвардском университете, где организовал социологическое отделение. Разрабатывал теорию социокультурной динамики, исследовал социальную мобильность, революции и общественные изменения. Основные работы: «Система социологии» (1920), «Социология революции» (1925), «Социальная и культурная динамика» (1937–1941). Умер 10 февраля 1968 года в США."}]}]}, "photos": {"weber": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJfAbgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAECAwUGAAcI/8QAPhAAAgEDAwMDAwMDAgQGAQUBAQIDAAQREiExBRNBBiJRMmFxFCNCB1KBkaEVJDNiCENyscHRFiU0U4Lhov/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwANJXkjLCIAHYmpkSJNDKpbG1IJIGjdQSI/gHfNdHCmEWFmGdxk8UHTzEgqIiMHGB5qCV9Crg6M8g+amQs6MxQlx9Tg7VG0ccpDsdS4z9waAcMv6kIV0g+TS3KydnGsGMNnV8V0pQoH7bM6nbfxUcqd6MokZQE5zq80A0crCYkEsCMb1PbyKFdZNgaj1pDGYZEKuP5CmpbMF1ai6nwBQSTLDC47ZwMZ1U6SdRHq2cionhDEhlOkDOKjER06v4fFAXBciMZcZzxjxT9ZMqskmM+DzUCrHbkMXGgjj4rotYnGF72TyPAoCJwxct3AeMipVTtSg2jal85pksRiLPkbjgeKltbZBErrkEH5oLS2kJkUMu5HNOubYsUBPtJzTVm7Jj1EEEZGPApLu5dmUwRFwQcDPFAFcLJaSsuA4fiqy4lXUY5ZA7S7hR/Girh2ckySEELstVs9qUZWjQkgZyTv/rQB6e0z6mEYBxk1XqXiaRg4YMasHWEe+RH1EHYnIz80FKYpkBV/aDuAMb0Et1JGwjxAutFwTmobeCc5kV0Ug5I84oqC3btd5Srb7huRUlnZv1C9NtbW8ktywwqKME//AOUEE8eoSlHBAwTXWlo8kRkZSEbOCa9L6d/SaXp0H/FOuzJC  образование изучают сразу несколько наук. Педагогика исследует процессы обучения и воспитания, экономика — финансирование образования, а социология — социальное неравенство в доступе к образованию, отношения между участниками образовательного процесса и влияние образования на положение человека в обществе."], ["p", "Важное место в определении предмета социологии занимает понятие социального факта, разработанное Эмилем Дюркгеймом. Социальные факты — это способы мышления, деятельности и чувствования, которые существуют вне отдельного человека и оказывают на него принудительное воздействие. К ним относятся нормы, законы, обычаи, традиции и общественные институты."], ["h", "Структура социологии"], ["p", "Структура социологии представляет собой систему взаимосвязанных уровней и направлений социологического знания."], ["p", "Обычно выделяют три основных уровня:"], ["ol", 1, ["Теоретическая социология — занимается разработкой общих понятий, теорий и закономерностей развития общества. Она отвечает на вопросы о том, как устроено общество, почему возникают социальные изменения и какие механизмы обеспечивают общественный порядок.", "Эмпирическая социология — направлена на получение конкретных сведений о социальной действительности. Для этого используются опросы, интервью, наблюдение, анализ документов и статистических данных. Например, исследование отношения студентов к дистанционному обучению.", "Прикладная социология — использует социологические знания и результаты исследований для решения конкретных общественных и практических задач. Например, разработка рекомендаций по улучшению условий труда или организации образовательного процесса."]], ["p", "Также социологию делят по масштабу изучаемых явлений:"], ["ul", ["Микросоциология исследует поведение людей, межличностные отношения и взаимодействия в небольших группах.", "Макросоциология изучает крупные социальные структуры, институты, общество в целом и масштабные социальные процессы."]], ["v", "Главное для запоминания", "объект социологии — общество и социальная реальность; предмет — закономерности социального взаимодействия и развития общества. Структура включает теоретический, эмпирический и прикладной уровни."]]}, {"n": 2, "q": "Функции социологии. Социология и другие науки об обществе.", "b": [["h", "Функции социологии"], ["p", "Социология выполняет несколько взаимосвязанных функций, благодаря которым она имеет значение как для науки, так и для практической общественной жизни."], ["ul", ["Познавательная — получение новых знаний об обществе, выявление социальных закономерностей и объяснение общественных явлений. Познавательная функция заключается в изучении общества, социальных отношений и процессов. Социология собирает и анализирует информацию, выявляет закономерности общественного развития и объясняет причины социальных явлений.", "Практическая — применение результатов исследований для решения конкретных социальных проблем. Практическая функция состоит в использовании полученных знаний для решения общественных проблем. Результаты социологических исследований могут применяться органами управления, образовательными организациями, предприятиями и общественными объединениями.", "Прогностическая — выявление возможных направлений и последствий общественного развития. Прогностическая функция позволяет предполагать возможные варианты развития социальных процессов. Например, социологические исследования могут помочь оценить последствия изменения демографической ситуации или уровня занятости населения.", "Мировоззренческая — формирование научного представления об обществе и месте человека в нём. Мировоззренческая функция способствует формированию научного взгляда на общество. Человек начинает лучше понимать, как социальная среда влияет на его поведение, возможности и жизненные обстоятельства.", "Критическая — выявление противоречий, проблем и негативных сторон общественной жизни. Критическая функция позволяет выявлять противоречия и недостатки общественной жизни, обращать внимание на социальное неравенство, дискриминацию, конфликты и другие проблемы.", "Методологическая — разработка подходов и методов изучения социальных процессов. Методологическая функция заключается в разработке методов и принципов исследования общества. Социология использует различные способы получения информации: анкетирование, интервью, наблюдение, анализ документов и статистику."]], ["p", "Таким образом, социология не только описывает общество, но и объясняет происходящие в нём процессы, помогает выявлять проблемы и оценивать возможные последствия общественных изменений."], ["h", "Социология и другие науки об обществе"], ["p", "Социология тесно связана с другими общественными и гуманитарными науками. Все они изучают человека и общество, но рассматривают их с разных сторон."], ["p", "**Социология и философия.** Философия исследует наиболее общие вопросы существования человека, общества и познания. Социология использует философские представления о мире и обществе, но стремится изучать социальную действительность с помощью специальных научных методов и конкретных исследований."], ["p", "**Социология и история.** История изучает конкретные события и процессы прошлого, их причины и последствия. Социология исследует общие закономерности общественной жизни и социальные механизмы, которые могут проявляться в разные исторические периоды. Исторические данные помогают социологам сравнивать общества и анализировать социальные изменения."], ["p", "**Социология и экономика.** Экономика изучает производство, распределение, обмен и потребление материальных благ. Социология исследует социальные отношения, возникающие в экономической сфере: положение различных социальных групп, трудовые отношения, неравенство, безработицу и потребительское поведение."], ["p", "**Социология и политология.** Политология изучает политическую власть, государство, политические институты и процессы. Социология рассматривает социальные основания политики: политическое поведение населения, общественное мнение, участие граждан в политической жизни и отношения между социальными группами и властью."], ["p", "**Социология и психология.** Психология изучает психику, поведение и особенности личности. Социология обращает внимание на влияние общества и социальной среды на человека, а также на взаимодействие личности с другими людьми и группами."], ["p", "**Социология и социальная антропология.** Обе науки изучают общественную жизнь, культуру и социальные отношения. Социальная антропология традиционно уделяет большое внимание культурным особенностям и повседневной жизни различных сообществ, а социология чаще рассматривает более широкий круг современных социальных структур и институтов."], ["p", "**Социология и правоведение.** Правоведение исследует право, законодательство и правовые институты. Социология изучает право как социальное явление: причины возникновения правовых норм, отношение населения к законам, правовое поведение и влияние законодательства на общество."], ["p", "Таким образом, социология занимает особое место среди наук об обществе. Она взаимодействует с ними, использует их достижения, но отличается собственным предметом — социальными отношениями, взаимодействиями и закономерностями общественной жизни."], ["v", "Главное для запоминания", "социология связана с философией, историей, экономикой, политологией, психологией и правоведением. Её особенность — изучение общества через социальные отношения, группы, институты и процессы."]]}, {"n": 3, "q": "Понятие и основные признаки социальной реальности. Подходы к объяснению социальной реальности.", "b": [["h", "Понятие социальной реальности"], ["p", "**Социальная реальность — это совокупность социальных явлений, процессов, отношений и норм, которые возникают в результате взаимодействия людей и существуют как объективная данность, одновременно осмысливаемая самими людьми.**"], ["p", "Социальная реальность формируется в процессе совместной жизни людей. Она включает общественные институты, социальные группы, нормы, ценности, традиции, отношения и различные формы взаимодействия."], ["p", "Например, семья, государство, образование, религия, деньги, язык и право относятся к социальной реальности. Они созданы и поддерживаются людьми, но при этом существуют независимо от воли отдельного человека и влияют на его поведение."], ["p", "Социальная реальность обладает двойственным характером: с одной стороны, она создаётся людьми, а с другой — сама воздействует на них, определяя правила и условия общественной жизни."], ["h", "Основные признаки социальной реальности"], ["p", "В социологии можно выделить несколько фундаментальных признаков социальной реальности."], ["ol", 1, ["Надындивидуальность."]], ["p", "Социальная реальность существует за пределами отдельного человека и не зависит от его личных желаний. Человек рождается в уже сложившемся обществе, где существуют язык, нормы, традиции, законы и социальные институты."], ["p", "Например, отдельный человек не может по собственному желанию изменить значение всех слов в языке или отменить действующие законы."], ["ol", 2, ["Принудительный характер."]], ["p", "Социальная реальность оказывает влияние на поведение людей и предполагает определённые ограничения. За нарушение общественных норм могут следовать санкции — от неодобрения окружающих до юридического наказания."], ["p", "Например, за нарушение правил поведения в учебном заведении человек может получить замечание, а за нарушение закона — понести установленную законом ответственность."], ["ol", 3, ["Субъективная осмысленность."]], ["p", "Социальные явления связаны со значениями, которые люди придают своим действиям и окружающему миру. Люди не просто взаимодействуют друг с другом, но и интерпретируют поступки, оценивают ситуации и руководствуются определёнными мотивами."], ["p", "Например, один и тот же поступок может восприниматься по-разному в зависимости от его цели и обстоятельств."], ["ol", 4, ["Интерсубъективность."]], ["p", "Социальная реальность обладает общезначимым характером: представления и значения становятся понятными и разделяемыми несколькими людьми. Благодаря этому люди могут взаимодействовать и понимать друг друга."], ["p", "Например, деньги имеют ценность не только потому, что человек лично считает их важными, но и потому, что общество признаёт их средством обмена."], ["ol", 5, ["Символический характер."]], ["p", "Социальная реальность включает символы, с помощью которых люди передают значения и выражают принадлежность к определённым группам. К символам относятся язык, государственная символика, религиозные знаки, ритуалы и различные условные обозначения."], ["ol", 6, ["Упорядоченность и институциональность."]], ["p", "Социальная жизнь не является хаотичной. Она организована через нормы, правила, социальные роли и институты. Институты закрепляют устойчивые способы организации общественных отношений."], ["p", "Например, институт образования регулирует процесс передачи знаний, устанавливает роли преподавателей и обучающихся, определяет правила обучения."], ["ol", 7, ["Процессуальность."]], ["p", "Социальная реальность постоянно изменяется. Общество развивается, появляются новые социальные отношения, нормы, технологии и формы взаимодействия. При этом некоторые социальные институты сохраняются, хотя и могут менять своё содержание."], ["p", "Например, развитие цифровых технологий привело к появлению новых форм общения, дистанционной работы и онлайн-образования."], ["h", "Основные подходы к объяснению социальной реальности"], ["p", "В социологии существуют разные подходы к объяснению того, как существует социальная реальность и какую роль в её формировании играет человек."], ["ol", 1, ["Социологический реализм."]], ["p", "Согласно социологическому реализму, социальная реальность существует объективно и независимо от сознания и воли отдельных индивидов."], ["p", "Общество рассматривается как самостоятельная система, которая обладает собственными закономерностями и оказывает влияние на человека."], ["p", "Наиболее ярким представителем такого подхода является Эмиль Дюркгейм. Он утверждал, что социальные факты необходимо изучать как объективные явления, существующие вне отдельного человека и оказывающие на него принудительное воздействие."], ["p", "Например, язык существует до рождения конкретного человека, однако человек вынужден его усваивать, чтобы взаимодействовать с окружающими."], ["ol", 2, ["Социологический номинализм."]], ["p", "Согласно социологическому номинализму, социальная реальность не существует как самостоятельная сущность вне отдельных людей. Она формируется через действия, взаимодействия и представления индивидов."], ["p", "С этой точки зрения, общество нельзя полностью отделить от людей, которые его создают и воспроизводят."], ["p", "Важное значение здесь имеет подход Макса Вебера. Он рассматривал социальное действие как действие, которому человек придаёт субъективный смысл и которое ориентировано на других людей."], ["p", "Например, очередь существует не как отдельный физический объект, а благодаря тому, что люди признают определённый порядок ожидания и следуют ему."], ["ol", 3, ["Конструктивистский подход."]], ["p", "Конструктивистский подход рассматривает социальную реальность как результат постоянного взаимодействия людей, в ходе которого формируются и закрепляются общие значения, нормы и представления."], ["p", "Люди создают социальные правила, передают их следующим поколениям и воспринимают уже сложившиеся порядки как естественные и объективные."], ["p", "Важным представителем данного направления является Питер Бергер, который совместно с Томасом Лукманом разработал концепцию социального конструирования реальности. Они показали, как человеческие действия превращаются в устойчивые общественные порядки и институты."], ["p", "Таким образом, социальная реальность одновременно создаётся людьми и становится внешней по отношению к ним системой, которая влияет на их дальнейшее поведение."]], "nb": 1}, {"n": 4, "q": "Критерии периодизации и этапы развития социологии.", "b": [["p", "**Периодизация социологии — это разделение истории социологической науки на определённые этапы.** Она нужна, чтобы проследить, как менялись представления об обществе, методы его изучения и сама роль социологии."], ["p", "Единой периодизации не существует: разные исследователи могут выделять этапы по разным основаниям. Чаще всего учитывают, когда социология оформилась как самостоятельная наука, какие теоретические направления преобладали, какие методы использовались и в каких исторических условиях развивалась дисциплина."], ["p", "Основные критерии периодизации:"], ["ul", ["Исторический: учитывает важнейшие события и изменения в обществе, повлиявшие на развитие науки.", "Теоретический: опирается на появление и смену основных социологических школ и концепций.", "Методологический: учитывает развитие способов исследования общества — от философских рассуждений до наблюдений, опросов и статистического анализа.", "Институциональный: связан с превращением социологии в самостоятельную университетскую дисциплину, появлением кафедр, научных журналов и профессиональных объединений."]], ["h", "Основные этапы развития социологии"], ["ol", 1, ["Предыстория социологии — Античность – XVIII век."]], ["p", "На этом этапе социология ещё не существовала как самостоятельная наука, однако уже формировались представления об обществе, государстве, власти и отношениях между людьми."], ["p", "В Античности Платон и Аристотель размышляли об устройстве государства, причинах общественных конфликтов и формах правления. В Средние века Ибн Хальдун исследовал развитие государств, социальную сплочённость и отношения между кочевыми и оседлыми народами. В эпоху Нового времени и Просвещения общественные мыслители стали активнее рассматривать общество с помощью разума и наблюдений, а не только религиозных объяснений."], ["ol", 2, ["Возникновение социологии — первая половина XIX века."]], ["p", "Социология складывается как самостоятельная область знания. Главную роль в этом процессе сыграл Огюст Конт, который предложил изучать общество научными методами и ввёл в научный оборот термин «социология» в 1838 году."], ["p", "На этом этапе формируется позитивизм — подход, согласно которому знания об обществе должны опираться на наблюдения, факты и выявление закономерностей."], ["ol", 3, ["Классический этап — вторая половина XIX – начало XX века."]], ["p", "Это время формирования основных социологических теорий и направлений. Учёные стремились объяснить, как устроено общество, почему оно изменяется, что влияет на поведение людей и как возникают социальные отношения."], ["p", "К важнейшим представителям классической социологии относятся Герберт Спенсер, Карл Маркс, Эмиль Дюркгейм, Макс Вебер, Фердинанд Тённис, Георг Зиммель, Вильфредо Парето."], ["p", "В этот период социология постепенно становится самостоятельной университетской дисциплиной, развиваются её методы и научные организации."], ["ol", 4, ["Развитие современной социологии — XX век."]], ["p", "В XX веке социология активно развивается в Европе и США. Появляются новые теоретические направления: структурный функционализм, символический интеракционизм, теория конфликта, феноменологическая социология и другие."], ["p", "Большое значение приобретают эмпирические исследования: опросы, интервью, наблюдения, анализ документов и статистических данных. Социология начинает широко использоваться для изучения городов, семьи, образования, труда, массовой коммуникации и других сфер общественной жизни."], ["ol", 5, ["Современный этап — конец XX – XXI век."]], ["p", "Современная социология отличается разнообразием теорий и методов. Исследователи изучают глобализацию, цифровое общество, социальные сети, миграцию, неравенство, изменение ценностей, экологические проблемы и трансформацию социальных институтов."], ["p", "Сегодня социология сочетает теоретические объяснения общественных процессов с практическими исследованиями и анализом больших массивов данных."], ["v", "Главное для запоминания", "социология прошла путь от философских размышлений об обществе к самостоятельной науке с собственными теориями, методами и исследовательскими организациями. Важнейшие этапы — предыстория, возникновение, классический этап, развитие в XX веке и современный период."]], "nb": 1}, {"n": 5, "q": "Социально-экономические, естественно-научные и идейно-теоретические предпосылки возникновения социологии.", "b": [["p", "Социология возникла в первой половине XIX века не случайно. Её появление было связано с крупными изменениями в европейском обществе, развитием естественных наук и распространением новых философских идей."], ["p", "Обычно выделяют три группы предпосылок: социально-экономические, естественно-научные и идейно-теоретические."], ["h", "1. Социально-экономические предпосылки"], ["p", "Главной причиной возникновения социологии стали масштабные изменения в жизни европейского общества в XVIII–XIX веках."], ["p", "Промышленная революция привела к переходу от преимущественно аграрного хозяйства к промышленному производству. Развивались фабрики и заводы, увеличивалось количество наёмных рабочих, менялись отношения между работодателями и работниками."], ["p", "**Урбанизация — быстрый рост городов за счёт переселения сельского населения.** Люди переезжали в города в поисках работы, из-за чего возникали новые социальные проблемы: перенаселённость, бедность, плохие условия труда и жилья."], ["p", "Развитие капитализма усилило социальное расслоение. Общество всё заметнее разделялось на группы с различным экономическим положением и интересами. Особенно острыми стали противоречия между владельцами предприятий и наёмными рабочими."], ["p", "Политические революции, прежде всего Великая французская революция 1789 года, изменили представления о власти, правах человека, равенстве и общественном устройстве. Старые политические и социальные порядки разрушались, а новые ещё не были устойчивыми."], ["p", "В результате общество стало быстро меняться, а традиционные объяснения общественного порядка уже не могли полностью ответить на новые вопросы. Возникла необходимость научно изучать причины социальных изменений, конфликтов и неравенства."], ["h", "2. Естественно-научные предпосылки"], ["p", "В XVIII–XIX веках активно развивались естественные науки. Их успехи показали, что сложные явления природы можно исследовать систематически, опираясь на наблюдения, эксперименты и установление закономерностей."], ["p", "Особое значение имели следующие достижения:"], ["ul", ["Физика и астрономия продемонстрировали возможности математического описания природных процессов и выявления общих законов.", "Биология способствовала распространению представлений об эволюции, развитии и взаимосвязи частей живых организмов.", "Медицина и физиология развивали методы наблюдения и исследования человеческого организма.", "Теория эволюции Чарльза Дарвина, изложенная в книге «Происхождение видов» (1859), повлияла на дальнейшие попытки объяснять развитие общества через эволюционные процессы. Важно учитывать, что Дарвин опубликовал свой главный труд уже после появления социологии как самостоятельной науки."]], ["p", "Эти достижения укрепили представление о том, что научные методы можно применять не только для изучения природы, но и для исследования общества."], ["h", "3. Идейно-теоретические предпосылки"], ["p", "Возникновение социологии подготовили философские и общественно-политические идеи предшествующих эпох."], ["p", "Философия Просвещения XVIII века утверждала значение человеческого разума, образования и научного знания. Просветители стремились объяснять общественные явления рационально, критиковали несправедливость и выступали за общественные преобразования."], ["p", "Среди важных мыслителей можно выделить:"], ["ul", ["Шарля Монтескьё, исследовавшего связь законов и политического устройства с условиями жизни общества.", "Жан-Жака Руссо, размышлявшего об общественном договоре, неравенстве и происхождении государства.", "Джона Локка, развивавшего идеи естественных прав человека и общественного договора.", "Адама Смита, исследовавшего разделение труда, экономические отношения и механизмы рыночного хозяйства."]], ["p", "Важную роль сыграли также идеи социального договора и естественного права. Они помогли сформировать представление об обществе как об особой системе отношений между людьми, которую можно изучать и объяснять."], ["p", "Наконец, непосредственное влияние на формирование социологии оказал французский мыслитель Анри де Сен-Симон. Он выступал за научное изучение общества и считал, что знание общественных закономерностей должно помогать совершенствовать социальную жизнь. Его идеи оказали влияние на Огюста Конта."], ["h", "Итог"], ["p", "Таким образом, социология возникла благодаря сочетанию трёх факторов. Социально-экономические изменения создали потребность в научном понимании общества; успехи естественных наук показали возможности систематического исследования; философия Просвещения и предшествующие социальные теории подготовили необходимую идейную основу."], ["v", "Главное для запоминания", "три группы предпосылок — изменения в обществе, развитие естественных наук и развитие философской мысли. Все они привели к необходимости изучать общество научными методами."]], "nb": 1}, {"n": 6, "q": "Основные положения социологической науки в учении О. Конта.", "b": [["p", "Огюст Конт (1798–1857) — французский философ, основатель позитивизма и один из основоположников социологии. Он предложил рассматривать общество как особую систему, которую необходимо изучать с помощью научных методов."], ["p", "Конт считал, что общественные процессы подчиняются определённым закономерностям, подобно природным явлениям. Поэтому общество можно и нужно изучать научно, опираясь на наблюдения, сравнение и анализ фактов."], ["h", "1. Позитивизм"], ["p", "Основой учения Конта стал позитивизм — философское направление, согласно которому достоверное знание должно опираться на научные факты, наблюдения и установление закономерностей."], ["p", "Конт выступал против попыток объяснять общество исключительно с помощью религиозных представлений или отвлечённых философских рассуждений. Он полагал, что задача науки — не искать абсолютные причины всего существующего, а выявлять устойчивые связи между явлениями и объяснять, как они происходят."], ["p", "Конт считал, что общество можно изучать так же последовательно, как природу. При этом социология должна не просто описывать происходящее, но и помогать решать общественные проблемы."], ["h", "2. Закон трёх стадий"], ["p", "Одной из центральных идей Конта является закон трёх стадий развития человеческого мышления. Согласно ему, человечество постепенно проходит три этапа в объяснении окружающего мира."], ["p", "**Теологическая стадия — люди объясняют природные и общественные явления действием сверхъестественных сил, богов и духов.** Например, стихийные бедствия или неурожай могут восприниматься как результат вмешательства божественных сил."], ["p", "**Метафизическая стадия — объяснение явлений строится с помощью абстрактных понятий и отвлечённых сущностей.** Вместо богов используются такие объяснения, как «природа», «сущность» или «естественные силы»."], ["p", "**Позитивная стадия — человек отказывается от поиска абсолютных и сверхъестественных причин и начинает изучать явления с помощью наблюдений, научных методов и установления закономерностей.**"], ["p", "Конт полагал, что позитивная стадия является наиболее развитой формой человеческого мышления, поскольку позволяет получать проверяемое знание."], ["h", "3. Классификация наук"], ["p", "Конт стремился определить место социологии среди других наук. Он расположил науки в определённой последовательности — от наиболее простых и общих к наиболее сложным и конкретным."], ["p", "В его классификацию входили:"], ["ol", 1, ["Математика.", "Астрономия.", "Физика.", "Химия.", "Биология.", "Социология."]], ["p", "Социология занимала последнее место, потому что, по мнению Конта, общественные явления наиболее сложны: на них влияет множество факторов, а само общество постоянно изменяется."], ["p", "При этом Конт считал социологию самостоятельной наукой, которая должна использовать научные методы для изучения общества."], ["h", "4. Социальная статика и социальная динамика"], ["p", "Конт разделил социологию на два основных раздела."], ["p", "Социальная статика изучает общество с точки зрения его устройства и устойчивости. Её интересует, какие элементы обеспечивают существование общества и как они связаны между собой."], ["p", "К важнейшим социальным институтам Конт относил семью, государство и религию. Он рассматривал их как элементы, поддерживающие общественный порядок и согласованность."], ["p", "Социальная динамика изучает общественное развитие, изменения и закономерности исторического процесса. Она отвечает на вопросы о том, как и почему меняется общество, какие этапы оно проходит и в каком направлении развивается."], ["p", "Таким образом, социальная статика объясняет, благодаря чему общество сохраняет устойчивость, а социальная динамика — как оно развивается и изменяется."], ["h", "5. Методы социологии"], ["p", "Конт считал, что социология должна использовать методы, близкие к методам естественных наук. К основным методам он относил:"], ["ul", ["**Наблюдение — систематическое изучение общественных явлений.**", "**Эксперимент — исследование явлений в специально созданных или естественно возникающих условиях.** Прямой эксперимент в социологии ограничен сложностью общества: его роль, по Конту, играют патологические случаи («косвенный эксперимент»).", "**Сравнительный метод — сопоставление разных обществ, социальных групп и исторических периодов.**", "**Исторический метод — изучение последовательности общественных изменений и закономерностей исторического развития.**"]], ["p", "Конт уделял особое внимание сравнению и историческому анализу, поскольку считал, что общество нельзя понять без изучения его развития."], ["h", "6. Значение учения Конта"], ["p", "Главная заслуга Конта заключается в том, что он обосновал необходимость самостоятельной науки об обществе и сформулировал основные принципы её изучения."], ["p", "Он ввёл термин «социология» в широкое научное употребление, разработал позитивистский подход, предложил закон трёх стадий и разделил социологию на социальную статику и социальную динамику."], ["p", "При этом некоторые положения Конта сегодня рассматриваются критически. Например, развитие всех обществ не обязательно проходит через одинаковые стадии, а методы естественных наук нельзя полностью перенести на изучение человеческого поведения."], ["v", "Главное для запоминания", "учение Конта строится вокруг позитивизма — идеи научного изучения общества. Самые важные положения: закон трёх стадий, классификация наук, социальная статика и социальная динамика, использование научных методов."]], "nb": 1}, {"n": 7, "q": "Эволюционизм как направление социологической мысли. Г. Спенсер.", "b": [["h", "1. Эволюционизм в социологии"], ["p", "**Эволюционизм — направление социологической мысли, представители которого рассматривали общество как систему, постепенно развивающуюся от простых форм организации к более сложным.**"], ["p", "Сторонники эволюционизма считали, что общественные изменения имеют определённые закономерности. Они пытались объяснить, как возникают социальные институты, почему усложняется общественное устройство и как меняются отношения между людьми."], ["p", "Одним из главных представителей эволюционизма стал английский философ и социолог Герберт Спенсер (1820–1903)."], ["h", "2. Биография и основные работы Герберта Спенсера"], ["p", "Герберт Спенсер (1820–1903) — английский философ и социолог, один из главных представителей эволюционизма и органицизма. Он стремился объяснить развитие природы и общества с помощью общих закономерностей эволюции."], ["p", "Спенсер родился 27 апреля 1820 года в английском городе Дерби. Он получил преимущественно домашнее образование, самостоятельно изучал математику, естественные науки и философию. В молодости работал инженером на железной дороге, однако позднее полностью посвятил себя научной и публицистической деятельности."], ["p", "Спенсер стремился создать единую систему знаний, которая объясняла бы развитие природы, живых организмов, человеческого мышления и общества."], ["p", "К его основным работам относятся:"], ["ul", ["«Социальная статика» (1851) — вопросы общественного устройства и социальных отношений.", "«Основные начала» (1862) — общие закономерности эволюции.", "«Изучение социологии» (1873) — задачи и трудности научного изучения общества.", "«Основания социологии» (1876–1896) — масштабное изложение его социологической теории."]], ["h", "3. Основные положения теории эволюции Спенсера"], ["p", "Центральное понятие его теории — эволюция. Под ней Спенсер понимал постепенный переход от относительно простых и однородных форм организации к более сложным и разнообразным."], ["p", "По его мнению, развитие происходит благодаря двум взаимосвязанным процессам:"], ["ul", ["**Дифференциация — разделение первоначально однородной системы на различные части, которые начинают выполнять разные функции.**", "**Интеграция — объединение этих частей в единую систему и усиление взаимосвязей между ними.**"]], ["p", "Например, в простом обществе многие люди могут заниматься сходными видами деятельности. По мере развития возникают различные профессии, организации и социальные институты. Общество становится более сложным, но его отдельные элементы одновременно начинают сильнее зависеть друг от друга."], ["p", "Спенсер рассматривал эволюцию в трёх основных областях:"], ["ol", 1, ["**Неорганическая эволюция — изменения в неживой природе.**", "Органическая эволюция — развитие живых организмов.", "Надорганическая, или социальная, эволюция — развитие человеческого общества."]], ["p", "Таким образом, Спенсер пытался показать, что развитие общества является частью более общего процесса эволюции мира."], ["h", "4. Органическая теория общества"], ["p", "Одной из наиболее известных идей Спенсера стала органическая теория общества. Он сравнивал общество с живым организмом."], ["p", "Подобно тому как организм состоит из различных органов, общество состоит из взаимосвязанных частей: государства, экономики, семьи, религии, образования и других социальных институтов."], ["p", "Каждая часть выполняет определённые функции и необходима для существования целого. Например, экономика обеспечивает производство и распределение ресурсов, образование передаёт знания и навыки, а государство организует управление и поддержание порядка."], ["p", "Примечание. Образование здесь приведено как иллюстрация учебной трактовки институтов. У самого Спенсера институты — шесть типов «органов» общества: домашние, церемониальные, политические, церковные, профессиональные, промышленные."], ["p", "Однако Спенсер не отождествлял общество с живым организмом полностью. Между ними есть важное различие: в организме сознание сосредоточено в едином центре, а в обществе сознание и способность действовать принадлежат отдельным людям. Поэтому общество не является единым биологическим существом."], ["h", "5. Типы общества"], ["p", "Спенсер выделял два основных типа общества:"], ["p", "**Военное общество — общество, в котором большое значение имеют централизованная власть, дисциплина, подчинение и военная организация.** Его устройство ориентировано на внешние конфликты и защиту территории."], ["p", "**Промышленное общество — общество, в котором основное значение приобретают производство, торговля, добровольное сотрудничество и индивидуальная свобода.** Отношения между людьми всё больше строятся на договоре и взаимной выгоде."], ["p", "Спенсер связывал общественное развитие с переходом от преимущественно военной организации к промышленной. При этом в реальной истории эти типы могут сочетаться, а развитие обществ не всегда происходит одинаково."], ["h", "6. Социальный дарвинизм и взгляды Спенсера"], ["p", "Спенсер известен также выражением «выживание наиболее приспособленных». Он использовал его для объяснения процессов отбора и приспособления."], ["p", "С его именем связывают социальный дарвинизм — подход, при котором идеи эволюции и естественного отбора переносятся на объяснение общественной жизни. В рамках таких взглядов конкуренция между людьми и группами рассматривается как один из факторов общественного развития."], ["p", "Спенсер выступал за ограничение вмешательства государства в общественные и экономические процессы, поскольку считал, что чрезмерная помощь и регулирование могут мешать естественному развитию общества."], ["p", "При этом важно не упрощать его взгляды до идеи, что сильные люди обязательно должны господствовать над слабыми: его теория была частью более широкой концепции эволюции, индивидуальной свободы и общественного развития."], ["h", "7. Значение теории Спенсера"], ["p", "Спенсер внёс значительный вклад в развитие социологии. Он одним из первых попытался создать целостную теорию общественной эволюции, разработал органическую аналогию и показал значение взаимосвязи социальных институтов."], ["p", "Его идеи повлияли на развитие структурно-функционального подхода, в частности на последующие исследования общественных институтов и их функций."], ["v", "Главное для запоминания", "Спенсер — представитель эволюционизма и органицизма. Он считал, что общество развивается от простого к сложному через дифференциацию и интеграцию, сравнивал его с живым организмом и выделял военное и промышленное общества."]], "nb": 1}, {"n": 8, "q": "Социологическая концепция Э. Дюркгейма.", "b": [["h", "1. Биография и основные работы"], ["p", "Эмиль Дюркгейм (1858–1917) — французский социолог, один из основателей современной социологии. Он стремился доказать, что общество обладает собственными закономерностями и должно изучаться как самостоятельная реальность."], ["p", "Дюркгейм родился 15 апреля 1858 года в городе Эпиналь во Франции. Учился в Высшей нормальной школе в Париже, позднее преподавал в Бордо и Сорбонне."], ["p", "В 1898 году он основал социологический журнал «Социологический ежегодник» (L’Année Sociologique), который стал важным центром развития французской социологической школы."], ["p", "Основные работы Дюркгейма:"], ["ul", ["«О разделении общественного труда» (1893).", "«Правила социологического метода» (1895).", "«Самоубийство» (1897).", "«Элементарные формы религиозной жизни» (1912)."]], ["h", "2. Социология как самостоятельная наука. Социальный факт"], ["p", "Дюркгейм считал, что социология должна изучать общество независимо от психологии и индивидуальных особенностей отдельных людей."], ["p", "Центральное понятие его теории — социальный факт."], ["p", "**Социальный факт — это способ действия, мышления или чувствования, который существует вне отдельного человека и оказывает на него принудительное воздействие.**"], ["p", "К социальным фактам относятся:"], ["ul", ["законы и правовые нормы;", "обычаи и традиции;", "религиозные верования;", "моральные правила;", "язык;", "общественные институты."]], ["p", "Например, человек рождается в обществе, где уже существует определённый язык. Он не создаёт его самостоятельно, а усваивает готовую систему правил и значений. Если человек нарушает общественные нормы, он может столкнуться с осуждением или наказанием."], ["p", "Дюркгейм сформулировал известное методологическое требование: «Социальные факты нужно рассматривать как вещи». Это означает, что социолог должен изучать их объективно, не подменяя научный анализ личными впечатлениями и оценками."], ["h", "3. Коллективное сознание и социальная солидарность"], ["p", "**Коллективное сознание — совокупность общих верований, представлений, ценностей и моральных установок, которые разделяют члены общества.**"], ["p", "Оно помогает людям понимать, какие поступки считаются допустимыми, какие правила необходимо соблюдать и что объединяет их с другими членами общества."], ["p", "С коллективным сознанием связано понятие социальной солидарности — связи между людьми, благодаря которой общество сохраняет единство и устойчивость."], ["p", "Дюркгейм выделял два основных типа солидарности."], ["p", "Механическая солидарность характерна для традиционных обществ, где люди во многом похожи друг на друга. Они имеют сходные занятия, верования, традиции и образ жизни. Общественное единство основано прежде всего на сходстве."], ["p", "Органическая солидарность характерна для современных сложных обществ. Люди выполняют разные функции, имеют различные профессии и навыки, но становятся взаимозависимыми. Например, врач, учитель, инженер и фермер занимаются разной деятельностью, однако нуждаются в результатах труда друг друга."], ["p", "Таким образом, по мере развития общества единство всё меньше основывается на сходстве людей и всё больше — на разделении труда и взаимной зависимости."], ["h", "4. Разделение общественного труда"], ["p", "В работе «О разделении общественного труда» Дюркгейм исследовал, как специализация деятельности влияет на устройство общества."], ["p", "Он считал, что разделение труда не только повышает эффективность производства, но и создаёт новые формы социальных связей."], ["p", "В традиционном обществе люди часто выполняют сходные функции, поэтому их объединяют общие представления и традиции. В современном обществе деятельность становится специализированной, а люди начинают зависеть друг от друга."], ["p", "Однако разделение труда не всегда автоматически укрепляет общество. Для нормального функционирования необходимы общие правила, справедливое регулирование и согласованность социальных отношений."], ["h", "5. Аномия"], ["p", "**Аномия — состояние общества, при котором ослабевает действие социальных норм и правил, регулирующих поведение людей.**"], ["p", "Она может возникать в периоды быстрых общественных изменений, когда прежние нормы уже теряют значение, а новые ещё не сформировались или не стали общепринятыми."], ["p", "В результате людям становится сложнее ориентироваться в общественной жизни, понимать требования и ожидания окружающих."], ["p", "Например, резкие экономические или политические изменения могут привести к тому, что привычные правила поведения перестают работать, а новые социальные ориентиры ещё не установились."], ["p", "Для Дюркгейма проблема аномии была связана с нарушением общественной регуляции и ослаблением социальных связей."], ["h", "6. Исследование самоубийства"], ["p", "В работе «Самоубийство» (1897) Дюркгейм продемонстрировал, что социология может изучать даже явления, которые на первый взгляд кажутся исключительно индивидуальными."], ["p", "Он анализировал статистические данные и сравнивал показатели в разных социальных группах и сообществах. Его интересовали не личные истории отдельных людей, а социальные условия, с которыми могли быть связаны различия в статистике."], ["p", "Главный вывод Дюркгейма заключался в том, что общественные связи и нормы регулирования влияют на жизнь человека. Поэтому для объяснения социальных явлений необходимо учитывать уровень интеграции человека в общество и степень общественного регулирования."], ["p", "Эта работа стала важным примером применения статистических методов в социологии."], ["h", "7. Социология религии"], ["p", "В работе «Элементарные формы религиозной жизни» (1912) Дюркгейм исследовал религию как общественное явление."], ["p", "Он выделял два основных элемента религиозной системы:"], ["ul", ["**Священное — предметы, явления и символы, которые выделяются из повседневной жизни и окружены особым отношением.**", "**Мирское — обычная повседневная сторона существования, не обладающая особым религиозным статусом.**"]], ["p", "Дюркгейм считал, что религия выполняет важные общественные функции: объединяет людей, закрепляет общие ценности, укрепляет коллективное сознание и поддерживает чувство принадлежности к группе."], ["p", "Особое внимание он уделял тотемизму — одной из ранних форм религиозной организации, которую изучал на примере обществ австралийских аборигенов."], ["h", "8. Значение концепции Дюркгейма"], ["p", "Дюркгейм внёс огромный вклад в становление социологии как самостоятельной науки. Он разработал понятие социального факта, исследовал социальную солидарность, разделение труда, аномию и роль религии в общественной жизни."], ["p", "Особенно важно, что он показал: индивидуальное поведение нельзя объяснять исключительно личными мотивами. На человека постоянно влияют общественные нормы, институты и социальные связи."], ["v", "Главное для запоминания", "Дюркгейм изучал общество как самостоятельную реальность. Основные понятия его теории — социальный факт, коллективное сознание, механическая и органическая солидарность, разделение труда и аномия."]], "nb": 1}, {"n": 9, "q": "«Понимающая» социология М. Вебера.", "b": [["h", "1. Биография и основные работы"], ["p", "Макс Вебер (1864–1920) — немецкий социолог, историк и экономист, один из основоположников понимающей социологии. Он считал, что для изучения общества необходимо понимать смыслы и мотивы, которыми руководствуются люди в своих действиях."], ["p", "Макс Вебер родился 21 апреля 1864 года в немецком городе Эрфурт. Получил юридическое и историческое образование, занимался преподавательской и научной деятельностью. Его интересовали экономика, политика, религия, власть и устройство современного общества."], ["p", "Основные работы Вебера:"], ["ul", ["«Протестантская этика и дух капитализма» (1904–1905) — исследование взаимосвязи религиозных ценностей и развития капитализма.", "«Хозяйство и общество» — главный социологический труд, опубликованный посмертно в 1921–1922 годах.", "«Наука как призвание и профессия» (1917) — размышления о научной деятельности и ответственности учёного.", "«Политика как призвание и профессия» (1919) — исследование государства, политической власти и профессиональной политики."]], ["h", "2. Понимающая социология"], ["p", "Главная идея Вебера заключается в том, что социология должна не только наблюдать за внешними действиями людей, но и понимать смысл, который сами люди вкладывают в свои поступки."], ["p", "Это направление получило название понимающей социологии."], ["p", "Вебер считал, что общество формируется через действия людей, которые ориентируются на поведение других. Поэтому для объяснения общественных процессов необходимо выяснять, почему человек поступает определённым образом и какого результата он стремится достичь."], ["p", "Например, человек может помогать другому из чувства долга, из дружеских отношений или ради получения выгоды. Внешне действия могут выглядеть одинаково, но их смысл и мотивы будут различаться. Социолог должен учитывать эту разницу."], ["p", "Для обозначения такого понимания Вебер использовал немецкое слово Verstehen — «понимание». Оно предполагает попытку разобраться в смыслах, которыми руководствуются участники социальных отношений."], ["h", "3. Социальное действие"], ["p", "Центральное понятие социологии Вебера — социальное действие."], ["p", "**Социальное действие — это действие человека, которое по своему смыслу ориентировано на поведение других людей.**"], ["p", "Не каждый поступок является социальным. Например, случайное движение руки само по себе не обязательно имеет социальный смысл. Но если человек машет рукой, чтобы поприветствовать знакомого, его действие ориентировано на другого человека и становится социальным."], ["p", "Вебер выделял четыре основных типа социального действия."], ["ol", 1, ["Целерациональное действие."]], ["p", "Человек заранее определяет цель и выбирает наиболее подходящие средства для её достижения. Он учитывает возможные последствия и оценивает эффективность своих действий."], ["p", "Пример: студент составляет расписание подготовки к экзамену, распределяя время между предметами, чтобы получить нужный результат."], ["ol", 2, ["Ценностно-рациональное действие."]], ["p", "Человек поступает определённым образом, потому что считает это правильным или важным само по себе. При этом достижение конкретной выгоды не является главным."], ["p", "Пример: человек соблюдает свои нравственные принципы, даже если это не приносит ему материальной пользы."], ["ol", 3, ["Традиционное действие."]], ["p", "Основано на привычках, обычаях и традициях. Человек действует определённым образом, потому что привык так поступать или так принято в его окружении."], ["p", "Пример: соблюдение семейных традиций или привычных ритуалов."], ["ol", 4, ["Аффективное действие."]], ["p", "Связано с эмоциональным состоянием человека. Оно совершается под влиянием чувств и переживаний."], ["p", "Пример: человек эмоционально реагирует на неожиданную новость."], ["p", "В реальной жизни эти типы не всегда существуют в чистом виде. Одно действие может сочетать несколько мотивов."], ["h", "4. Идеальный тип"], ["p", "Важным методом исследования у Вебера является идеальный тип."], ["p", "**Идеальный тип — это теоретическая конструкция, которая выделяет наиболее характерные признаки определённого социального явления и помогает анализировать реальность.**"], ["p", "Важно понимать, что слово «идеальный» здесь не означает «совершенный» или «лучший». **Идеальный тип — это условная аналитическая модель, с которой исследователь сравнивает реальные явления.**"], ["p", "Например, можно создать идеальный тип бюрократической организации, выделив такие признаки, как чёткое распределение обязанностей, иерархия должностей, формальные правила и профессиональная компетентность."], ["p", "Затем социолог может сравнить эту модель с реальной организацией и определить, насколько она соответствует выделенным признакам."], ["p", "Таким образом, идеальные типы помогают упорядочивать сложную социальную действительность и проводить сравнения."], ["h", "5. Теория социального неравенства: класс, статус и власть"], ["p", "Вебер считал, что социальное неравенство нельзя объяснить только экономическим положением человека."], ["p", "Он выделял три взаимосвязанных измерения социальной стратификации:"], ["p", "**Класс — положение человека, связанное с его экономическими возможностями, собственностью, доходами и положением на рынке.**"], ["p", "**Статус — общественное положение, основанное на престиже, уважении и признании со стороны других людей.** На статус могут влиять образование, происхождение, образ жизни и профессия."], ["p", "**Партия — объединение людей, стремящихся влиять на распределение власти и принятие политических решений.** В современном понимании это понятие не ограничивается только политическими партиями в привычном смысле."], ["p", "Таким образом, человек может обладать высоким доходом, но не иметь такого же высокого общественного престижа или политического влияния. И наоборот, человек с небольшими материальными возможностями может пользоваться уважением и обладать значительным влиянием."], ["h", "6. Типы легитимного господства"], ["p", "Вебер исследовал, почему люди признают власть определённого человека или организации и считают подчинение ей оправданным."], ["p", "Он выделял три основных типа легитимного господства."], ["p", "Традиционное господство основано на вере в святость старых обычаев и традиций. Люди подчиняются власти, потому что так принято и такой порядок существует давно."], ["p", "Пример: власть наследственного монарха, которая признаётся на основании традиции."], ["p", "Харизматическое господство основано на вере в исключительные качества определённого лидера. Его сторонники считают его особенным человеком, способным вести за собой других."], ["p", "Пример: лидер общественного движения, который пользуется поддержкой благодаря личному авторитету и способности вдохновлять людей."], ["p", "Легально-рациональное господство основано на признании законов и формальных правил. Люди подчиняются не конкретной личности как таковой, а установленному порядку и должностным полномочиям."], ["p", "Пример: современная государственная система, в которой власть осуществляется в соответствии с законодательством."], ["p", "Эти типы являются теоретическими моделями. В реальной жизни разные основания легитимности могут сочетаться."], ["h", "7. Рационализация общества и бюрократия"], ["p", "Вебер уделял большое внимание процессу рационализации — распространению расчёта, планирования, формальных правил и ориентации на эффективность в общественной жизни."], ["p", "По его мнению, современное общество всё больше строится на рациональных принципах. Это заметно в экономике, государственном управлении, образовании и деятельности организаций."], ["p", "Одним из наиболее ярких проявлений рационализации является бюрократия."], ["p", "**Бюрократия — форма организации управления, основанная на иерархии должностей, чётком распределении обязанностей, профессиональной подготовке сотрудников и соблюдении установленных правил.**"], ["p", "Вебер считал бюрократию эффективной формой управления, поскольку она позволяет организовать работу больших и сложных организаций. Однако чрезмерное распространение формальных правил может ограничивать самостоятельность человека и превращать деятельность в выполнение процедур ради самих процедур."], ["h", "8. Протестантская этика и дух капитализма"], ["p", "В работе «Протестантская этика и дух капитализма» Вебер исследовал взаимосвязь религиозных представлений и экономического поведения."], ["p", "Он обратил внимание на то, что некоторые направления протестантизма подчёркивали значение трудолюбия, дисциплины, бережливости и ответственности."], ["p", "В частности, учение о предопределении в кальвинизме порождало неуверенность в собственном спасении, и труд в «призвании» становился способом справиться с ней: профессиональный успех воспринимался как косвенный знак избранности, но не как её причина."], ["p", "Вебер не утверждал, что протестантизм в одиночку создал капитализм. Его идея заключалась в том, что определённые религиозные ценности могли способствовать формированию хозяйственного поведения, характерного для современного капитализма."], ["p", "Эта работа показала, что на развитие экономики влияют не только материальные условия, но и культура, религия и ценности людей."], ["h", "9. Значение социологии Вебера"], ["p", "Вебер оказал огромное влияние на развитие современной социологии. Он разработал концепцию социального действия, обосновал значение понимания человеческих мотивов, предложил метод идеальных типов и исследовал социальное неравенство, власть, бюрократию и рационализацию."], ["p", "В отличие от Дюркгейма, который прежде всего обращал внимание на влияние общества на человека, Вебер стремился понять, как действия отдельных людей формируют социальные отношения и общественные процессы."], ["v", "Главное для запоминания", "Вебер — основоположник понимающей социологии. Его ключевые понятия: социальное действие, четыре типа социального действия, Verstehen, идеальный тип, класс и статус, три типа легитимного господства, рационализация и бюрократия."], ["p", "Важное различие между тремя социологами:"], ["tbl", [["Социолог", "Главный вопрос", "Ключевая идея"], ["Г. Спенсер", "Как развивается общество?", "Эволюция от простого к сложному"], ["Э. Дюркгейм", "Что объединяет и удерживает общество?", "Социальные факты и солидарность"], ["М. Вебер", "Почему люди действуют определённым образом?", "Понимание смыслов и мотивов социальных действий"]]]], "nb": 1}, {"n": 10, "q": "Основные положения социологической концепции К. Маркса.", "b": [["h", "1. Биография и основные работы"], ["p", "Карл Маркс (1818–1883) — немецкий философ, экономист и общественный деятель. Один из основоположников конфликтного подхода к изучению общества. Главными темами его исследований были экономика, социальное неравенство, классовая борьба и развитие капитализма."], ["p", "Карл Маркс родился 5 мая 1818 года в немецком городе Трире. Изучал право, философию и историю. Большое влияние на формирование его взглядов оказала немецкая классическая философия, особенно философия Гегеля."], ["p", "Важную роль в его жизни и научной деятельности сыграло сотрудничество с Фридрихом Энгельсом. Вместе они разрабатывали материалистическое понимание истории и критиковали капиталистическое общество."], ["p", "В 1849 году Маркс переехал в Лондон, где продолжил научную и политическую деятельность. Там он работал над исследованием капиталистической экономики."], ["p", "Основные работы (по конспекту пре
