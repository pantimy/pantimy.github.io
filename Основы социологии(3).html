 Например, при разработке образовательных программ, социальной политики и мер поддержки населения."], ["ol", 3, ["Прогностическая функция."]], ["p", "Позволяет выявлять тенденции развития общества и предполагать возможные последствия социальных изменений."], ["ol", 4, ["Управленческая функция."]], ["p", "Социологическая информация используется органами государственной власти, организациями и предприятиями для принятия обоснованных решений."], ["ol", 5, ["Критическая функция."]], ["p", "Социология позволяет выявлять недостатки общественного устройства, социальное неравенство, противоречия и проблемы, которые могут оставаться незаметными без специальных исследований."], ["ol", 6, ["Мировоззренческая функция."]], ["p", "Формирует научное представление об обществе, помогает человеку лучше понимать социальные процессы и собственное положение в социальной структуре."], ["p", "Таким образом, социология важна не только для науки, но и для практической жизни общества. Она обеспечивает обратную связь между населением и организациями, которые принимают решения."], ["h", "2. Профессия социолога"], ["p", "**Социолог — это специалист, который изучает общественные процессы, социальные отношения, поведение людей и деятельность различных социальных групп с помощью научных методов.**"], ["p", "Работа социолога включает несколько основных этапов:"], ["ol", 1, ["Определение проблемы и постановка цели исследования.", "Разработка программы исследования и выбор методов.", "Сбор информации с помощью опросов, интервью, наблюдения и анализа документов.", "Обработка и анализ полученных данных.", "Подготовка выводов, рекомендаций и представление результатов исследования."]], ["p", "Социолог должен владеть методами количественного и качественного исследования, уметь работать со статистикой, анализировать информацию и грамотно формулировать выводы."], ["p", "Основные методы работы социолога:"], ["ul", ["анкетирование;", "интервью;", "наблюдение;", "фокус-группы;", "анализ документов;", "статистический анализ;", "контент-анализ."]], ["p", "Где может работать социолог?"], ["ul", ["в научно-исследовательских институтах и университетах;", "в центрах изучения общественного мнения;", "в государственных учреждениях;", "в маркетинговых и аналитических компаниях;", "в кадровых и консалтинговых организациях;", "в организациях, занимающихся социальной политикой и общественными проектами."]], ["p", "В России профессиональная деятельность социолога регулируется профессиональным стандартом «Социолог: специалист по фундаментальным и прикладным социологическим исследованиям», утверждённым приказом Минтруда № 751н от 21 октября 2021 года. Он включает проектирование исследований, сбор и анализ данных, подготовку отчётов и разработку рекомендаций."], ["h", "3. Социологическая культура"], ["p", "**Социологическая культура — это совокупность знаний, представлений и навыков, которые позволяют человеку понимать общество и анализировать социальные явления с научной точки зрения.**"], ["p", "Она предполагает способность:"], ["ul", ["видеть за отдельными событиями более широкие общественные процессы;", "понимать влияние социальных условий на поведение людей;", "критически оценивать информацию и результаты исследований;", "отличать научные факты от личных мнений и стереотипов;", "учитывать разнообразие социальных групп и точек зрения."]], ["p", "Например, человек с развитой социологической культурой не будет объяснять безработицу исключительно нежеланием отдельных людей работать. Он также обратит внимание на состояние экономики, уровень образования, количество рабочих мест и другие социальные факторы."], ["p", "Социологическая культура важна не только для профессиональных исследователей. Она необходима каждому человеку, поскольку помогает лучше понимать общество, критически воспринимать информацию и осознанно участвовать в общественной жизни."], ["h", "4. Кодекс этики социолога"], ["p", "**Кодекс этики социолога — это совокупность профессиональных и моральных норм, регулирующих деятельность социолога и его отношения с респондентами, заказчиками и научным сообществом.**"], ["p", "В России действует Этический кодекс Российского общества социологов (РОС), окончательно утверждённый Президиумом РОС 10 марта 2022 года. Он определяет нормы исследовательской и практической деятельности, научных дискуссий, публикаций и взаимодействия с респондентами."], ["p", "Основные принципы профессиональной этики:"], ["ol", 1, ["Научная честность и объективность."]], ["p", "Социолог должен стремиться к достоверности результатов, не искажать данные и не подгонять выводы под собственные убеждения или интересы заказчика."], ["ol", 2, ["Профессиональная компетентность."]], ["p", "Исследователь обязан использовать научно обоснованные методы и учитывать ограничения применяемых методик."], ["ol", 3, ["Конфиденциальность."]], ["p", "Социолог должен обеспечивать защиту личной информации респондентов и не разглашать сведения, полученные в ходе исследования, без соответствующих оснований."], ["ol", 4, ["Добровольность участия и информированность респондентов."]], ["p", "Участники должны понимать цели исследования и условия своего участия. Нельзя получать информацию обманным путём или принуждать человека к участию."], ["ol", 5, ["Уважение достоинства человека."]], ["p", "Исследование не должно ущемлять права, интересы и достоинство респондентов."], ["ol", 6, ["Недопустимость плагиата."]], ["p", "Социолог обязан указывать авторство чужих идей и результатов исследований. Присвоение чужих научных достижений недопустимо."], ["ol", 7, ["Ответственность за результаты."]], ["p", "Социолог должен понимать, что его выводы и рекомендации могут повлиять на жизнь отдельных людей, социальных групп и общества в целом."], ["ol", 8, ["Корректность научной дискуссии."]], ["p", "Необходимо уважать взгляды других исследователей, аргументированно отстаивать собственную позицию и не допускать личных нападок и дискредитации оппонентов."], ["p", "Кодекс также устанавливает ответственность за нарушение профессиональных норм. В Российском обществе социологов такие нарушения рассматривает Комиссия по профессиональной этике."], ["v", "Итог", "социология помогает обществу понимать собственные проблемы, принимать обоснованные решения и прогнозировать социальные изменения. Профессия социолога требует научных знаний, владения исследовательскими методами и высокой ответственности. Социологическая культура и соблюдение этического кодекса необходимы для получения достоверных результатов и защиты прав людей."]], "nb": 1}]}};

    /* ----- cards ----- */
    var BODY_C = '<p class="muted" style="margin:0 0 18px">Переверните карточку, сверьтесь с ответом и отметьте, знали вы его. Три верных ответа подряд — и карточка считается выученной.</p>' +
      '<div id="c-setup"></div><div id="c-play" hidden></div>';
    add('s21', 'Карточки', 's20', BODY_C, 'tr');
    var cSetup = $('#c-setup'), cPlay = $('#c-play');
    cSetup.innerHTML = setupHTML({ p: 'c', rev: true });
    var cUpd = bindSetup(cSetup, { p: 'c' }, startCards);
    function faceHTML(c, rev, back) {
      if (c.kind === 'term') {
        if (!rev) return back ? '<div class="kl">Определение</div>' + defHTML(c) : '<div class="kl">Термин</div><div class="kt">' + esc(c.name) + '</div>';
        return back ? '<div class="kl">Термин</div><div class="kt">' + esc(c.name) + '</div>' : '<div class="kl">Определение</div>' + defHTML(c);
      }
      if (c.kind === 'date') return back ? '<div class="kl">Год</div><div class="kt">' + esc(c.year) + '</div>' : '<div class="kl">Событие</div><div class="kq">' + esc(c.front) + '</div>';
      return back ? '<div class="kl">События</div><ul>' + c.events.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<div class="kl">Год</div><div class="kt">' + esc(c.year) + '</div>';
    }
    function startCards(v, list) {
      var q = list.slice(), total = q.length, missed = {}, flipped = false;
      cSetup.hidden = true; cPlay.hidden = false;
      function exit() { cPlay.hidden = true; cSetup.hidden = false; cUpd(); }
      function render() {
        if (!q.length) return finish();
        var c = q[0];
        cPlay.innerHTML = '<div class="tr-top"><button type="button" class="back" data-exit>← Выйти</button><span class="muted" role="status">Осталось: ' + q.length + ' из ' + total + '</span></div>' +
          '<div class="bar" aria-hidden="true"><i style="width:' + Math.round((total - q.length) / total * 100) + '%"></i></div>' +
          '<div class="kcard" id="kc">' + faceHTML(c, v.rev, false) + '</div><div class="tr-act" id="kact"><button type="button" class="btn big" data-flip>Показать ответ</button></div>';
        flipped = false; cPlay.querySelector('[data-flip]').focus();
      }
      function flip() {
        var c = q[0]; flipped = true;
        $('#kc').innerHTML = faceHTML(c, v.rev, true); $('#kc').classList.add('ans');
        $('#kact').innerHTML = '<button type="button" class="back" data-ans="0">Не знаю</button><button type="button" class="btn big" data-ans="1">Знаю</button>';
        $('#kact').querySelector('[data-ans="1"]').focus();
      }
      function answer(ok) {
        var c = q.shift(); bump(c.id, ok);
        if (!ok) { missed[c.id] = c; q.splice(Math.min(4, q.length), 0, c); }
        render();
      }
      function finish() {
        var m = Object.keys(missed).map(function (k) { return missed[k]; });
        cPlay.innerHTML = '<div class="tr-sum"><h2>Колода пройдена</h2><p>Карточек: ' + total + '. С первого раза: ' + (total - m.length) + '.</p>' +
          (m.length ? '<p class="muted">Вызвали трудности:</p><ul>' + m.map(function (c) { return '<li>' + esc(c.name || c.front || c.year) + '</li>'; }).join('') + '</ul>' : '') +
          '<div class="tr-act">' + (m.length ? '<button type="button" class="btn big" data-again>Повторить трудные</button>' : '') + '<button type="button" class="back" data-exit>К настройкам</button></div></div>';
        cPlay._again = m;
      }
      cPlay.onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-exit')) exit();
        else if (b.hasAttribute('data-flip')) flip();
        else if (b.hasAttribute('data-ans')) answer(b.getAttribute('data-ans') === '1');
        else if (b.hasAttribute('data-again')) startCards(v, shuffle(cPlay._again.slice()));
      };
      cPlay._key = function (e) {
        if (!flipped) return;
        if (e.key === 'ArrowRight') answer(true); else if (e.key === 'ArrowLeft') answer(false);
      };
      render();
    }
    document.addEventListener('keydown', function (e) {
      if (!slides.s21.classList.contains('on') || cPlay.hidden || !modal.hidden || !cPlay._key) return;
      cPlay._key(e);
    });

    /* ----- matching ----- */
    var BODY_M = '<p class="muted" style="margin:0 0 18px">В раунде шесть пар: выберите слева элемент, затем справа подходящий к нему. Раунд без ошибок по паре повышает её уровень.</p>' +
      '<div id="m-setup"></div><div id="m-play" hidden></div>';
    add('s22', 'Сопоставление', 's20', BODY_M, 'tr');
    var mSetup = $('#m-setup'), mPlay = $('#m-play'), tmr = null;
    mSetup.innerHTML = setupHTML({ p: 'm', modes: [['td', 'Термин — определение'], ['ta', 'Термин — социолог']], timer: true, need: 3 });
    var mUpd = bindSetup(mSetup, { p: 'm', need: 3 }, startMatch);
    function stopTimer() { if (tmr) { clearInterval(tmr); tmr = null; } }
    function fmt(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
    function startMatch(v, list) {
      var rest = list.slice(), round = 0, t0 = 0, mistakes = 0, missed = {}, cur = [], done = 0, selL = null;
      mSetup.hidden = true; mPlay.hidden = false;
      function exit() { stopTimer(); mPlay.hidden = true; mSetup.hidden = false; mUpd(); }
      function shortDef(c) {
        var f = c.defs[0], full = clean(f.d || ''), t = first(full, 90);
        return { t: cap(t), cut: t !== full };
      }
      function next() {
        if (rest.length < 3) { stopTimer(); mPlay.innerHTML = '<div class="tr-sum"><h2>Колода пройдена</h2><p>Раундов: ' + round + '.</p><div class="tr-act"><button type="button" class="btn big" data-exit>К настройкам</button></div></div>'; return; }
        cur = rest.splice(0, Math.min(6, rest.length)); round++; mistakes = 0; missed = {}; done = 0; selL = null;
        var left = shuffle(cur.slice()), right;
        if (v.mode === 'ta') right = AUTH.map(function (a) { return { author: a[0] }; });
        else right = shuffle(cur.map(function (c) { return { c: c }; }));
        var lh = left.map(function (c) { return '<div class="mi" role="button" tabindex="0" data-side="l" data-k="' + esc(c.id) + '">' + esc(v.mode === 'ey' ? c.front : c.name) + '</div>'; }).join('');
        var rh = right.map(function (r) {
          if (v.mode === 'ta') return '<div class="mi" role="button" tabindex="0" data-side="r" data-au="' + r.author + '">' + r.author + '</div>';
          if (v.mode === 'ey') return '<div class="mi" role="button" tabindex="0" data-side="r" data-k="' + esc(r.c.id) + '" data-y="' + esc(r.c.year) + '">' + esc(r.c.year) + '</div>';
          var s = shortDef(r.c);
          return '<div class="mi" role="button" tabindex="0" data-side="r" data-k="' + esc(r.c.id) + '"><span>' + esc(s.t) + '</span>' + (s.cut ? ' <span class="mfull" data-full="' + esc(r.c.id) + '">полностью</span>' : '') + '</div>';
        }).join('');
        mPlay.innerHTML = '<div class="tr-top"><button type="button" class="back" data-exit>← Выйти</button><span class="muted" role="status" id="mst">Раунд ' + round + ' · осталось пар: ' + cur.length + (v.timer ? ' · <b id="mtm">0:00</b>' : '') + '</span></div>' +
          '<div class="mgrid"><div class="mcol" id="mL">' + lh + '</div><div class="mcol" id="mR">' + rh + '</div></div>';
        t0 = Date.now(); stopTimer();
        if (v.timer) tmr = setInterval(function () { var e = $('#mtm'); if (e && slides.s22.classList.contains('on')) e.textContent = fmt(Date.now() - t0); }, 500);
      }
      function byId(id) { return cur.filter(function (c) { return c.id === id; })[0]; }
      function pick(el) {
        if (el.classList.contains('done')) return;
        var side = el.getAttribute('data-side');
        if (side === 'l') { mPlay.querySelectorAll('[data-side=l].sel').forEach(function (x) { x.classList.remove('sel'); }); el.classList.add('sel'); selL = el; return; }
        if (!selL) { $('#mL').querySelector('.mi:not(.done)') && $('#mL').querySelector('.mi:not(.done)').focus(); return; }
        var c = byId(selL.getAttribute('data-k')), ok;
        if (v.mode === 'ta') ok = c.authors.indexOf(el.getAttribute('data-au')) >= 0;
        else if (v.mode === 'ey') ok = c.year === el.getAttribute('data-y');
        else ok = el.getAttribute('data-k') === c.id;
        if (ok) {
          selL.classList.remove('sel'); selL.classList.add('done'); if (v.mode !== 'ta') el.classList.add('done'); else { el.classList.add('okf'); setTimeout(function () { el.classList.remove('okf'); }, 450); }
          selL = null; done++;
          $('#mst').firstChild.textContent = 'Раунд ' + round + ' · осталось пар: ' + (cur.length - done) + (v.timer ? ' · ' : '');
          if (done === cur.length) endRound();
        } else {
          mistakes++; missed[c.id] = 1; el.classList.add('bad'); selL.classList.remove('sel'); selL = null;
          setTimeout(function () { el.classList.remove('bad'); }, 500);
        }
      }
      function endRound() {
        stopTimer(); var ms = Date.now() - t0;
        cur.forEach(function (c) { bump(c.id, !missed[c.id]); });
        mPlay.insertAdjacentHTML('beforeend', '<div class="tr-sum" id="msum"><h2>Раунд ' + round + ' завершён</h2><p>Ошибок: ' + mistakes + (v.timer ? ' · время ' + fmt(ms) : '') + '. Осталось в колоде: ' + rest.length + '.</p>' +
          '<div class="tr-act">' + (rest.length >= 3 ? '<button type="button" class="btn big" data-next>Следующий раунд</button>' : '') + '<button type="button" class="back" data-exit>Завершить</button></div></div>');
        var b = mPlay.querySelector('[data-next],[data-exit]'); if (b) b.focus();
      }
      mPlay.onclick = function (e) {
        var f = e.target.closest('.mfull');
        if (f) { e.stopPropagation(); var c = TERMS.filter(function (t) { return t.id === f.getAttribute('data-full'); })[0]; openModal(c.name, defHTML(c)); return; }
        var b = e.target.closest('button');
        if (b) { if (b.hasAttribute('data-exit')) exit(); else if (b.hasAttribute('data-next')) next(); return; }
        var m = e.target.closest('.mi'); if (m) pick(m);
      };
      mPlay.onkeydown = function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mi')) { e.preventDefault(); pick(e.target); }
      };
      next();
    }
    addEventListener('hashchange', function () { if (location.hash !== '#s22') stopTimer(); });
  })();

  add('s20', 'Тренировка', 's2', menu([['s21', 'Карточки', 'Термины с самопроверкой'], ['s22', 'Сопоставление', 'Шесть пар в раунде']]));
  addEventListener('hashchange', show);
  show();
})();
</script>

</body></html>
