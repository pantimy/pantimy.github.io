и взаимность"]]], ["p", "Главное отличие микросоциологических теорий: они объясняют общественную жизнь через повседневное взаимодействие людей, их поведение, смыслы и отношения."]], "nb": 1}, {"n": 21, "q": "Макросоциологические теории: основные идеи и представители.", "b": [["p", "**Макросоциология — направление социологии, которое изучает общество на крупном уровне: социальные институты, классы, государства, экономические системы, социальную структуру и исторические изменения.**"], ["p", "Макросоциология рассматривает общество как сложную систему, в которой отдельные элементы связаны между собой. Она отвечает на вопросы о том, почему возникают социальные неравенства, как поддерживается общественный порядок и под влиянием каких факторов меняются общества."], ["h", "Структурный функционализм"], ["p", "Структурный функционализм рассматривает общество как целостную систему, состоящую из взаимосвязанных элементов. Каждый элемент выполняет определённые функции, необходимые для существования общества."], ["p", "Основными представителями являются Эмиль Дюркгейм, Толкотт Парсонс (1902–1979) и Роберт Мертон (1910–2003)."], ["p", "Дюркгейм заложил основы функционального подхода. Он рассматривал общество как систему, части которой взаимосвязаны и обеспечивают его устойчивость."], ["p", "Парсонс развивал представление об обществе как о социальной системе. Он считал, что для её сохранения необходимы определённые условия: адаптация к окружающей среде, постановка общих целей, интеграция элементов общества и поддержание культурных образцов."], ["p", "Мертон внёс важный вклад в развитие функционализма. Он выделил несколько видов функций:"], ["ul", ["**Явные функции — последствия социальных действий или институтов, которые осознаются людьми и являются намеренными.**", "**Латентные функции — скрытые, непреднамеренные последствия, которые не всегда осознаются участниками.**", "**Дисфункции — последствия, которые нарушают работу социальной системы или создают для неё проблемы.**"]], ["p", "Например, главная явная функция образования — передача знаний и подготовка специалистов. Но образование также выполняет латентные функции: помогает заводить знакомства, формировать социальные связи и усваивать правила поведения в коллективе."], ["p", "Главная идея функционализма: общество стремится к определённому порядку и устойчивости, а социальные институты выполняют важные функции в поддержании этого порядка."], ["h", "Теория социального конфликта"], ["p", "Теория социального конфликта рассматривает общество как пространство противоречий и борьбы между группами, которые имеют разные интересы и неравный доступ к ресурсам и власти."], ["p", "Основателем классического конфликтного подхода считается Карл Маркс. Он объяснял развитие общества через противоречия между социальными классами, прежде всего между буржуазией и пролетариатом."], ["p", "Позднее идеи конфликтного подхода развивали другие социологи."], ["p", "Ральф Дарендорф (1929–2009) считал, что основой социальных конфликтов является не только собственность, но и неравномерное распределение власти. В любом обществе существуют группы, которые обладают властью, и группы, которые вынуждены подчиняться установленным правилам."], ["p", "Льюис Козер (1913–2003) изучал функции социального конфликта. Он полагал, что конфликт не всегда разрушителен: иногда он помогает выявить противоречия, укрепить внутренние связи группы и привести к необходимым изменениям."], ["p", "Например, конфликт между работниками и руководством организации может возникнуть из-за заработной платы или условий труда. В результате переговоров и противостояния могут измениться правила работы и распределение ресурсов."], ["p", "Главная идея теории конфликта: общество развивается не только благодаря согласию и сотрудничеству, но и благодаря противоречиям, борьбе за ресурсы и изменению соотношения сил между группами."], ["h", "Эволюционистские теории"], ["p", "Эволюционистские теории объясняют развитие общества как постепенный переход от более простых форм организации к более сложным."], ["p", "Одним из первых представителей такого подхода был Огюст Конт, который выделял три стадии развития человеческого мышления: теологическую, метафизическую и позитивную."], ["p", "Герберт Спенсер рассматривал общество как развивающуюся систему, в которой постепенно увеличиваются сложность организации, разделение труда и взаимозависимость элементов."], ["p", "В рамках эволюционистского подхода развитие общества связывается с усложнением социальных институтов, появлением новых форм организации и изменением общественных отношений."], ["p", "Однако важно понимать, что современные социологи критически относятся к представлению о едином и обязательном пути развития всех обществ. Разные страны и культуры могут развиваться по-разному."], ["h", "Теория модернизации"], ["p", "Теория модернизации изучает переход обществ от традиционного состояния к современному."], ["p", "Модернизация обычно связывается с индустриализацией, развитием науки и технологий, урбанизацией, распространением образования, изменением политических институтов и ростом значения рационального управления."], ["p", "Например, переход от преимущественно сельскохозяйственной экономики к промышленному производству приводит к росту городов, изменению структуры занятости и появлению новых социальных групп."], ["p", "Теория модернизации помогает объяснить масштабные изменения в экономике, политике и социальной структуре. Однако её критикуют за то, что она иногда представляет западный путь развития как универсальный образец для всех стран."], ["h", "Мир-системный анализ"], ["p", "Основателем мир-системного анализа считается американский социолог Иммануил Валлерстайн (1930–2019)."], ["p", "Он рассматривал современный мир как единую капиталистическую систему, в которой государства занимают разные экономические и политические позиции."], ["p", "Валлерстайн выделял три основные группы стран:"], ["ul", ["**Центр — наиболее развитые государства, которые обладают значительными экономическими и политическими возможностями.**", "**Полупериферия — государства, занимающие промежуточное положение между центром и периферией.**", "**Периферия — страны, которые занимают менее выгодное положение в мировой экономике и часто зависят от более развитых государств.**"]], ["p", "Главная идея состоит в том, что страны нельзя рассматривать полностью отдельно друг от друга. Их развитие зависит от положения в мировой экономической системе и отношений с другими государствами."], ["p", "Например, развитые страны могут получать выгоду от международного разделения труда, тогда как менее развитые государства часто специализируются на поставке сырья и более зависимы от внешних рынков."], ["p", "Главная идея мир-системного анализа: мировая экономика представляет собой единую систему, внутри которой существует неравенство между центром, полупериферией и периферией."], ["h", "Сравнение микросоциологии и макросоциологии"], ["tbl", [["Критерий", "Микросоциология", "Макросоциология"], ["Уровень изучения", "Малые группы и отдельные взаимодействия", "Общество в целом и крупные социальные системы"], ["Основной интерес", "Общение, поведение, смыслы, отношения", "Институты, классы, власть, неравенство"], ["Главный вопрос", "Как люди взаимодействуют и создают социальные значения?", "Как устроено общество и почему оно изменяется?"], ["Представители", "Мид, Блумер, Шюц, Гофман, Гарфинкель", "Маркс, Дюркгейм, Парсонс, Мертон, Валлерстайн"], ["Примеры тем", "Общение в коллективе, дружба, поведение в аудитории", "Образование как институт, классовое неравенство, мировая экономика"]]], ["p", "Главное для запоминания:"], ["ul", ["Макросоциология изучает крупные социальные системы и общество в целом.", "Структурный функционализм (Парсонс, Мертон) — общество как система взаимосвязанных элементов.", "Теория конфликта (Маркс, Дарендорф, Козер) — борьба групп за ресурсы и власть.", "Эволюционизм (Конт, Спенсер) — развитие общества и усложнение его структуры.", "**Теория модернизации — переход от традиционного общества к современному.**", "Мир-системный анализ (Валлерстайн) — разделение мировой экономики на центр, полупериферию и периферию."]], ["v", "Важное замечание", "микро- и макросоциология — это прежде всего разные уровни анализа общества, а не два полностью изолированных направления. Одно и то же явление можно изучать с обеих точек зрения: например, образование — через общение преподавателя и студента или через его роль в социальной структуре общества."]], "nb": 1}, {"n": 22, "q": "Особенности становления и развития социологии в России.", "b": [["h", "1. Исторические условия возникновения российской социологии"], ["p", "Социология в России начала формироваться в середине XIX века. Она возникла под влиянием европейской социологической мысли, прежде всего позитивизма Огюста Конта, но при этом приобрела собственные особенности. Если в Западной Европе развитие социологии было тесно связано с промышленной революцией, урбанизацией и становлением капиталистического общества, то в России на первый план вышли вопросы общественного переустройства, отмены крепостного права, положения крестьянства и дальнейших путей развития страны."], ["p", "Важнейшим событием стала отмена крепостного права в 1861 году. Она изменила социальную структуру российского общества: постепенно развивались капиталистические отношения, росли города, увеличивалась численность рабочих, усиливалось расслоение крестьянства. Общество становилось более сложным, а старые способы объяснения общественных процессов уже не давали достаточного ответа на новые вопросы."], ["p", "Перед российскими мыслителями вставали проблемы, которые требовали научного изучения: почему общество развивается именно таким образом, что является причиной социальных изменений, какую роль в истории играет личность, возможно ли сознательно изменить общественный порядок и каким должно быть справедливое устройство общества."], ["p", "Поэтому российская социология с самого начала имела не только теоретический, но и выраженный общественно-политический характер. Многие учёные стремились не просто описать общество, но и понять, как его можно преобразовать."], ["p", "Большое влияние оказал позитивизм — направление, которое предполагало изучение общества научными методами, опираясь на факты, наблюдения и выявление закономерностей. Российские исследователи стремились применять к общественным явлениям подходы, близкие к естественным наукам. Однако они не ограничивались простым перенесением западных теорий: постепенно формировались собственные школы и направления."], ["h", "2. Начало российской социологии"], ["p", "Идеи социологии стали распространяться в России примерно с середины XIX века. С трудами Огюста Конта русская образованная общественность знакомилась через французские издания, переводы и публикации в отечественной печати. Первоначально социологические идеи обсуждались в рамках философии, истории, права и публицистики, поскольку самостоятельной академической дисциплиной социология ещё не являлась."], ["p", "Важнейший этап приходится на 1860–1870-е годы. Социология постепенно выделяется в самостоятельную область знания, появляются работы, непосредственно посвящённые изучению общества и закономерностей его развития."], ["p", "Социологический факультет МГУ связывает начало формирования российской социологии как самостоятельной научной дисциплины с публикациями 1868–1869 годов:"], ["ul", ["Пётр Лавров — «Задачи позитивизма и их решение»;", "Пётр Лавров — «Исторические письма» (1868–1869);", "Николай Михайловский — «Что такое прогресс?» (1869)."]], ["p", "К этому же периоду относятся работы Николая Зибера, одного из первых представителей марксистского направления в России, и Александра Стронина, развивавшего органицистские идеи. Именно с этого времени начинается регулярное появление отечественной социологической литературы."], ["p", "В дальнейшем российская социология развивалась сразу по нескольким направлениям. Исследователи по-разному отвечали на вопрос о том, что определяет развитие общества: природная среда, устройство общества как целого, психология и нравственные установки человека, экономические отношения или взаимодействие различных социальных факторов."], ["h", "3. Основные особенности российской социологии"], ["p", "Российская социологическая мысль имела ряд характерных черт."], ["p", "Во-первых, тесная связь с общественно-политической жизнью. Российские социологи часто обращались к проблемам реформирования страны, социального неравенства, крестьянского вопроса, революции, государства и возможных путей общественного развития. Теоретические исследования нередко сопровождались обсуждением того, каким общество должно стать в будущем."], ["p", "Во-вторых, выраженная нравственная и гуманистическая направленность. Особенно заметно это проявилось в субъективной школе. Её представители считали важным учитывать не только объективные условия жизни, но и личность человека, его интересы, нравственные убеждения, идеалы и способность влиять на ход истории."], ["p", "В-третьих, разнообразие научных направлений. В российской социологии одновременно развивались позитивизм, органицизм, географический детерминизм, субъективная школа, психологическое направление, марксизм, а позднее — неокантианство и неопозитивизм. Единой теории, которую принимали бы все исследователи, не существовало."], ["p", "В-четвёртых, активное освоение и переработка зарубежных теорий. Российские учёные обращались к трудам Конта, Спенсера, Маркса и других европейских мыслителей, но применяли их идеи к особенностям российского общества. В результате возникли оригинальные концепции, которые внесли вклад не только в отечественную, но и в мировую социологию."], ["p", "В-пятых, стремление соединить теорию с практикой. Российские исследователи интересовались не только общими законами развития общества, но и конкретными проблемами: социальным расслоением, положением различных групп, отношениями между личностью и обществом, развитием государства и общественными преобразованиями."], ["h", "4. Основные направления российской социологии в конце XIX — начале XX века"], ["p", "К концу XIX века российская социология стала более разнообразной. Помимо субъективной школы, развивались натуралистическое и психологическое направления, марксизм, а также социологические концепции, стремившиеся объединить разные подходы."], ["p", "Натуралистическое направление рассматривало общество через аналогии с природой и живыми организмами. Его представители пытались объяснять общественные процессы с помощью биологических, физических и других естественно-научных закономерностей."], ["p", "Одним из вариантов натуралистического подхода был органицизм. Его сторонники сравнивали общество с живым организмом: отдельные социальные институты подобны органам, которые выполняют определённые функции и взаимосвязаны между собой. Представителями этого направления были Александр Стронин, Павел Лилиенфельд и Николай Ножин."], ["p", "Другим вариантом являлся географический детерминизм. Его представители считали, что природная среда, климат, географическое положение и другие условия оказывают существенное влияние на развитие общества. Среди российских представителей можно выделить Льва Мечникова и Афанасия Щапова."], ["p", "Субъективная школа ставила в центр внимания личность, её внутренний мир, нравственные ценности и способность сознательно влиять на общественное развитие. Её основными представителями были Пётр Лавров, Николай Михайловский и Николай Кареев. Это направление стало одной из наиболее самобытных особенностей российской социологии."], ["p", "Психологическое направление было связано с изучением психологических механизмов общественной жизни. Его представители стремились понять, как потребности, интересы, эмоции и желания людей влияют на их поведение и взаимодействие. Важную роль в развитии этого подхода сыграл Евгений де Роберти."], ["p", "Марксистское направление основывалось на идеях Карла Маркса и материалистическом понимании истории. Его представители объясняли общественное развитие через материальные условия жизни, экономические отношения, классовую структуру и классовую борьбу. В России к этому направлению относились Николай Зибер, Георгий Плеханов и Владимир Ленин. Позднее внутри российского марксизма выделились революционное и легальное течения."], ["h", "5. Развитие социологии в начале XX века"], ["p", "К началу XX века социология в России постепенно превращалась в более самостоятельную научную дисциплину. Расширялось преподавание общественных наук, появлялись научные публикации, развивались профессиональные связи между исследователями."], ["p", "Особенно важную роль в этот период сыграл Максим Максимович Ковалевский (1851–1916). Он стремился объединить достижения разных общественных наук и разработал интегральный подход к изучению общества. Ковалевский считал, что социология должна исследовать общие закономерности существования и развития человеческих обществ, используя данные истории, этнографии, статистики и политической экономии."], ["p", "Важнейшим методом он считал историко-сравнительный метод: изучение различных обществ и сопоставление их развития. При этом Ковалевский не сводил общественные изменения к воздействию какого-то одного фактора. Он полагал, что различные причины взаимосвязаны и влияют друг на друга."], ["p", "Его вклад был настолько значительным, что в отечественной научной традиции Ковалевского нередко называют одним из основателей российской социологии."], ["p", "Важное место занимал и Николай Кареев (1850–1931). В 1897 году он опубликовал труд «Введение в изучение социологии», который стал одним из первых систематических учебных изложений социологии на русском языке. В нём рассматривались предмет науки, её методы и основные направления."], ["p", "В начале XX века развивалось и новое поколение российских социологов. Особое значение имел Питирим Сорокин, который до эмиграции работал в России, преподавал социологию и разрабатывал собственную теорию социального взаимодействия. Его деятельность стала связующим звеном между дореволюционной и зарубежной социологией."], ["p", "Таким образом, к началу XX века российская социология уже имела собственные научные школы, известных исследователей, учебную литературу и оригинальные теоретические разработки."], ["h", "6. Революция 1917 года и дальнейшая судьба российской социологии"], ["p", "Революция 1917 года и последующие политические преобразования радикально изменили условия развития общественных наук в России."], ["p", "В первые послереволюционные годы социологическая мысль ещё продолжала развиваться. Например, в 1920 году вышла «Система социологии» Питирима Сорокина. Однако постепенно научная деятельность стала всё сильнее зависеть от официальной идеологии."], ["p", "В 1922 году из Советской России были высланы многие представители интеллигенции, в том числе учёные и философы, не разделявшие официальных взглядов новой власти. Сорокин также оказался среди вынужденных эмигрантов. Это нанесло серьёзный удар по отечественной социологической традиции."], ["p", "В дальнейшем самостоятельная социология оказалась в сложном положении. Постепенно марксизм-ленинизм стал обязательной идеологической основой общественных наук, а многие альтернативные теории и направления подвергались критике или вытеснялись из научной среды."], ["p", "При этом социологические исследования не исчезли полностью: отдельные исследования общества продолжались в рамках статистики, истории, экономики и других дисциплин. Однако полноценное институциональное восстановление социологии как самостоятельной науки произошло значительно позднее, особенно во второй половине XX века."], ["h", "7. Основные этапы становления российской социологии"], ["p", "Для запоминания можно выделить следующую последовательность:"], ["tbl", [["Период", "Основные особенности"], ["Середина XIX века", "Распространение идей Конта и позитивизма, знакомство с западной социологией"], ["1860–1870-е годы", "Формирование российской социологии как самостоятельного направления; появление работ Лаврова и Михайловского"], ["Конец XIX века", "Развитие субъективной школы, натурализма, психологического направления и марксизма"], ["Начало XX века", "Укрепление научных школ, развитие преподавания и учебной литературы, работы Ковалевского, Кареева и Сорокина"], ["После 1917 года", "Изменение условий развития социологии, усиление идеологического контроля"], ["Советский период", "Ограничение самостоятельности социологии, последующее восстановление социологических исследований"], ["Современный период", "Развитие отечественной социологии как самостоятельной научной дисциплины"]]], ["p", "Обрати внимание: это обобщённая схема. В учебной литературе встречаются разные периодизации, поскольку исследователи по-разному определяют границы этапов."], ["h", "Вывод"], ["p", "Российская социология сформировалась во второй половине XIX века под влиянием европейского позитивизма, но быстро приобрела собственные особенности. Её развитие было тесно связано с общественно-политическими проблемами России, поиском путей общественного переустройства и вопросами социального прогресса."], ["p", "Главной особенностью отечественной социологической мысли стало разнообразие направлений: субъективная школа, натурализм, психологизм и марксизм. Российские учёные не просто заимствовали зарубежные идеи, а создавали оригинальные концепции, в которых большое значение придавалось личности, нравственным ценностям и конкретным историческим условиям развития общества."], ["p", "Несмотря на серьёзные ограничения после революции 1917 года, дореволюционная российская социология заложила основу для дальнейшего развития отечественной науки."], ["h3", "Что важно запомнить к экзамену"], ["ol", 1, ["1868–1869 годы — начало становления социологии в России как самостоятельной научной дисциплины. Основные публикации: Лавров («Задачи позитивизма и их решение», «Исторические письма») и Михайловский («Что такое прогресс?»).", "Главная особенность — тесная связь социологии с общественно-политической жизнью и проблемами преобразования российского общества.", "Основные направления — позитивизм, натурализм, географический детерминизм, субъективная школа, психологизм и марксизм.", "Главные представители — П. Лавров, Н. Михайловский, Н. Кареев, Е. де Роберти, М. Ковалевский, П. Сорокин, Г. Плеханов и В. Ленин.", "1897 год — публикация «Введения в изучение социологии» Н. Кареева.", "1922 год — высылка значительной части российской интеллигенции, в том числе П. Сорокина, и серьёзный перелом в развитии отечественной социологии."]]], "nb": 1}, {"n": 23, "q": "Классический этап российской социологии, основные направления исследований и представители.", "b": [["p", "Классический этап российской социологии охватывает вторую половину XIX — начало XX века. В это время отечественная социология постепенно превращается в самостоятельную научную дисциплину, формируются собственные научные школы, появляются оригинальные теории общества и общественного развития."], ["p", "В отличие от западноевропейской социологии, российская мысль этого периода была особенно тесно связана с вопросами общественного переустройства, социального прогресса, положения личности, роли государства и исторического пути России."], ["p", "Единой общепринятой периодизации этого этапа нет. В учебной литературе обычно выделяют несколько периодов и направлений, которые частично развивались одновременно. Для ответа на билет удобнее рассмотреть основные школы по отдельности."], ["h", "1. Субъективная школа"], ["p", "Одно из главных направлений"], ["p", "Субъективная школа, или этико-субъективное направление, стала одной из наиболее самобытных особенностей российской социологии. Она сформировалась в 1860-е годы и была связана прежде всего с именами Петра Лаврова, Николая Михайловского и Николая Кареева. В более широком кругу представителей также называют Сергея Южакова."], ["p", "Главная идея школы заключалась в том, что общество нельзя изучать исключительно как объективную систему, существующую независимо от человека. Необходимо учитывать личность, её интересы, нравственные убеждения, идеалы и способность сознательно влиять на общественную жизнь."], ["p", "Сторонники школы считали, что исследователь не должен полностью отказываться от нравственной оценки общественных явлений. Социология должна не только объяснять, как устроено общество, но и помогать оценивать его с точки зрения человеческих ценностей, справедливости и прогресса."], ["p", "Важным понятием выступала личность. Именно человек, обладающий сознанием, способностью мыслить и действовать, рассматривался как активный участник исторического процесса. При этом личность не существует отдельно от общества: она формируется в социальных условиях и одновременно способна изменять их."], ["p", "Пётр Лавров (1823–1900)"], ["p", "Пётр Лаврович Лавров — философ, публицист и один из основателей субъективной социологии в России. Он стремился объяснить закономерности общественного развития, сохраняя при этом особое внимание к личности и её нравственной ответственности."], ["p", "Лавров определял социологию как науку, изучающую формы проявления, усиления и ослабления солидарности между сознательными людьми. Под солидарностью он понимал способность людей осознавать общие интересы, объединяться и действовать совместно."], ["p", "Важнейшей проблемой для Лаврова был общественный прогресс. Он считал, что прогресс нельзя оценивать только по экономическому росту, развитию техники или усложнению общественного устройства. Главным критерием должна быть степень развития личности и расширения человеческой свободы."], ["p", "Особую роль в истории он отводил критически мыслящим личностям. Это люди, способные самостоятельно анализировать общественную жизнь, критиковать существующий порядок, формулировать новые идеи и сознательно участвовать в преобразовании общества."], ["p", "По мнению Лаврова, такие личности способны ускорять общественное развитие. Однако их деятельность должна быть связана с интересами народа и направлена на улучшение общественной жизни."], ["p", "Одной из главных работ Лаврова стали «Исторические письма» (1868–1869). В них он рассматривал историческое развитие, роль личности и значение нравственной ответственности перед обществом. Также важна статья «Задачи позитивизма и их решение», связанная с распространением социологического подхода в России."], ["p", "Николай Михайловский (1842–1904)"], ["p", "Николай Константинович Михайловский — социолог, публицист и один из главных представителей субъективной школы. Он развивал идеи Лаврова, уделяя особое внимание личности, общественному прогрессу и взаимодействию человека с обществом."], ["p", "Одной из центральных проблем его исследований было соотношение личности и общества. Михайловский считал, что развитие общества не всегда означает развитие самого человека. Например, усложнение разделения труда может повышать производительность и эффективность производства, но одновременно приводить к тому, что человек выполняет лишь узкую функцию и теряет возможность всесторонне развиваться."], ["p", "Большое значение имела его критика чрезмерного разделения труда. Михайловский полагал, что общественное устройство должно оцениваться не только по экономической эффективности, но и по тому, насколько оно способствует развитию личности."], ["p", "Он также разработал теорию героев и толпы. **Герой — это человек, который благодаря своим действиям или поступкам способен повлиять на поведение окружающих.** **Толпа в этой концепции — группа людей, которая под воздействием определённого примера может объединиться и начать действовать сходным образом.**"], ["p", "Михайловский обращал внимание на то, что влияние отдельной личности на общество зависит от конкретных исторических условий и особенностей самой группы. Его теория была попыткой объяснить механизмы массового поведения и роль личности в истории."], ["p", "Основные работы:"], ["ul", ["«Что такое прогресс?» (1869);", "«Герои и толпа» (1882);", "«Борьба за индивидуальность» (1875)."]], ["p", "Николай Кареев (1850–1931)"], ["p", "Николай Иванович Кареев — историк, социолог и методолог исторической науки. Он занимался вопросами общественного развития, роли личности в истории и методами социологического познания."], ["p", "Кареев полагал, что социология должна выявлять закономерности общественных явлений. При этом для понимания общества необходимо учитывать не только материальные условия, но и психологические особенности людей, их коллективное сознание и взаимодействие."], ["p", "Он рассматривал общество как сложную систему взаимодействий личностей. Особое внимание уделял тому, как формируются культурные группы, социальная организация и положение человека в обществе."], ["p", "Кареев также подчёркивал значение свободы личности. Он связывал общественный прогресс с расширением возможностей человека и развитием его самостоятельности."], ["p", "Основные работы:"], ["ul", ["«Основные вопросы философии истории» (1883);", "«Сущность исторического процесса и роль личности в истории» (1889);", "«Введение в изучение социологии» (1897);", "«Общие основы социологии» (1919)."]], ["p", "В целом субъективная школа внесла значительный вклад в развитие российской социологии. Её представители поставили в центр исследований человека, его нравственные ценности и способность влиять на историю. При этом их подход иногда критиковали за чрезмерное внимание к субъективным оценкам и недостаточное внимание к объективным социальным закономерностям."], ["h", "2. Натуралистическое направление"], ["p", "Натуралистическое направление основывалось на стремлении объяснять общественные явления с помощью закономерностей природы. Его представители полагали, что развитие общества во многом зависит от природных, биологических и географических факторов."], ["p", "В российской социологии особенно выделялись две разновидности натурализма: географический детерминизм и органицизм."], ["p", "Географический детерминизм"], ["p", "Сторонники этого направления считали, что природная среда оказывает значительное влияние на развитие общества. Климат, географическое положение, рельеф, водные ресурсы и природные условия влияют на хозяйственную деятельность людей, формы расселения, политическое устройство и историческое развитие."], ["p", "Главным представителем был Лев Мечников (1838–1888)."], ["p", "Лев Ильич Мечников — русский географ, социолог и публицист. Он исследовал связь между природными условиями и развитием цивилизаций, а также роль сотрудничества людей в общественном прогрессе."], ["p", "В своей работе «Цивилизация и великие исторические реки» (1889) Мечников утверждал, что важнейшим фактором развития общества являются водные ресурсы и пути сообщения."], ["p", "Он выделял три основных этапа развития цивилизации:"], ["ul", ["**речная цивилизация — развитие древних обществ в долинах крупных рек;**", "**морская цивилизация — расширение торговли и взаимодействия благодаря морским путям;**", "океанская, или всемирная, цивилизация — формирование более широких международных связей."]], ["p", "Однако Мечников не сводил общественное развитие исключительно к географии. Он также подчёркивал значение кооперации и солидарности. По его мнению, общественный прогресс связан с тем, насколько люди способны сотрудничать, объединять усилия и создавать более свободные формы общественной организации."], ["p", "В качестве критерия прогресса он рассматривал развитие солидарности и степень свободы людей."], ["p", "Другим представителем географического направления был Афанасий Щапов (1831–1876). Он изучал особенности территориального развития России, роль местного самоуправления, общины и природно-географических условий в истории страны."], ["p", "Органицизм"], ["p", "Органицизм рассматривал общество по аналогии с живым организмом. Сторонники этого подхода полагали, что общество состоит из взаимосвязанных частей, каждая из которых выполняет определённые функции. Если меняется одна часть, это может повлиять на работу всей социальной системы."], ["p", "К представителям российского органицизма относились Александр Стронин (1826/1827–1889) и Павел Лилиенфельд (1829–1903)."], ["p", "Александр Стронин — российский социолог, развивавший органический подход к обществу. Он стремился объяснять общественные процессы через аналогии с устройством и развитием живых организмов."], ["p", "Павел Лилиенфельд — российский социолог и государственный деятель. Он рассматривал общество как целостную систему, развитие которой можно сопоставлять с процессами в живой природе."], ["p", "Органицисты стремились найти общие закономерности, которые объясняли бы развитие как природных организмов, так и общества. Однако такой подход критиковали за чрезмерное уподобление общественной жизни биологическим процессам: общество обладает сознанием, культурой и целенаправленной деятельностью людей, поэтому его нельзя полностью объяснить законами биологии."], ["h", "3. Психологическое направление"], ["p", "Психологическое направление исходило из того, что общественную жизнь необходимо объяснять через психологические особенности людей: их чувства, потребности, стремления, привычки, волю и особенности коллективного сознания."], ["p", "Представители этого направления считали, что общество формируется не только под влиянием материальных условий и внешних обстоятельств, но и благодаря психическому взаимодействию людей."], ["p", "Одним из наиболее известных представителей был Евгений де Роберти (1843–1915)."], ["p", "Евгений Валентинович де Роберти — российский философ, социолог и представитель позитивизма. Он стремился создать целостную систему социологического знания, объединяющую психологические, исторические и социальные объяснения."], ["p", "Де Роберти считал, что в основе общественной жизни лежит взаимодействие людей, которое постепенно приводит к формированию социальных групп, институтов и культурных явлений."], ["p", "Он использовал понятие «надорганическое». Под ним понималась особая область явлений, возникающих в результате взаимодействия людей и не сводимых непосредственно к биологическим процессам. К этой области относились наука, философия, искусство, религия, хозяйственная, правовая и политическая деятельность."], ["p", "Таким образом, Роберти стремился показать, как из простых взаимодействий людей постепенно возникают сложные формы общественной жизни."], ["p", "Важное место в его концепции занимала мысль о том, что развитие общества связано с развитием человеческого мышления и культуры."], ["p", "Среди его работ выделяют исследования по социологии и философии общественного развития."], ["p", "Другим важным представителем психологического направления был Николай Коркунов (1853–1904) — российский юрист и обществовед. Он рассматривал общество как результат психического единения людей. По его мнению, общие представления, чувства и волевые установки связывают людей в устойчивые социальные образования."], ["p", "Коркунов также изучал государство и право, рассматривая их как явления, тесно связанные с коллективной психологией и общественным сознанием."], ["h", "4. Позитивизм и многофакторная социология Максима Ковалевского"], ["p", "Позитивизм продолжал оказывать большое влияние на российскую социологию. Его представители стремились изучать общество научными методами, опираясь на наблюдение, сравнение, исторические факты и выявление закономерностей."], ["p", "Особое место занимал Максим Ковалевский (1851–1916)."], ["p", "Максим Максимович Ковалевский — российский социолог, историк, правовед и один из крупнейших представителей отечественной социологии. Он стремился создать общую теорию общества, объединяющую достижения различных наук."], ["p", "Ковалевский считал, что общественные явления нельзя объяснить действием только одного фактора. На развитие общества одновременно влияют экономика, политика, право, религия, географические условия, культура и другие обстоятельства."], ["p", "Поэтому его подход часто называют многофакторным, а также связывают с плюралистической социологией."], ["p", "Особое значение он придавал сравнительно-историческому методу. Исследователь должен сопоставлять различные общества, изучать их историческое развитие, находить общие черты и различия. Это позволяло выявлять закономерности, не сводя историю всех народов к одной универсальной схеме."], ["p", "Ковалевский также развивал генетическую социологию — подход, ориентированный на изучение происхождения и постепенного развития социальных институтов и общественных отношений."], ["p", "Он исследовал происхождение семьи, собственности, государства, права и других социальных институтов. Для этого использовал исторические, этнографические и сравнительные материалы."], ["p", "Важной идеей Ковалевского была социальная солидарность. Он полагал, что развитие общества связано с расширением сотрудничества между людьми и группами, а также с постепенным преодолением социальных противоречий."], ["p", "Ковалевский был не только теоретиком, но и организатором социологической науки. Он участвовал в развитии профессионального социологического образования и научных объединений."], ["p", "Основные работы:"], ["ul", ["«Современные социологи» (1905);", "«Социология» (1910);", "работы по истории общественных институтов и сравнительному изучению обществ."]], ["p", "Значение Ковалевского заключается в том, что он стремился объединить разные подходы и показать сложность общественного развития. В отличие от сторонников односторонних объяснений, он рассматривал общество как результат взаимодействия множества факторов."], ["h", "5. Социокультурное направление: Николай Данилевский"], ["p", "Отдельное место в российской социологии занимали идеи Николая Данилевского (1822–1885)."], ["p", "Николай Яковлевич Данилевский — русский мыслитель, публицист и естествоиспытатель. Он известен прежде всего своей теорией культурно-исторических типов, изложенной в работе «Россия и Европа»."], ["p", "Данилевский выступал против представления о том, что всё человечество развивается по единой линии, проходя одни и те же этапы. Он считал, что у разных народов и цивилизаций существуют собственные пути исторического развития."], ["p", "Основой его концепции стала теория культурно-исторических типов. Под культурно-историческим типом он понимал особую историческую общность, обладающую собственной культурой, языком, религией, политическим устройством и особенностями общественной жизни."], ["p", "Данилевский выделял несколько самостоятельных культурно-исторических типов, например египетский, китайский, индийский, греческий, римский и германо-романский. Особое значение он придавал славянскому типу, считая, что он обладает собственным потенциалом развития."], ["p", "Он выделял четыре основные сферы культурной деятельности:"], ["ol", 1, ["Религиозная деятельность.", "Собственно культурная деятельность — наука, искусство и промышленность.", "Политическая деятельность.", "Общественно-экономическая деятельность."]], ["p", "Главная мысль Данилевского заключалась в том, что ни одна цивилизация не должна рассматриваться как единственный образец развития для остальных. Различные культуры имеют собственные особенности, достижения и исторические задачи."], ["p", "Основная работа — «Россия и Европа» (1869)."], ["p", "Значение Данилевского состоит в том, что он предложил альтернативу линейным теориям общественного прогресса и обратил внимание на культурное многообразие человечества. Его идеи стали важной предпосылкой для последующих цивилизационных подходов к изучению общества."], ["h", "6. Социологические идеи народничества"], ["p", "Народничество было общественно-политическим и интеллектуальным движением, которое оказало большое влияние на развитие российской социологии второй половины XIX века."], ["p", "Народники считали, что Россия может пойти по особому пути развития, не повторяя полностью западноевропейскую модель капитализма. Большие надежды они связывали с крестьянской общиной, которая, по их мнению, могла стать основой будущего более справедливого общества."], ["p", "Народнические мыслители уделяли внимание положению крестьянства, социальной справедливости, общинным формам хозяйства и возможности преобразования общественного устройства."], ["p", "К представителям народнической мысли относились:"], ["ul", ["Михаил Бакунин (1814–1876) — философ и теоретик анархизма. Выступал против государственной власти и принудительных форм общественной организации, отстаивал идею свободного объединения людей.", "Пётр Лавров (1823–1900) — связывал общественный прогресс с деятельностью критически мыслящих личностей и нравственной ответственностью перед народом.", "Николай Михайловский (1842–1904) — исследовал отношения личности и общества, критиковал такое общественное развитие, при котором экономическая эффективность достигается за счёт ограничения индивидуальности.", "Пётр Кропоткин (1842–1921) — развивал идеи анархизма и взаимопомощи как важного фактора общественного развития.", "Пётр Ткачёв (1844–1886) — рассматривал вопросы революционного преобразования общества и роли политической организации."]], ["p", "Народнические идеи были тесно связаны с субъективной школой, поскольку обе традиции уделяли большое внимание личности, нравственным ценностям, общественному идеалу и возможности сознательного преобразования общества."], ["p", "Однако народничество нельзя полностью отождествлять с субъективной социологией: это более широкое общественно-политическое движение, внутри которого существовали различные взгляды на пути развития России."], ["h", "7. Марксистское направление"], ["p", "Марксизм возник в России во второй половине XIX века под влиянием работ Карла Маркса и Фридриха Энгельса. Его представители стремились объяснять общественное развитие через материальные условия жизни, экономические отношения и классовую структуру общества."], ["p", "Основой марксистской социологии стало материалистическое понимание истории. Согласно этому подходу, для понимания общественной жизни необходимо прежде всего изучать способ производства материальных благ и отношения, которые складываются между людьми в процессе производства."], ["p", "Марксисты считали, что общество разделено на классы, положение которых определяется их отношением к средствам производства. Между классами возникают противоречия, которые могут приводить к социальным конфликтам и историческим изменениям."], ["p", "Важное место занимала идея общественно-экономических формаций. История рассматривалась как последовательная смена определённых типов общественного устройства, основанных на различных способах производства."], ["p", "Николай Зибер (1844–1888)"], ["p", "Николай Иванович Зибер — российский экономист и один из первых распространителей марксистских идей в России. Он исследовал экономические отношения и стремился показать значение учения Маркса для понимания общественного развития."], ["p", "Зибер занимался изучением экономических взглядов Маркса, прежде всего его теории стоимости и анализа капиталистического производства. Он сыграл важную роль в распространении марксизма среди российских исследователей."], ["p", "Георгий Плеханов (1856–1918)"], ["p", "Георгий Валентинович Плеханов — философ, публицист и один из основателей русского марксизма. Он развивал материалистическое понимание истории и занимался вопросами общественного развития, классовой борьбы и роли личности в истории."], ["p", "Плеханов считал, что общественное развитие определяется прежде всего материальными условиями и экономическими отношениями. При этом он не отрицал влияния политических, идеологических и культурных факторов, но рассматривал их в связи с экономической основой общества."], ["p", "Он также исследовал роль личности в истории. По его мнению, выдающиеся личности могут влиять на ход событий, но их деятельность ограничена историческими условиями и общественными закономерностями."], ["p", "Важные работы:"], ["ul", ["«К вопросу о развитии монистического взгляда на историю» (1895);", "«К вопросу о роли личности в истории» (1898)."]], ["p", "Владимир Ленин (1870–1924)"], ["p", "Владимир Ильич Ленин — политический деятель и теоретик марксизма. Он развивал марксистское понимание общества, исследовал капитализм, классовую структуру, государство и революционные изменения."], ["p", "Ленин уделял большое внимание анализу российского капитализма, положения рабочего класса и крестьянства, а также социально-экономических противоречий российского общества."], ["p", "В работе «Развитие капитализма в России» (1899) он анализировал формирование капиталистических отношений, развитие промышленности и изменение социальной структуры страны."], ["p", "Марксистское направление стало одним из наиболее влиятельных в российской общественной мысли. Впоследствии именно марксизм-ленинизм превратился в официальную идеологическую основу советской общественной науки."], ["h", "8. Антипозитивизм и неокантианство"], ["p", "К концу XIX — началу XX века усилилась критика позитивизма и натуралистических подходов. Некоторые исследователи считали, что общество нельзя изучать исключительно по образцу естественных наук, поскольку человеческая деятельность связана с сознанием, ценностями, целями и нормами."], ["p", "Так возникло антипозитивистское направление, одним из наиболее заметных вариантов которого стало неокантианство."], ["p", "Неокантианцы подчёркивали, что общественные явления имеют особую природу. Для их понимания необходимо учитывать ценности, цели и смыслы, которыми руководствуются люди."], ["p", "К представителям этого направления относились:"], ["ul", ["Богдан Кистяковский (1868–1920) — философ, социолог и правовед. Исследовал методологию социальных наук, правовые отношения и роль социальных норм.", "Лев Петражицкий (1867–1931) — юрист и социолог, разработавший психологическую теорию права. Он считал, что правовые явления связаны с особыми эмоционально-психическими переживаниями людей.", "Александр Лаппо-Данилевский (1863–1919) — историк и методолог, изучавший особенности исторического познания и роль ценностей в исследовании общественных явлений.", "Павел Новгородцев (1866–1924) — философ и правовед, уделявший внимание нравственным основаниям права и идее правового государства."]], ["p", "Особое место занимал легальный марксизм — течение, представители которого первоначально использовали марксистский анализ общества, но постепенно отходили от ряда положений ортодоксального марксизма."], ["p", "К легальным марксистам относились Пётр Струве, Николай Бердяев, Сергей Булгаков и Михаил Туган-Барановский. Они уделяли внимание экономическому развитию, социальным отношениям, роли культуры и духовных ценностей."], ["p", "Таким образом, к началу XX века российская социология стала более разнообразной в методологическом отношении. Исследователи всё чаще стремились не только объяснять общество через объективные закономерности, но и учитывать ценности, сознание и особенности человеческой деятельности."], ["h", "9. Основные направления и представители: краткое сопоставление"], ["tbl", [["Направление", "Главная идея", "Представители"], ["Субъективная школа", "Роль личности, нравственности и сознательной деятельности в общественном прогрессе", "П. Лавров, Н. Михайловский, Н. Кареев, С. Южаков"], ["Географический детерминизм", "Влияние природной среды на развитие общества", "Л. Мечников, А. Щапов"], ["Органицизм", "Общество как целостная система, подобная живому организму", "А. Стронин, П. Лилиенфельд"], ["Психологическое направление", "Влияние психики и коллективного сознания на общественные процессы", "Е. де Роберти, Н. Коркунов, Н. Кареев"], ["Позитивизм и многофакторный подход", "Изучение общества научными методами, учёт множества факторов", "М. Ковалевский"], ["Социокультурное направление", "Самостоятельность и своеобразие культурно-исторических типов", "Н. Данилевский"], ["Народничество", "Особый путь развития России, значение крестьянской общины", "П. Лавров, Н. Михайловский, П. Кропоткин, П. Ткачёв"], ["Марксизм", "Экономические отношения, классы и материальные закономерности истории", "Н. Зибер, Г. Плеханов, В. Ленин"], ["Антипозитивизм и неокантианство", "Роль ценностей, норм и смыслов в общественной жизни", "Б. Кистяковский, Л. Петражицкий, А. Лаппо-Данилевский, П. Новгородцев"]]], ["h", "Вывод"], ["p", "Классический этап российской социологии характеризовался большим разнообразием научных направлений и оригинальных теоретических концепций. Российские исследователи изучали общество с разных сторон: одни обращали внимание на природные условия и устройство социальных систем, другие — на психологию человека, нравственность и роль личности, третьи — на экономические отношения, классовую структуру и исторические закономерности."], ["p", "Особое значение имела субъективная школа Лаврова и Михайловского, которая поставила в центр социологического анализа личность и её способность влиять на общественное развитие. Большой вклад также внесли Ковалевский, Данилевский, Мечников, де Роберти, Плеханов и другие исследователи."], ["p", "Главный результат классического этапа — формирование самостоятельной отечественной социологической традиции, которая не только воспринимала зарубежные идеи, но и создавала собственные теории общества, социального прогресса и исторического развития."]], "nb": 1}, {"n": 24, "q": "Развитие отечественной социологии в советский период.", "b": [["p", "Развитие социологии в СССР было противоречивым. С одной стороны, проводились исследования общества, создавались научные организации и развивались методы сбора информации. С другой стороны, социология находилась под сильным влиянием государственной идеологии, а самостоятельные теории, не соответствовавшие марксизму-ленинизму, подвергались критике."], ["p", "В истории советской социологии можно выделить три основных этапа: 1918–1938 годы, конец 1950-х — 1988 год и 1989–1991 годы."], ["p", "Первый этап — 1918–1938 годы."], ["p", "В первые годы после революции социология продолжала развиваться. Появлялись новые работы, открывались возможности для преподавания и исследований. Например, в 1920 году Питирим Сорокин опубликовал двухтомную «Систему социологии», в которой рассматривал общество как систему взаимодействующих людей и социальных групп."], ["p", "Однако постепенно усиливалось влияние марксистско-ленинской идеологии. Единственно правильным подходом к изучению общества признавался исторический материализм. Независимые социологические концепции вытеснялись, а многие учёные подвергались преследованиям или эмигрировали. В 1922 году из страны был выслан Питирим Сорокин."], ["p", "К концу 1930-х годов социология фактически утратила положение самостоятельной научной дисциплины. Её отдельные проблемы продолжали изучаться в рамках философии, истории, экономики и статистики, но проведение независимых социологических исследований было сильно ограничено."], ["p", "Второй этап — конец 1950-х — 1988 год. Возрождение советской социологии."], ["p", "Возрождение социологии началось в период «оттепели» Н. С. Хрущёва. Стало очевидно, что для управления обществом недостаточно только теоретических рассуждений: необходимо изучать реальные условия жизни населения, трудовые отношения, семью, образование и общественное мнение."], ["p", "В 1958 году была создана Советская социологическая ассоциация, объединившая исследователей и способствовавшая развитию социологических работ."], ["p", "В 1960-е годы начали открываться научные центры и лаборатории. Важным событием стало создание в 1968 году Института конкретных социальных исследований АН СССР (ИКСИ). В 1972 году он был переименован в Институт социологических исследований, а в 1988 году — в Институт социологии АН СССР."], ["p", "В этот период активно развивались конкретные социологические исследования. Учёные использовали анкетирование, интервью, наблюдение и статистический анализ. Изучались трудовые коллективы, условия труда, городская жизнь, молодёжь, семья, образование и социальное поведение населения."], ["p", "Среди наиболее известных представителей советской социологии:"], ["ul", ["Геннадий Осипов — один из организаторов возрождения социологии в СССР, занимался развитием конкретных социальных исследований.", "Владимир Ядов — изучал социальное поведение, установки личности и методологию социологических исследований.", "Александр Здравомыслов — исследовал социальные отношения, трудовые коллективы и проблемы личности.", "Борис Грушин — занимался изучением общественного мнения и массового сознания.", "Татьяна Заславская — исследовала социальную структуру советского общества, экономические процессы и положение различных социальных групп.", "Юрий Левада — изучал общественное мнение, массовое сознание и социальные изменения."]], ["p", "Несмотря на развитие исследований, социология оставалась зависимой от государства. Учёные не всегда могли свободно выбирать темы и делать выводы, противоречившие официальной идеологии. Поэтому развитие дисциплины сочетало научные достижения и идеологические ограничения."], ["p", "Третий этап — 1989–1991 годы."], ["p", "В период перестройки ограничения постепенно ослабевали. Социологи получили больше возможностей для изучения острых общественных проблем: социального неравенства, кризиса советской системы, политических настроений, отношения населения к реформам."], ["p", "Усилилась роль опросов общественного мнения, расширились контакты с зарубежными исследователями. Социология стала постепенно возвращаться к полноценному положению самостоятельной науки."], ["v", "Итог", "советский период прошёл путь от первоначального развития социологии через её идеологическое ограничение к возрождению самостоятельных исследований. Именно в 1960–1980-е годы были заложены организационные и методологические основы современной российской социологии."]], "nb": 1}, {"n": 25, "q": "Современная отечественная социология: основные направления исследований и представители.", "b": [["p", "Современная отечественная социология начала формироваться в конце 1980-х — начале 1990-х годов. Распад СССР, переход к рыночной экономике и политические преобразования привели к серьёзным изменениям в жизни общества. Социологам пришлось изучать новые социальные отношения, проблемы неравенства, безработицы, бедности, политического поведения и изменения ценностей населения."], ["p", "Главной особенностью современной российской социологии стало расширение тем исследований и методов. Учёные стали активнее использовать международные теории, проводить массовые опросы, интервью, наблюдения и сравнительные исследования."], ["p", "Основные направления современной отечественной социологии:"], ["ol", 1, ["Социология социальной структуры и стратификации."]], ["p", "Изучает социальное неравенство, классы и слои общества, бедность, богатство, социальную мобильность и возможности людей изменить своё положение."], ["p", "Важные представители: Наталья Тихонова, исследующая социальную структуру и неравенство в современной России; Овсей Шкаратан, занимавшийся проблемами социальной стратификации; Михаил Горшков, изучающий социальные изменения и массовое сознание."], ["ol", 2, ["Экономическая социология."]], ["p", "Изучает взаимосвязь экономики и общества, трудовые отношения, занятость, потребление, предпринимательство и поведение людей на рынке."], ["p", "Представители: Татьяна Заславская, исследовавшая социальные механизмы экономических преобразований; Вадим Радаев, занимающийся социологией рынков, потребления и экономического поведения."], ["ol", 3, ["Социология политики и общественного мнения."]], ["p", "Исследует политическое поведение граждан, отношение населения к власти, политические установки, общественные настроения и участие людей в общественной жизни."], ["p", "Среди известных исследователей — Борис Грушин, один из основателей изучения общественного мнения в СССР и России, и Юрий Левада, занимавшийся исследованием массового сознания и общественных представлений."], ["ol", 4, ["Социология семьи и демографии."]], ["p", "Изучает брачное и семейное поведение, рождаемость, смертность, разводы, отношения между поколениями и изменение семейных ценностей."], ["p", "Один из известных представителей — Анатолий Антонов, развивавший отечественную социологию семьи и семейно-демографические исследования."], ["ol", 5, ["Социология труда и занятости."]], ["p", "Изучает условия труда, отношения между работниками и работодателями, безработицу, профессиональную мобильность и изменения рынка труда."], ["p", "Важный представитель — Жан Тощенко, исследующий социальные проблемы труда, занятости и изменения образа жизни населения."], ["ol", 6, ["Социология образования и молодёжи."]], ["p", "Исследует доступность образования, образовательное неравенство, профессиональное самоопределение, положение молодёжи и её ценностные установки."], ["p", "Одним из известных исследователей образования является Давид Константиновский, изучающий образовательные возможности и социальное неравенство в сфере образования."], ["ol", 7, ["Социология культуры, этносоциология и социология коммуникаций."]], ["p", "Эти направления изучают культурные ценности, национальные и этнические отношения, влияние средств массовой информации и цифровых коммуникаций на общество."], ["p", "Среди представителей можно выделить Леокадию Дробижеву, исследующую межэтнические отношения и этническую идентичность, и А. К. Мамедова, занимающегося социологией коммуникаций."], ["p", "Перечисленные направления представлены в современных исследованиях российских университетов и научных организаций."], ["p", "Особенности современной российской социологии"], ["p", "Современная отечественная социология имеет несколько характерных черт:"], ["ul", ["Практическая направленность: результаты исследований применяются при разработке социальной политики, образовательных программ и управленческих решений.", "Разнообразие методов: используются массовые опросы, интервью, фокус-группы, наблюдение, статистический анализ и цифровые методы.", "Междисциплинарность: социология взаимодействует с экономикой, политологией, психологией, демографией и другими науками.", "Изучение быстро меняющегося общества: особое внимание уделяется цифровизации, социальному неравенству, миграции, изменению рынка труда и ценностей населения."]], ["p", "Например, в исследованиях 2020-х годов заметное место занимают вопросы социальной стратификации, экономических изменений, занятости и новых форм неравенства."], ["v", "Итог", "современная российская социология представляет собой разнообразную систему научных направлений. Она изучает практически все стороны общественной жизни — от экономики и политики до семьи, образования и культуры. Её главная задача — объяснять происходящие социальные изменения и предоставлять научную основу для решения общественных проблем."]], "nb": 1}, {"n": 26, "q": "Российский период в социологическом творчестве П. Сорокина.", "b": [["p", "Питирим Александрович Сорокин (1889–1968) — русский и американский социолог, один из крупнейших представителей социологии XX века. Он внёс значительный вклад в развитие теории социального взаимодействия, социальной стратификации и социальной мобильности."], ["p", "Российский период его творчества продолжался до 1922 года, когда учёный был выслан из Советской России. Именно в этот период сформировались основные положения его ранней социологической теории."], ["ol", 1, ["Биография и начало научной деятельности"]], ["p", "Сорокин родился 21 января 1889 года в селе Турья Вологодской губернии. Получил образование в Санкт-Петербургском университете, где изучал право и общественные науки. Уже в студенческие годы он интересовался социологией, участвовал в научной и политической деятельности."], ["p", "После Февральской революции 1917 года Сорокин занимался политикой, был секретарём Александра Керенского и участвовал в деятельности партии социалистов-революционеров. Однако позднее он отошёл от политической деятельности и сосредоточился на преподавании и научной работе."], ["p", "В 1919 году Сорокин стал одним из организаторов первой в России кафедры социологии при Петроградском университете. В 1920 году он был избран профессором и возглавил кафедру социологии."], ["ol", 2, ["Основные идеи российского периода"]], ["p", "Главным предметом социологии Сорокин считал социальное взаимодействие людей. По его мнению, общество нельзя понимать просто как совокупность отдельных индивидов: оно возникает благодаря связям, отношениям и взаимодействиям между людьми."], ["p", "Сорокин выделял три элемента социального взаимодействия:"], ["ul", ["Индивиды — участники взаимодействия.", "**Акты (действия и реакции) — поведение людей по отношению друг к другу.**", "**Проводники — средства, через которые передаётся воздействие: язык, деньги, символы и другие.**"]], ["p", "Учёный стремился изучать общество научными методами, опираясь на наблюдение и анализ реальных социальных процессов. При этом он признавал, что общество обладает собственной спецификой и не может полностью изучаться по аналогии с природой."], ["ol", 3, ["Главная работа российского периода — «Система социологии» (1920)"]], ["p", "Это наиболее значительный труд Сорокина российского периода. Он был задуман как масштабное исследование теории и методологии социологии. Учёный планировал выпустить восемь томов, однако опубликовал только два."], ["p", "В работе он рассматривал строение социальных явлений, взаимодействие людей, социальные группы и механизмы организации общества. Сорокин стремился создать целостную систему социологического знания, которая объясняла бы основные закономерности общественной жизни."], ["p", "Также важное место в его ранних исследованиях занимали преступность, мораль, общественное поведение и социальные нормы."], ["ol", 4, ["Завершение российского периода"]], ["p", "В начале 1920-х годов отношения Сорокина с советской властью ухудшились. Осенью 1922 года он был выслан из страны вместе с группой представителей российской интеллигенции. Впоследствии переехал в США, где продолжил научную деятельность."], ["p", "Важно различать российский и американский периоды его творчества: в России Сорокин главным образом разрабатывал теорию социального взаимодействия и общую систему социологии, а в США значительно развил теории социальной мобильности, стратификации и социокультурной динамики."], ["v", "Итог", "российский период стал основой научного мировоззрения Сорокина. Его главная заслуга заключалась в разработке оригинальной теории социального взаимодействия и попытке представить социологию как целостную самостоятельную науку."]], "nb": 1}, {"n": 27, "q": "Понятие общества и его признаки. Структура общественной системы.", "b": [["p", "**Общество — это исторически сложившаяся система совместной деятельности людей, их взаимодействий, социальных отношений и институтов.**"], ["p", "В широком смысле общество представляет собой обособившуюся от природы часть материального мира, связанную с жизнедеятельностью людей. В более узком смысле под обществом понимают конкретную историческую общность или население определённой страны."], ["p", "Общество нельзя сводить только к населению определённой территории. Оно представляет собой сложную систему, в которой люди связаны между собой различными отношениями, правилами и институтами."], ["p", "Основные признаки общества"], ["ol", 1, ["Наличие общей территории. Люди живут и взаимодействуют в определённом географическом пространстве. Территория создаёт условия для формирования устойчивых связей между населением.", "Целостность и устойчивость. Общество представляет собой единую систему, элементы которой взаимосвязаны. Изменения в одной сфере могут влиять на другие сферы жизни.", "Самовоспроизводство. Общество способно поддерживать своё существование и продолжать развитие благодаря рождению новых поколений, воспитанию, обучению и передаче социального опыта.", "Наличие социальных институтов. В обществе существуют устойчивые формы организации деятельности людей: семья, государство, образование, религия, экономика и другие институты.", "Общая культура. Члены общества разделяют определённые нормы, ценности, традиции, язык и образцы поведения. Это помогает людям понимать друг друга и взаимодействовать.", "Способность к саморегуляции. Общество устанавливает правила поведения и контролирует их соблюдение с помощью социальных норм, общественного мнения, права и других механизмов.", "Относительная самостоятельность. Общество обладает собственными механизмами организации и развития, хотя при этом взаимодействует с природой и другими обществами."]], ["p", "Структура общественной системы"], ["p", "Общество представляет собой сложную систему, состоящую из взаимосвязанных элементов. В его структуре можно выделить несколько основных компонентов."], ["ol", 1, ["Социальные общности и группы."]], ["p", "Это объединения людей, которые имеют общие признаки, интересы или положение в обществе. К ним относятся классы, социальные слои, профессиональные группы, нации, молодёжь, семьи и другие общности."], ["p", "Именно из людей и социальных групп складывается социальная структура общества."], ["ol", 2, ["Социальные отношения."]], ["p", "Это устойчивые связи, которые возникают между людьми и группами в процессе общественной жизни. Например, отношения сотрудничества, соперничества, подчинения, власти, родства и обмена."], ["p", "Социальные отношения связывают отдельные элементы общества в единую систему."], ["ol", 3, ["Социальные институты и организации."]], ["p", "**Социальные институты — это устойчивые формы организации общественной жизни, которые регулируют поведение людей и удовлетворяют важные общественные потребности.**"], ["p", "К основным институтам относятся:"], ["ul", ["**семья — воспроизводство населения, воспитание детей и организация семейной жизни;**", "**образование — передача знаний и социального опыта;**", "**государство — управление обществом и поддержание общественного порядка;**", "**экономика — производство, распределение и потребление благ;**", "**религия — формирование духовных ценностей и верований.**"]], ["p", "**Социальные организации — это конкретные объединения людей, созданные для достижения определённых целей, например университеты, предприятия и общественные объединения.**"], ["ol", 4, ["Социальные нормы и ценности."]], ["p", "Нормы устанавливают правила поведения, принятые в обществе. Они могут быть правовыми, моральными, религиозными и традиционными."], ["p", "**Ценности — это представления о том, что считается важным и значимым для человека и общества: свобода, справедливость, семья, образование, безопасность и другие.**"], ["ol", 5, ["Культура."]], ["p", "Культура включает знания, язык, традиции, обычаи, символы, нормы и ценности, созданные и усвоенные людьми. Она обеспечивает передачу общественного опыта от одного поколения к другому."], ["p", "Основные сферы общественной жизни"], ["p", "Для более удобного изучения общество также принято разделять на четыре основные сферы:"], ["tbl", [["Сфера", "Содержание", "Примеры"], ["Экономическая", "Производство, распределение, обмен и потребление благ", "Предприятия, рынок, труд"], ["Политическая", "Власть, управление и отношения между государством и обществом", "Государство, партии, выборы"], ["Социальная", "Отношения между группами и положение людей в обществе", "Классы, семья, образование, социальная мобильность"], ["Духовная", "Создание, сохранение и распространение духовных ценностей", "Наука, культура, религия, искусство"]]], ["p", "Все четыре сферы взаимосвязаны. Например, экономические изменения могут влиять на социальное положение людей, политические решения — на систему образования, а культурные ценности — на поведение и отношения в обществе."], ["v", "Итог", "общество представляет собой сложную, целостную и постоянно развивающуюся систему. Его основными элементами являются люди, социальные группы, отношения, институты, нормы и культура. Все они взаимосвязаны и обеспечивают существование и развитие общественной жизни."]], "nb": 1}, {"n": 28, "q": "Типология обществ. Социологические модели общественного развития.", "b": [["p", "**Типология обществ — это разделение обществ на определённые типы по общим признакам и критериям.** Она позволяет сравнивать разные общества, выявлять их особенности и понимать закономерности исторического развития."], ["p", "Единой типологии не существует: разные социологи классифицируют общества в зависимости от того, какие признаки считают главными."], ["h", "1. Основные типологии обществ"], ["p", "По наличию письменности:"], ["ul", ["**дописьменные общества — не имеют собственной письменности, информация передаётся преимущественно устно;**", "**письменные общества — используют письменность для хранения и передачи информации.**"]], ["p", "По степени сложности социальной структуры:"], ["ul", ["**простые общества — имеют сравнительно небольшое количество социальных групп и слабое разделение социальных функций;**", "**сложные общества — характеризуются развитой социальной структурой, большим количеством институтов, групп и организаций.**"]], ["p", "По способу хозяйственной деятельности и уровню технологического развития выделяют три основных типа."], ["p", "Традиционное (аграрное) общество."], ["p", "Основой экономики является сельское хозяйство. Большинство населения занято земледелием и скотоводством. Для такого общества характерны господство традиций, религиозных представлений, низкий уровень социальной мобильности и медленные изменения."], ["p", "Главную роль играют семья, община, религия и традиционные формы власти."], ["p", "Индустриальное (промышленное) общество."], ["p", "Возникает в результате промышленной революции и развития машинного производства. Основу экономики составляет промышленность, активно развиваются города, транспорт и торговля."], ["p", "Основные признаки:"], ["ul", ["массовое промышленное производство;", "рост городского населения и урбанизация;", "развитие науки и техники;", "увеличение роли образования;", "расширение социальной мобильности;", "ослабление влияния традиций."]], ["p", "Постиндустриальное общество (в ряде учебников отождествляется с информационным)."], ["p", "Основой экономики становится сфера услуг, информация, знания и высокие технологии. Большое значение приобретают образование, наука, информационные системы и профессиональная деятельность."], ["p", "Характерные черты:"], ["ul", ["развитие информационных технологий;", "автоматизация производства;", "увеличение занятости в сфере услуг;", "превращение знаний и информации в важнейшие ресурсы;", "повышение значения образования и квалификации;", "развитие глобальных коммуникаций."]], ["p", "Эти три типа не всегда существуют отдельно друг от друга. В одном обществе могут одновременно присутствовать черты традиционного, индустриального и постиндустриального устройства."], ["h", "2. Основные подходы к общественному развитию"], ["p", "Формационный подход К. Маркса."], ["p", "Формационный подход рассматривает историю как последовательную смену общественно-экономических формаций."], ["p", "**Общественно-экономическая формация — это стадия общественного развития, основанная на определённом способе производства;** она объединяет уровень развития производительных сил и соответствующие им производственные отношения."], ["p", "Выделяют пять типов общественно-экономических формаций:"], ["ol", 1, ["Первобытно-общинная.", "Рабовладельческая.", "Феодальная.", "Капиталистическая.", "Коммунистическая."]], ["p", "Сам Маркс в «Предисловии» к работе «К критике политической экономии» (1859) называет азиатский, античный, феодальный и современный буржуазный способы производства."], ["p", "Основой каждой формации является способ производства; производственные отношения образуют экономический базис, на котором формируется надстройка: политические, правовые, идеологические и другие отношения."], ["p", "Главной движущей силой исторического развития Маркс считал противоречия между производительными силами и производственными отношениями, а также классовую борьбу."], ["p", "Средством перехода от одной формации к другой Маркс считал социальную революцию."], ["p", "Цивилизационный подход."], ["p", "В отличие от формационного подхода, цивилизационный рассматривает развитие общества через особенности культуры, религии, традиций, ценностей и исторического опыта."], ["p", "Существует несколько вариантов этого подхода."], ["ul", ["Теория локальных цивилизаций. Человечество развивается не по единой линии, а через существование отдельных цивилизаций, каждая из которых имеет собственные особенности и закономерности развития. Представители: Н. Данилевский, О. Шпенглер, А. Тойнби.", "Теория единой мировой цивилизации. Предполагает, что человечество постепенно движется к формированию единой цивилизации на основе научно-технического прогресса, глобальных связей и распространения общих институтов."]], ["p", "Эволюционный подход."], ["p", "Рассматривает общественное развитие как постепенный переход от простых форм организации к более сложным."], ["p", "Одним из представителей был Герберт Спенсер. Он сравнивал общество с живым организмом и считал, что его развитие сопровождается усложнением структуры и разделением труда."], ["h", "3. Основные модели общественного развития"], ["p", "Помимо формационного и цивилизационного подходов, существуют конкретные модели, объясняющие направление исторических изменений."], ["p", "Линейная модель развития предполагает, что общество движется от простых форм к более сложным. Развитие понимается как последовательный процесс прогресса."], ["p", "Циклическая модель рассматривает историю как чередование подъёмов и спадов, возникновения, расцвета и упадка обществ и цивилизаций. Её представители — Освальд Шпенглер и Арнольд Тойнби."], ["p", "Модель модернизации объясняет переход традиционного общества к современному. Этот процесс связан с индустриализацией, урбанизацией, развитием образования, науки, технологий и новых политических институтов."], ["p", "Модель постиндустриального развития предполагает переход от промышленной экономики к экономике, основанной на информации, знаниях и услугах. Одним из её главных представителей является Дэниел Белл. Для Белла центральное значение в таком обществе имеют сфера услуг и теоретическое знание."], ["v", "Итог", "типология обществ позволяет классифицировать общественные системы, а модели развития объясняют, каким образом и под влиянием каких факторов происходят исторические изменения. Основные подходы — формационный, цивилизационный и эволюционный."]], "nb": 1}, {"n": 29, "q": "Социологическое понятие культуры. Виды и функции культуры.", "b": [["p", "**Культура — это совокупность материальных и духовных ценностей, норм, знаний, традиций, символов и способов деятельности, которые создаются людьми и передаются от поколения к поколению.**"], ["p", "В социологии культура рассматривается как важнейшая часть общественной жизни. Она определяет, как люди взаимодействуют друг с другом, какие нормы соблюдают, что считают правильным и значимым."], ["p", "Культура не является врождённой: человек усваивает её в процессе социализации, воспитания и общения с другими людьми."], ["h", "1. Структура культуры"], ["p", "В культуре выделяют несколько основных элементов."], ["p", "**Ценности — представления о том, что является важным и желательным для человека и общества.** Например, свобода, справедливость, семья, образование."], ["p", "**Социальные нормы — правила поведения, регулирующие отношения между людьми.** Они могут быть моральными, правовыми, религиозными и традиционными."], ["p", "**Язык и символы — средства передачи информации и культурного опыта.** Язык позволяет людям общаться, сохранять знания и передавать их следующим поколениям."], ["p", "**Обычаи и традиции — устойчивые образцы поведения, которые складываются исторически и передаются от поколения к поколению.**"], ["p", "**Знания и убеждения — представления людей об окружающем мире, обществе и человеке.**"], ["h", "2. Виды культуры"], ["p", "По способу существования выделяют:"], ["ul", ["**Материальную культуру — предметы и результаты материальной деятельности человека: здания, одежда, техника, инструменты, произведения архитектуры.**", "**Духовную культуру — идеи, знания, ценности, верования, произведения искусства, моральные нормы и научные достижения.**"]], ["p", "По характеру распространения и социальным группам выделяют:"], ["ul", ["**Народную культуру — создаётся народом и передаётся преимущественно через традиции.** К ней относятся сказки, песни, обряды, народные ремёсла.", "**Элитную культуру — создаётся профессиональными авторами и часто рассчитана на подготовленную аудиторию.** Например, сложные произведения классической музыки и литературы.", "**Массовую культуру — ориентирована на широкую аудиторию и распространяется с помощью средств массовой информации и цифровых платформ.** Например, популярная музыка, сериалы, развлекательные программы."]], ["p", "По отношению к господствующим культурным нормам выделяют:"], ["ul", ["**Доминирующая культура — культура, которая занимает ведущее положение в обществе и задаёт наиболее распространённые нормы и ценности.**", "**Субкультура — часть общей культуры, характерная для определённой социальной группы.** Она может иметь собственные нормы, стиль общения, символы и интересы. Например, молодёжные или профессиональные субкультуры.", "**Контркультура — разновидность культуры, представители которой не просто отличаются от господствующей культуры, а сознательно выступают против её основных ценностей и норм.**"]], ["h", "3. Функции культуры"], ["p", "Культура выполняет ряд важных функций, благодаря которым поддерживается существование общества."], ["ol", 1, ["Познавательная функция."]], ["p", "Культура сохраняет и передаёт знания об окружающем мире. Благодаря науке, образованию и традициям человек получает информацию о природе и обществе."], ["ol", 2, ["Информационная функция."]], ["p", "Обеспечивает передачу социального опыта от одного поколения к другому. Культура позволяет сохранять накопленные знания, обычаи и достижения человечества."], ["ol", 3, ["Коммуникативная функция."]], ["p", "Обеспечивает общение между людьми. Общий язык, символы и культурные нормы позволяют понимать друг друга и взаимодействовать."], ["ol", 4, ["Социализирующая функция."]], ["p", "Помогает человеку усвоить нормы, ценности и правила поведения, необходимые для жизни в обществе. Благодаря культуре человек становится частью определённой социальной общности."], ["ol", 5, ["Регулятивная функция."]], ["p", "Культура регулирует поведение людей через нормы, традиции, моральные правила и общественные ожидания."], ["ol", 6, ["Интегративная функция."]], ["p", "Объединяет людей на основе общих ценностей, традиций, языка и исторической памяти. Способствует формированию социальной солидарности."], ["ol", 7, ["Адаптивная функция."]], ["p", "Помогает человеку приспосабливаться к окружающей среде и изменяющимся условиям общественной жизни."], ["ol", 8, ["Ценностная функция."]], ["p", "Формирует представления о добре и зле, справедливости, красоте и других значимых явлениях. Помогает человеку ориентироваться в общественной жизни."], ["p", "В разных учебниках функции культуры могут классифицироваться немного по-разному, но перечисленные функции отражают основные направления её воздействия на общество."], ["v", "Итог", "культура является важнейшим механизмом существования общества. Она объединяет людей, регулирует их поведение, сохраняет социальный опыт и обеспечивает передачу ценностей и знаний между поколениями."]], "nb": 1}, {"n": 30, "q": "Роль социологии в современном обществе. Профессия – социолог. Социологическая культура. Кодекс этики социолога.", "b": [["h", "1. Роль социологии в современном обществе"], ["p", "Социология играет важную роль в современном обществе, поскольку позволяет изучать социальные процессы, выявлять общественные проблемы и объяснять поведение людей и социальных групп."], ["p", "Она помогает понять, как устроено общество, почему возникают социальные конфликты, как изменяются ценности и какие факторы влияют на поведение людей."], ["p", "Основные функции социологии:"], ["ol", 1, ["Познавательная функция."]], ["p", "Социология изучает общество, собирает и анализирует информацию о социальных процессах, выявляет закономерности общественного развития."], ["ol", 2, ["Практическая функция."]], ["p", "Результаты социологических исследований применяются для решения конкретных общественных проблем.
