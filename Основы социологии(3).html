подавателя):"], ["ul", ["**«К критике гегелевской философии права»** (1843) — критика гегелевского учения о государстве и праве.", "**«Нищета философии»** (1847) — критика экономических взглядов П.-Ж. Прудона.", "**«Манифест Коммунистической партии»** (1848, в соавторстве с Ф. Энгельсом) — классовая борьба и историческая роль пролетариата.", "**«Капитал. Критика политической экономии»** (том I — 1867) — исследование капиталистического производства, стоимости, капитала и эксплуатации.", "**«Критика Готской программы»** (1875) — две фазы коммунистического общества."]], ["p", "Также важны:"], ["ul", ["**«Экономическо-философские рукописи 1844 года»** — проблема отчуждения труда.", "**«Немецкая идеология»** (1845–1846, совместно с Энгельсом) — основы материалистического понимания истории.", "**«К критике политической экономии»** (1859) — в предисловии сформулирован тезис «общественное бытие определяет сознание»."]], ["p", "Второй и третий тома «Капитала» были опубликованы уже после смерти Маркса при подготовке Фридриха Энгельса."], ["h", "2. Три источника марксизма"], ["p", "В своём учении Маркс опирался на три наиболее влиятельные интеллектуальные традиции своего времени:"], ["ul", ["**немецкую философию** (Г. Гегель, Л. Фейербах);", "**французский социализм** (А. Сен-Симон, Ш. Фурье);", "**английскую политэкономию** (А. Смит, Д. Рикардо)."]], ["p", "**Марксизм — это система философских, экономических и социально-политических взглядов, разработанная К. Марксом и Ф. Энгельсом в XIX в., которая объясняет развитие общества через призму материального производства, законов капитализма и классовой борьбы, а также обосновывает неизбежность перехода к коммунизму.**"], ["h", "3. Материалистическое понимание истории (исторический материализм)"], ["p", "Основой существования и развития любого общества является **практическая деятельность людей в рамках определённых социальных структур**."], ["p", "**Экономические отношения** определяют все остальные сферы жизни общества. Ключевым для понимания общества является понятие **способа производства**."], ["p", "Маркс считал, что для понимания общественного устройства необходимо сначала выяснить, как люди производят необходимые для жизни материальные блага, кому принадлежат средства производства и какие отношения складываются между участниками производственного процесса."], ["p", "Иными словами, общество нельзя объяснить только политическими идеями, религией или взглядами отдельных людей. Необходимо учитывать экономические отношения и материальные условия существования."], ["h", "4. Понятие общества"], ["p", "**Общество у Маркса — это исторически конкретная система связей и отношений между людьми, которая:**"], ["ul", ["возникает и воспроизводится в процессе их совместной практической (прежде всего трудовой) деятельности;", "имеет в своей основе определённый способ производства и тип производственных отношений;", "представляет собой целостную «органическую систему», где экономический базис определяет политическую и идеологическую надстройку (экономический детерминизм)."]], ["p", "«Общество не состоит из индивидов, а выражает **сумму тех связей и отношений**, в которых эти индивиды находятся друг к другу»."], ["p", "«Общество — это **продукт взаимодействия людей**; при этом люди не свободны в выборе той или иной общественной формы»."], ["h", "5. Экономический детерминизм"], ["ul", ["Экономика определяет социальную структуру и другие процессы, а также основной вектор развития общества.", "Материальные (экономические) интересы движут людьми в их повседневной жизни."]], ["h", "6. Способ производства: производительные силы и производственные отношения"], ["p", "Центральное место в теории Маркса занимает понятие способа производства."], ["p", "**Способ производства — это единство производительных сил и производственных отношений, то есть того, с помощью чего и в каких общественных условиях производится материальное богатство.**"], ["p", "**Производительные силы — средства производства и рабочая сила (технологии и ресурсы).** Средства производства включают орудия труда и предметы труда."], ["p", "**Производственные отношения — социальные отношения, возникающие в процессе производства.** К ним относятся отношения в процессе производства, отношения обмена и распределения, отношения потребления. Например, отношения между собственниками предприятий и наёмными работниками."], ["p", "Маркс считал, что производительные силы и производственные отношения тесно связаны. По мере развития техники и производства прежние отношения собственности и организации труда могут становиться препятствием для дальнейшего развития. Это приводит к общественным противоречиям и изменениям."], ["h", "7. Базис и надстройка"], ["p", "Признание ведущей роли экономики привело к разделению общества на две большие и относительно самостоятельные системы — базис и надстройку."], ["p", "**Базис — это экономические отношения в обществе** (производственные отношения)."], ["p", "**Надстройка включает в себя политику, право и другие социальные институты, а также различные формы общественного сознания (религия, искусство, наука).**"], ["p", "**Экономический базис определяет надстройку** — неэкономические отношения и системы идей, представлений (формы сознания). Маркс рассматривает неэкономическую жизнь в классовом обществе как тесно связанную с системой производства: экономика является базой, на которой выстраивается культура."], ["p", "«Способ производства материальной жизни обусловливает социальный, политический и духовный процессы жизни вообще. **Не сознание людей определяет их бытие, а, наоборот, их общественное бытие определяет их сознание**» («К критике политической экономии»)."], ["p", "Например, в обществе с определённой системой собственности формируются соответствующие законы, политические институты и представления о справедливости."], ["p", "При этом важно понимать, что Маркс не сводил абсолютно все общественные явления к экономике в механическом смысле. Речь идёт о том, что экономические отношения оказывают фундаментальное влияние на устройство общества, но сами общественные процессы сложнее и включают взаимное воздействие различных сфер."], ["h", "8. Развитие общества. Общественно-экономические формации"], ["p", "Маркс рассматривал **развитие общества** как **прогрессивную смену одного способа производства другим** (и соответствующей общественно-экономической формации)."], ["p", "**Средством перехода** от одной общественно-экономической формации к другой выступает **социальная революция**."], ["p", "**Общественно-экономическая формация — это стадия общественного развития, основанная на определённом способе производства.** Это понятие объединяет уровень развития производительных сил (средств производства и рабочей силы) и соответствующие им производственные отношения, которые определяют социальную структуру общества."], ["p", "Типы общественно-экономических формаций:"], ["tbl", [["Тип формации", "Способ производства", "Тип собственности"], ["Первобытно-общинная", "Первобытно-общинный (примитивный коммунизм)", "Примитивная коллективная собственность"], ["Рабовладельческая", "Рабовладельческий", "Частная собственность, собственность на людей"], ["Феодальная", "Феодальный", "Частная собственность на землю, крепостное право"], ["Капиталистическая", "Капиталистический", "Частная собственность на предприятия и наёмный труд"], ["Коммунистическая", "Коммунистический", "Развитая коллективная собственность"]]], ["p", "В «Предисловии» к работе «К критике политической экономии» (1859) Маркс пишет: «В общих чертах, **азиатский, античный, феодальный и современный, буржуазный, способы производства** можно обозначить как прогрессивные эпохи экономической общественной формации»."], ["p", "Переход от одной формации к другой связан с развитием производительных сил и противоречиями между ними и существующими производственными отношениями."], ["h", "9. Класс и классовая борьба"], ["p", "Все люди в обществе разделены на социальные **классы в зависимости от их отношения к средствам производства**."], ["p", "**Класс — это большая группа людей, положение которой в обществе определяется отношением к средствам производства.**"], ["p", "Близкую развёрнутую формулировку позднее дал В. И. Ленин («Великий почин», 1919): классы различаются по месту в системе общественного производства, по отношению к средствам производства, по роли в общественной организации труда и по способам получения и размерам доли общественного богатства."], ["p", "Классы различаются по своим экономическим интересам, что **приводит к классовой борьбе**. Существует фундаментальный антагонизм между классами (эксплуататорами и эксплуатируемыми)."], ["p", "В капиталистическом обществе Маркс выделял два основных противостоящих класса:"], ["ul", ["**Буржуазия — владельцы средств производства, то есть предприятий, фабрик, оборудования и капитала.**", "**Пролетариат — наёмные работники, которые не владеют основными средствами производства и вынуждены продавать свою рабочую силу.**"]], ["p", "Интересы этих классов противоречат друг другу. Владельцы стремятся получать прибыль, а работники заинтересованы в достойной оплате и условиях труда."], ["p", "«**История всех существовавших обществ была историей борьбы классов**» («Манифест Коммунистической партии»)."], ["h", "10. Классовое сознание"], ["p", "Для того чтобы начать бороться с капитализмом, пролетариат должен осознать свои истинные интересы, отказавшись от ложных идей, навязанных ему идеологией."], ["p", "Этот процесс Маркс назвал превращением из **«класса в себе»** в **«класс для себя»**. На место идеологии приходит **классовое сознание пролетариата**."], ["p", "Ключевую роль в этом процессе играет политическая партия."], ["h", "11. Теория конфликта"], ["ul", ["Маркс доказывал **неизбежность конфликта в жизни общества**: столкновение интересов — естественное состояние любого классового общества.", "Выделил **источник противостояния**: непримиримое противоречие между угнетающими (собственники) и угнетёнными (наёмные рабочие) классами.", "Обосновал **прогрессивную роль конфликта**: классовая борьба является главным двигателем истории и приводит к смене социальных систем.", "Сформулировал **конечную цель развития общества**: разрешение глобального конфликта через революционный переход к бесклассовому (коммунистическому) обществу."]], ["h", "12. Прибавочная стоимость и эксплуатация"], ["p", "Для объяснения капиталистической экономики Маркс разработал понятие прибавочной стоимости."], ["p", "**Прибавочная стоимость — стоимость, создаваемая работником сверх стоимости его рабочей силы и присваиваемая владельцем средств производства.**"], ["p", "Работник получает заработную плату, однако в процессе труда создаёт стоимость, превышающую эту сумму. Разница между созданной стоимостью и стоимостью рабочей силы образует прибавочную стоимость, которая становится источником прибыли капиталиста."], ["p", "С этим связано понятие эксплуатации — присвоения собственником средств производства результатов неоплаченного труда работников."], ["p", "Маркс рассматривал эксплуатацию не просто как личную несправедливость отдельного предпринимателя, а как особенность самой системы капиталистических производственных отношений."], ["h", "13. Теория отчуждения"], ["p", "**Отчуждение по Марксу — это процесс и результат потери контроля работника над процессом и продуктом своего труда и, как следствие, потеря трудом творческих аспектов.** Понятие разработано в ранних работах («Экономическо-философские рукописи 1844 года»)."], ["p", "Формы отчуждения при капитализме:"], ["ul", ["**От продукта труда:** рабочий производит блага, которые ему не принадлежат и для него недоступны.", "**От процесса труда:** работа превращается в принудительную, монотонную рутину ради выживания.", "**От своей человеческой сущности:** труд перестаёт быть творчеством и превращается лишь в биологическое средство существования.", "**От других людей:** разрушаются социальные связи, а отношения между людьми подменяются рыночным обменом (вещами)."]], ["p", "Капитализм превращает личность в **«придаток машины»** и товар на рынке труда."], ["h", "14. Вклад К. Маркса в социологию"], ["ul", ["Предложил **материалистическое понимание истории**, доказав, что экономический базис общества определяет его политическую и культурную надстройку.", "Разработал **теорию общественно-экономических формаций**, объясняющую эволюцию человечества через смену способов производства.", "Разработал **теорию социальных классов**, выделив в качестве главного критерия отношение к средствам производства.", "Предложил **концепцию классовой борьбы** как главного источника исторического развития и социальных изменений.", "Разработал **основы социологии конфликта**, доказав неизбежность столкновения интересов различных социальных групп.", "Предложил **концепцию отчуждения** человека труда, описав дегуманизацию личности в условиях капиталистического производства."]], ["p", "Его идеи стали основой марксистской социологии и оказали влияние на развитие конфликтной теории, критической социологии и исследований социальной стратификации."], ["v", "Главное для запоминания", "Маркс объяснял развитие общества через материальное производство и экономические отношения (экономический детерминизм). Основные понятия по конспекту: экономический детерминизм, общественно-экономическая формация, базис, надстройка, класс, отчуждение. Также важны: способ производства, производительные силы и производственные отношения, социальная революция, классовая борьба и классовое сознание, прибавочная стоимость. Три источника марксизма — немецкая философия, французский социализм, английская политэкономия."]], "nb": 1}, {"n": 11, "q": "Формальная социология: Ф. Тённис, Г. Зиммель.", "b": [["h", "1. Понятие формальной социологии"], ["p", "**Формальная социология — направление социологической мысли, которое сосредоточено на изучении устойчивых форм социальных отношений и взаимодействий между людьми.**"], ["p", "Её представители стремились выяснить, каким образом люди объединяются в группы, вступают в отношения, сотрудничают, конкурируют, конфликтуют и подчиняются друг другу."], ["p", "Главная особенность этого направления заключается в разделении формы и содержания социальных отношений."], ["p", "**Содержание — это конкретные интересы, цели, потребности и мотивы людей.**"], ["p", "**Форма — способ организации их взаимодействия.**"], ["p", "Например, два человека могут объединиться ради заработка, политической деятельности или общего увлечения. Цели будут различаться, но форма взаимодействия может быть одинаковой — сотрудничество."], ["p", "С формальной социологией связаны прежде всего Фердинанд Тённис и Георг Зиммель."], ["h", "2. Фердинанд Тённис: биография и основные работы"], ["p", "Фердинанд Тённис (1855–1936) — немецкий социолог, один из представителей классической немецкой социологии. Изучал общественные связи, отношения между людьми и изменения социальной организации в процессе модернизации."], ["p", "Тённис родился 26 июля 1855 года в Германии. Получил образование в нескольких немецких университетах, изучал философию и историю. Большое влияние на его взгляды оказало знакомство с философией Томаса Гоббса."], ["p", "В 1887 году он опубликовал свою наиболее известную работу — «Община и общество», в которой представил теорию двух типов социальных отношений."], ["p", "Впоследствии Тённис участвовал в создании Немецкого социологического общества в 1909 году и стал его первым председателем."], ["h", "3. Теория общины и общества"], ["p", "Главная идея Тённиса — различение двух типов социальных связей: общины (Gemeinschaft) и общества (Gesellschaft)."], ["p", "Община (Gemeinschaft) — форма объединения людей, основанная на близких, естественных и эмоциональных отношениях."], ["p", "Для общины характерны:"], ["ul", ["личные и тесные отношения;", "чувство принадлежности к группе;", "общие традиции и ценности;", "взаимная поддержка;", "устойчивые связи между людьми."]], ["p", "Примером могут служить семья, небольшое традиционное поселение или тесное сообщество."], ["p", "Общество (Gesellschaft) — форма социальных отношений, основанная преимущественно на рациональном расчёте, личных интересах и формальных правилах."], ["p", "Для общества характерны:"], ["ul", ["более безличные отношения;", "ориентация на личную выгоду;", "договорные связи;", "разделение труда;", "формальные нормы взаимодействия."]], ["p", "Примером может служить крупная городская организация, коммерческое предприятие или деловое объединение."], ["h", "4. Два типа воли: сущностная и избирательная"], ["p", "Для объяснения различий между общиной и обществом Тённис использовал понятие воли."], ["p", "**Сущностная воля — естественная воля человека, связанная с чувствами, привычками, традициями и внутренней привязанностью к другим людям.** Она лежит в основе общинных отношений."], ["p", "**Избирательная воля — рациональная воля, основанная на расчёте, выборе средств и оценке личной выгоды.** Она характерна для отношений в обществе."], ["p", "Например, человек может поддерживать родственника из чувства привязанности и ответственности. Это проявление сущностной воли. А деловое сотрудничество, основанное на договоре и взаимной выгоде, скорее связано с избирательной волей."], ["h", "5. Соотношение общины и общества"], ["p", "Тённис рассматривал общину и общество как два идеальных типа социальных отношений."], ["p", "Это означает, что они не обязательно существуют отдельно друг от друга. В реальной жизни оба типа могут сочетаться."], ["p", "Например, современный город в целом организован преимущественно на основе формальных и рациональных отношений, но внутри него существуют семьи, дружеские компании и другие общинные объединения."], ["p", "Тённис использовал это различие для анализа перехода от традиционного общества к современному индустриальному обществу."], ["p", "Его теория позволила показать, что модернизация меняет не только экономику и политическое устройство, но и характер отношений между людьми."], ["h", "6. Георг Зиммель: биография и основные работы"], ["p", "Георг Зиммель (1858–1918) — немецкий философ и социолог, один из главных представителей формальной социологии. Он изучал повседневные взаимодействия, социальные группы, конфликты, городскую жизнь и влияние денег на общественные отношения."], ["p", "Зиммель родился 1 марта 1858 года в Берлине. Получил образование в Берлинском университете, где изучал философию и историю. Впоследствии преподавал в Берлине и Страсбурге."], ["p", "В отличие от многих классических социологов, Зиммель уделял особое внимание небольшим социальным группам и повседневному взаимодействию людей."], ["p", "Основные работы:"], ["ul", ["«О социальной дифференциации» (1890).", "«Философия денег» (1900).", "«Большие города и духовная жизнь» (1903).", "«Философия моды» (1905).", "«Социология. Исследования форм обобществления» (1908)."]], ["h", "7. Формальная социология Зиммеля"], ["p", "Зиммель считал, что общество не является чем-то существующим отдельно от людей. Оно постоянно создаётся и воспроизводится через их взаимодействия."], ["p", "Он использовал понятие обобществления (Vergesellschaftung) — процесса образования социальных связей и объединений людей в результате взаимодействия."], ["p", "В центре его теории находилось различие между формой и содержанием взаимодействия."], ["p", "**Содержание — интересы, потребности, мотивы и цели людей.**"], ["p", "**Форма — устойчивый способ взаимодействия, который может повторяться в разных сферах общественной жизни.**"], ["p", "Зиммель выделял множество социальных форм:"], ["ul", ["подчинение и господство;", "конкуренция;", "конфликт;", "обмен;", "разделение труда;", "образование партий;", "представительство."]], ["p", "Например, конкуренция может существовать в экономике, политике, образовании и спорте. Содержание деятельности различается, но сама форма отношений — соперничество — остаётся сходной."], ["h", "8. Диада и триада"], ["p", "Одним из важных направлений исследований Зиммеля было изучение влияния численности группы на характер отношений между её участниками."], ["p", "**Диада — социальная группа, состоящая из двух человек.**"], ["p", "В диаде отношения непосредственно зависят от обоих участников. Если один человек прекращает взаимодействие, группа распадается. Поэтому диада отличается особой непосредственностью и теснотой связей."], ["p", "**Триада — группа из трёх человек.**"], ["p", "Появление третьего участника меняет структуру отношений. Теперь возможны новые формы взаимодействия:"], ["ul", ["**посредник / третейский судья — непартийный третий, который помогает двум другим договориться;**", "**tertius gaudens («третий радующийся») — третий, извлекающий выгоду из спора двух других;**", "**divide et impera («разделяй и властвуй») — третий намеренно разъединяет двух других;**", "**коалиция — двое объединяются против третьего.**"]], ["p", "Таким образом, увеличение группы даже на одного человека может существенно изменить характер социальных отношений."], ["h", "9. Конфликт как форма социального взаимодействия"], ["p", "Зиммель рассматривал конфликт не только как разрушительное явление, но и как одну из форм социального взаимодействия."], ["p", "Он считал, что конфликт может способствовать изменению отношений между людьми, выявлению противоречий и формированию новых правил взаимодействия."], ["p", "Например, разногласия внутри организации могут привести к пересмотру обязанностей и улучшению системы управления."], ["p", "При этом конфликт может как укреплять внутреннее единство группы, так и разрушать её — результат зависит от обстоятельств и характера противоречий."], ["h", "10. Другие идеи Зиммеля"], ["p", "Зиммель исследовал не только формы взаимодействия, но и конкретные явления современной общественной жизни."], ["p", "**Социальный тип чужака — человек, который одновременно находится внутри определённой группы и сохраняет некоторую дистанцию по отношению к ней.** Например, приезжий торговец может участвовать в жизни местного сообщества, но при этом оставаться относительно независимым от его традиций."], ["p", "Философия денег. В работе «Философия денег» Зиммель показал, что развитие денежной экономики меняет социальные отношения. Деньги позволяют людям взаимодействовать без тесных личных связей, но одновременно делают отношения более безличными и формальными."], ["p", "Большой город. В работе «Большие города и духовная жизнь» он исследовал влияние городской среды на человека. Большое количество контактов, быстрый ритм жизни и постоянный поток впечатлений могут приводить к эмоциональной сдержанности и стремлению сохранять личную дистанцию."], ["p", "Мода. Зиммель рассматривал моду как сочетание двух стремлений: быть похожим на других и одновременно выделяться среди них. Через моду люди выражают принадлежность к определённой группе и собственную индивидуальность."], ["h", "11. Значение формальной социологии"], ["p", "Тённис и Зиммель внесли значительный вклад в изучение социальных отношений."], ["p", "Тённис показал различия между традиционными общинными связями и рациональными отношениями современного общества."], ["p", "Зиммель разработал подход, позволяющий изучать устойчивые формы взаимодействия независимо от конкретных целей людей. Он также обратил внимание на повседневные отношения, малые группы и влияние городской среды."], ["v", "Главное для запоминания", "Тённис — община и общество, сущностная и избирательная воля. Зиммель — форма и содержание взаимодействия, обобществление, диада и триада, конфликт, чужак, деньги и мода."]], "nb": 1}, {"n": 12, "q": "Социологические взгляды В. Парето, Г. Моска, Р. Михельса.", "b": [["h", "1. Общая характеристика теории элит"], ["p", "**Теория элит — направление социальной и политической мысли, согласно которому в любом обществе существует сравнительно небольшая группа людей, обладающая значительной властью и влиянием.**"], ["p", "Представители этого направления считали, что общество не может быть полностью однородным с точки зрения распределения власти. Даже если официально провозглашается равенство граждан, реальные возможности влиять на принятие решений распределены неравномерно."], ["p", "Основными представителями классической теории элит стали итальянские учёные Вильфредо Парето и Гаэтано Моска, а также немецкий социолог Роберт Михельс."], ["h", "2. Вильфредо Парето"], ["p", "Вильфредо Парето (1848–1923) — итальянский экономист и социолог, один из основоположников теории элит. Он изучал распределение власти в обществе и механизмы смены господствующих групп."], ["p", "Парето родился 15 июля 1848 года в Париже в семье итальянского эмигранта и француженки. Получил инженерное образование, занимался экономикой, а позднее сосредоточился на исследовании общественных процессов."], ["p", "Основные работы:"], ["ul", ["«Курс политической экономии» (1896–1897).", "«Трактат по общей социологии» (1916)."]], ["h", "3. Теория элит Парето"], ["p", "Парето считал, что общество делится на две большие группы:"], ["ul", ["**Элита — люди, обладающие наиболее высокими показателями в определённой сфере деятельности и занимающие влиятельные позиции.**", "Неэлита — остальная часть населения."]], ["p", "При этом Парето выделял правящую и неправящую элиту."], ["p", "Правящая элита непосредственно участвует в управлении обществом и принятии политических решений."], ["p", "Неправящая элита состоит из людей, обладающих высоким положением и влиянием в различных сферах, но не участвующих непосредственно в политическом управлении."], ["p", "Одной из важнейших идей Парето является циркуляция элит."], ["p", "**Циркуляция элит — процесс постоянного обновления господствующих групп, при котором одни представители элиты постепенно уступают место другим.**"], ["p", "Парето считал, что ни одна элита не может сохранять власть бесконечно. Со временем она может терять способность эффективно управлять, становиться замкнутой и отрываться от общества. В результате её место занимают новые группы."], ["p", "Таким образом, общественные изменения во многом связаны не только с борьбой классов, но и со сменой одних элит другими."], ["h", "4. Остатки и деривации"], ["p", "Парето также пытался объяснить, почему люди часто руководствуются не только разумом, но и чувствами, привычками и неосознаваемыми мотивами."], ["p", "Он выделял два понятия:"], ["p", "**Остатки — относительно устойчивые психологические склонности и чувства, которые влияют на человеческое поведение.**"], ["p", "**Деривации — объяснения и рассуждения, с помощью которых люди обосновывают свои действия и убеждения.**"], ["p", "По мнению Парето, люди нередко сначала действуют под влиянием чувств и привычек, а затем находят рациональные объяснения своим поступкам."], ["h", "5. Гаэтано Моска"], ["p", "Гаэтано Моска (1858–1941) — итальянский политический мыслитель и социолог, один из основателей теории элит. Исследовал устройство политической власти и отношения между управляющим меньшинством и большинством населения."], ["p", "Моска родился 1 апреля 1858 года в Палермо, Италия. Получил юридическое образование, преподавал и занимался политической наукой."], ["p", "Его основные работы:"], ["ul", ["«Теория правления и парламентское правление» (1884).", "«Элементы политической науки» (1896)."]], ["h", "6. Теория правящего класса Моски"], ["p", "Моска считал, что во всех обществах существует разделение на два основных слоя:"], ["ul", ["**Правящий класс — организованное меньшинство, которое управляет обществом и принимает важнейшие решения.**", "**Управляемый класс — многочисленное большинство, которое подчиняется решениям правящего меньшинства.**"]], ["p", "Главная мысль Моски заключается в том, что организованное меньшинство обычно способно управлять неорганизованным большинством."], ["p", "Причина заключается в том, что представители правящего класса имеют общие интересы, обладают ресурсами и могут координировать свои действия. Большинство же населения часто разрозненно и не имеет единого механизма управления."], ["h", "7. Политическая формула"], ["p", "Моска разработал понятие политической формулы."], ["p", "**Политическая формула — система идей, убеждений и принципов, с помощью которых правящий класс обосновывает законность своей власти.**"], ["p", "Она помогает объяснить населению, почему существующий порядок считается правильным и почему власть определённой группы должна признаваться."], ["p", "Например, власть может обосновываться традицией, религией, национальными интересами, законом или идеей народного суверенитета."], ["p", "Моска считал, что правящий класс не может опираться только на принуждение. Для устойчивости власти ему необходимо определённое общественное признание."], ["h", "8. Роберт Михельс"], ["p", "Роберт Михельс (1876–1936) — немецкий социолог, изучавший политические организации, партии и механизмы концентрации власти внутри них."], ["p", "Михельс родился 9 января 1876 года в Кёльне. Он интересовался политическими движениями и деятельностью массовых организаций."], ["p", "Главной его работой стала книга «Социология политических партий в условиях современной демократии» (1911)."], ["h", "9. Железный закон олигархии"], ["p", "Главная идея Михельса получила название «железный закон олигархии»."], ["p", "**Олигархия — форма организации власти, при которой управление сосредоточено в руках небольшой группы людей.**"], ["p", "Михельс считал, что даже организации, созданные на основе демократических принципов, со временем могут становиться олигархическими."], ["p", "Причины этого процесса:"], ["ul", ["увеличение численности организации;", "необходимость постоянного управления;", "усложнение организационной структуры;", "появление профессиональных руководителей;", "сосредоточение информации и ресурсов у руководства."]], ["p", "В крупных организациях большинство участников не может постоянно заниматься управлением. Поэтому появляются руководители, которые получают больше возможностей влиять на принятие решений."], ["p", "Со временем руководство может начать защищать собственные интересы и стремиться сохранить занимаемое положение."], ["p", "Таким образом, даже демократические организации могут постепенно превращаться в системы, где власть сосредоточена у небольшого числа лидеров."], ["p", "Например, политическая партия может изначально строиться на принципах равного участия членов, но со временем основные решения начинают принимать её руководители."], ["h", "10. Сравнение взглядов Парето, Моски и Михельса"], ["p", "Все три учёных исследовали распределение власти и роль небольших влиятельных групп в обществе. Однако каждый из них обращал внимание на разные стороны этой проблемы."], ["tbl", [["Учёный", "Основная идея", "Ключевое понятие"], ["Вильфредо Парето", "Элиты постоянно сменяют друг друга", "Циркуляция элит"], ["Гаэтано Моска", "Общество делится на организованное правящее меньшинство и управляемое большинство", "Правящий класс, политическая формула"], ["Роберт Михельс", "Даже демократические организации склонны к концентрации власти", "Железный закон олигархии"]]], ["h", "11. Значение теории элит"], ["p", "Теория элит внесла значительный вклад в изучение политической власти, управления и социального неравенства."], ["p", "Парето показал, что господствующие группы не являются неизменными и постоянно обновляются."], ["p", "Моска объяснил, почему организованное меньшинство получает возможность управлять большинством и каким образом власть обосновывает своё существование."], ["p", "Михельс обратил внимание на то, что концентрация власти может происходить даже внутри организаций, созданных на демократических принципах."], ["v", "Главное для запоминания", "Парето — циркуляция элит; Моска — правящий класс и политическая формула; Михельс — железный закон олигархии. Все трое считали, что власть в обществе обычно распределена неравномерно и сосредоточивается у сравнительно небольших групп."]], "nb": 1}, {"n": 13, "q": "Психологическое и социально-психологическое направление в социологии", "b": [["p", "Психологическое направление возникло в конце XIX — начале XX века. Его представители стремились объяснить общественную жизнь через особенности человеческой психики: чувства, желания, инстинкты, подражание и поведение людей в группах."], ["p", "Главная идея направления заключалась в том, что общество состоит из людей, а значит, для понимания социальных процессов необходимо изучать психологические механизмы, которые влияют на их поведение."], ["h", "Основные представители психологического направления"], ["p", "Габриэль Тард (1843–1904) — французский социолог, автор теории подражания. Он считал, что многие социальные процессы возникают благодаря тому, что люди копируют поведение друг друга. Например, человек может перенимать у окружающих манеру одеваться, привычки, взгляды и способы общения."], ["p", "Тард выделял три основных социальных процесса: подражание (повторение), противопоставление и приспособление. Подражание способствует распространению новых идей и образцов поведения, противопоставление выражается в столкновении различных привычек и взглядов, а приспособление помогает им сосуществовать."], ["p", "Главный труд — «Законы подражания» (1890)."], ["p", "Гюстав Лебон (1841–1931) — французский психолог и социолог, изучавший поведение толпы. Он полагал, что в толпе поведение человека может существенно меняться: люди становятся более восприимчивыми к эмоциональному воздействию, внушению и общему настроению группы."], ["p", "Лебон обращал внимание на то, что толпа часто действует под влиянием сильных эмоций, а не спокойного рационального рассуждения. Его идеи использовались для изучения массового поведения и общественных движений."], ["p", "Главная работа — «Психология народов и масс» (1895), известная также как «Психология толп»."], ["p", "Уильям Макдугалл (1871–1938) — британский психолог, представитель инстинктивистского подхода. Он объяснял поведение человека и социальные отношения влиянием врождённых инстинктов. По его мнению, такие особенности человеческой природы, как стремление к самосохранению, страх, любопытство и стремление к общению, влияют на поступки людей и формирование групп."], ["p", "Главный труд — «Введение в социальную психологию» (1908)."], ["p", "Лестер Уорд (1841–1913) — американский социолог, который связывал развитие общества с психологическими силами и сознательной деятельностью людей. Он считал, что общество может не только развиваться стихийно, но и целенаправленно совершенствоваться благодаря образованию, науке и разумной социальной политике."], ["h", "Социально-психологическое направление"], ["p", "Постепенно внимание исследователей сместилось от объяснения общества через общие психологические механизмы к изучению того, как именно личность формируется в процессе взаимодействия с другими людьми."], ["p", "Социальная психология изучает влияние общества и групп на поведение, мышление и личность человека. В социологии особенно важными стали исследования социального взаимодействия, социализации, общественного мнения и межличностных отношений."], ["p", "Чарльз Кули (1864–1929) — американский социолог, автор концепции «зеркального Я». Согласно этой концепции, человек формирует представление о себе через взаимодействие с окружающими. Он представляет, как его воспринимают другие люди, предполагает, как они оценивают его, и на основе этого формирует отношение к самому себе."], ["p", "Например, если школьник считает, что одноклассники воспринимают его как способного и ответственного человека, это может укреплять его уверенность в себе. При этом важно, что значение имеет не реальная оценка окружающих, а то, как сам человек её представляет."], ["p", "Кули также выделял первичные группы — небольшие группы, в которых отношения между людьми носят непосредственный и эмоционально близкий характер. К ним относятся семья, друзья и близкий круг общения. Именно в таких группах человек получает первый опыт общения и усваивает основные нормы поведения."], ["p", "Главные труды — «Человеческая природа и социальный порядок» (1902), «Социальная организация» (1909)."], ["p", "Джордж Герберт Мид (1863–1931) — американский философ и социальный психолог, один из основателей символического интеракционизма. Он считал, что личность не формируется изолированно: человек становится социальным существом через общение и взаимодействие с другими людьми."], ["p", "Мид выделял несколько важных понятий:"], ["ul", ["«Я» (Self) — представление человека о самом себе, которое формируется в процессе социального взаимодействия. Мид выделял в нём две стороны: «I» (спонтанное, активное «Я») и «Me» (усвоенные установки других).", "«Значимые другие» — конкретные люди, чьё мнение особенно важно для человека, например родители, друзья или учителя.", "«Обобщённый другой» — усвоенные человеком ожидания, правила и нормы общества или группы в целом."]], ["p", "По Миду, человек учится смотреть на себя со стороны, учитывать ожидания окружающих и регулировать своё поведение в соответствии с социальными нормами."], ["p", "Главный труд — «Разум, Я и общество» (1934), опубликованный после его смерти."], ["p", "Важное различие: психологическое направление стремилось объяснить общественные процессы через особенности человеческой психики, а социально-психологическое — через взаимное влияние личности, социальных групп и общества."], ["p", "Главное для запоминания:"], ["ul", ["Тард — подражание как механизм распространения социальных явлений.", "Лебон — психология толпы и массовое поведение.", "Макдугалл — влияние врождённых инстинктов.", "Уорд — роль сознательной деятельности и образования в развитии общества.", "Кули — «зеркальное Я» и первичные группы.", "Мид — формирование личности через взаимодействие, «значимые другие» и «обобщённый другой»."]]], "nb": 1}, {"n": 14, "q": "Основные этапы и особенности развития американской социологии", "b": [["p", "Американская социология начала активно развиваться во второй половине XIX века. Если европейская социология во многом была сосредоточена на общих теориях развития общества, то американские исследователи довольно рано стали уделять большое внимание практическим проблемам: бедности, преступности, миграции, расовым отношениям, городскому развитию и условиям труда."], ["h", "1. Возникновение и институционализация (конец XIX — начало XX века)"], ["p", "В этот период социология постепенно превращалась в самостоятельную университетскую дисциплину."], ["p", "Важным событием стало создание в 1892 году кафедры социологии в Чикагском университете. Это был один из первых крупных университетских центров социологии в США."], ["p", "В 1895 году начал выходить журнал American Journal of Sociology, а в 1905 году было создано Американское социологическое общество — современная Американская социологическая ассоциация."], ["p", "Среди ранних американских социологов можно выделить:"], ["ul", ["Лестера Уорда — изучал общественное развитие и роль сознательной деятельности человека.", "Уильяма Грэма Самнера — развивал эволюционистские идеи, исследовал обычаи и социальные нормы.", "Франклина Гиддингса — изучал социальные группы, общественное сознание и процессы объединения людей."]], ["h", "2. Расцвет эмпирических исследований (1910–1930-е годы)"], ["p", "В этот период американская социология стала активно изучать реальные социальные процессы. Исследователи проводили наблюдения, опросы, интервью, изучали статистику и конкретные сообщества."], ["p", "Особенно важную роль сыграла Чикагская школа. Её представители исследовали городскую жизнь, миграцию, преступность, бедность, социальные конфликты и отношения между различными группами населения."], ["p", "Одним из наиболее известных представителей был Роберт Парк (1864–1944). Он изучал город как особую социальную среду, в которой разные группы взаимодействуют, конкурируют и приспосабливаются друг к другу."], ["p", "Эрнест Бёрджесс (1886–1966) исследовал городское развитие. Вместе с Парком он развивал представление о городе как о пространстве, состоящем из различных зон, которые отличаются социальным составом и образом жизни населения."], ["p", "Уильям Томас (1863–1947) изучал положение иммигрантов и особенности их приспособления к американскому обществу. Вместе с Флорианом Знанецким он написал исследование «Польский крестьянин в Европе и Америке» (1918–1920), основанное, в частности, на личных письмах и биографических материалах."], ["p", "Чикагская школа внесла большой вклад в развитие полевых исследований и наблюдения за реальной жизнью социальных групп."], ["h", "3. Развитие теоретической и количественной социологии (1930–1950-е годы)"], ["p", "Постепенно американская социология стала развиваться сразу в нескольких направлениях. Одни учёные создавали общие теории общества, другие совершенствовали методы сбора и обработки информации."], ["p", "Важными центрами стали Гарвардский и Колумбийский университеты."], ["p", "Гарвардская школа связана прежде всего с развитием общей социологической теории. Одним из её наиболее известных представителей стал Питирим Сорокин (1889–1968) — российско-американский социолог, который с 1930 года работал в Гарвардском университете. Он изучал социальную мобильность, стратификацию и культурные изменения. Позднее важную роль в Гарварде сыграл Толкотт Парсонс (1902–1979), развивавший структурный функционализм."], ["p", "Колумбийская школа внесла большой вклад в развитие эмпирической и количественной социологии. Одним из её главных представителей был Пол Лазарсфельд (1901–1976). Он занимался изучением общественного мнения, массовых коммуникаций, политического поведения и методов социологического опроса. Также с Колумбийским университетом связан Роберт Мертон (1910–2003), развивавший теории среднего уровня и исследовавший социальные функции и дисфункции."], ["h", "4. Развитие социологии во второй половине XX века"], ["p", "После Второй мировой войны американская социология продолжила активно развиваться. Усилилось значение массовых опросов, статистических методов, исследований общественного мнения и социальных организаций."], ["p", "Одновременно развивались новые теоретические направления: структурный функционализм, теория конфликта, символический интеракционизм и другие подходы."], ["p", "Исследователи всё чаще обращались к проблемам неравенства, расовых отношений, образования, семьи, массовой культуры, политического поведения и социальных движений."], ["h", "Основные особенности американской социологии"], ["p", "Во-первых, практическая направленность. Американские социологи стремились не только объяснять общество, но и изучать конкретные социальные проблемы, результаты исследований могли использоваться для разработки социальной политики."], ["p", "Во-вторых, развитие эмпирических методов. Большое значение получили наблюдение, интервью, анкетирование, анализ документов и статистики."], ["p", "В-третьих, тесная связь с университетами. Социология развивалась в университетских центрах, где создавались кафедры, научные журналы и исследовательские коллективы."], ["p", "В-четвёртых, разнообразие теоретических подходов. В американской социологии одновременно развивались как общие теории общества, так и исследования отдельных социальных групп и процессов."], ["p", "Главное для запоминания:"], ["tbl", [["Школа", "Основные представители", "Основной вклад"], ["Чикагская", "Р. Парк, Э. Бёрджесс, У. Томас", "Город, миграция, преступность, полевые исследования"], ["Гарвардская", "П. Сорокин, Т. Парсонс", "Общая социологическая теория, социальная мобильность, функционализм"], ["Колумбийская", "П. Лазарсфельд, Р. Мертон", "Опросы, статистика, общественное мнение, теории среднего уровня"]]], ["p", "Важно понимать, что названия школ обозначают научные центры и связанные с ними традиции, а не полностью единые группы учёных с одинаковыми взглядами."]], "nb": 1}, {"n": 15, "q": "Индустриальная социология и теория человеческих отношений (Э. Мейо, Дж. Морено)", "b": [["p", "**Индустриальная социология — направление социологии, изучающее труд, производство, отношения между работниками и руководством, организацию труда и поведение людей на предприятиях.**"], ["p", "Она активно развивалась в XX веке, когда промышленность стала играть всё более значительную роль в жизни общества. Возникла необходимость понять, почему одни предприятия работают эффективнее других, как условия труда влияют на работников и какую роль в производстве играют отношения внутри коллектива."], ["h", "От научной организации труда к теории человеческих отношений"], ["p", "В начале XX века большое влияние получила система научной организации труда Фредерика Тейлора (1856–1915)."], ["p", "Тейлор стремился повысить производительность за счёт рациональной организации труда. Он предлагал изучать рабочие операции, устанавливать наиболее эффективные способы выполнения заданий, распределять обязанности и контролировать рабочий процесс."], ["p", "Однако такой подход уделял основное внимание технической и организационной стороне производства. Постепенно исследователи стали обращать внимание на то, что производительность зависит не только от оборудования, заработной платы и продолжительности рабочего дня, но и от отношений между людьми."], ["p", "Так возникла теория человеческих отношений."], ["h", "Элтон Мейо и Хоторнские эксперименты"], ["p", "Элтон Мейо (1880–1949) — австралийский и американский социолог и психолог, один из наиболее известных представителей теории человеческих отношений."], ["p", "Наиболее известен благодаря исследованиям, проводившимся на заводе Western Electric в Хоторне (недалеко от Чикаго) в 1920–1930-е годы. В исследованиях участвовали также Фриц Рётлисбергер и другие учёные."], ["p", "Изначально исследователи хотели выяснить, как физические условия труда влияют на производительность. Они изучали освещение, перерывы на отдых, продолжительность рабочего дня и другие условия."], ["p", "Однако постепенно стало понятно, что на работу людей влияют не только физические условия, но и социальная среда: отношения с коллегами, внимание руководства, атмосфера в коллективе и чувство принадлежности к группе."], ["p", "Исследования показали важность неформальных групп — коллективов, которые возникают естественным образом на основе личных отношений работников, а не только официального распределения должностей."], ["p", "Внутри таких групп формируются собственные правила и нормы поведения. Например, работники могут негласно договариваться о том, какой темп работы считается приемлемым. Эти нормы способны влиять на производительность даже тогда, когда официальные требования руководства отличаются."], ["p", "На основе подобных исследований развивалась теория человеческих отношений."], ["h", "Основные положения теории человеческих отношений"], ["ol", 1, ["Человек — не только экономический работник. На его поведение влияют не только заработная плата и материальные условия, но и потребность в общении, признании и уважении.", "Большое значение имеют неформальные группы. Работник является частью коллектива, поэтому отношения с коллегами могут влиять на его отношение к труду и производительность.", "Важна психологическая атмосфера. Дружелюбные отношения, взаимопомощь и поддержка могут положительно влиять на рабочий процесс.", "Руководство должно учитывать человеческий фактор. Эффективная организация труда предполагает внимание к потребностям работников, коммуникации и участию сотрудников в решении рабочих вопросов.", "Производительность зависит от социальных условий. Результаты труда определяются не только техническими и экономическими факторами, но и особенностями взаимодействия внутри коллектива."]], ["p", "С исследованиями Хоторнского завода часто связывают понятие «эффект Хоторна» — изменение поведения людей в ситуации, когда они знают, что за ними наблюдают. Однако современные исследователи осторожно относятся к этому понятию: результаты Хоторнских экспериментов были сложнее, чем простое объяснение повышением производительности из-за внимания наблюдателей."], ["h", "Джейкоб Морено и социометрия"], ["p", "Джейкоб Морено (1889–1974) — психолог и психиатр, создатель социометрии, внёсший значительный вклад в изучение межличностных отношений и малых групп."], ["p", "**Социометрия — метод изучения отношений внутри небольших групп, позволяющий выявить симпатии, антипатии, предпочтения и структуру межличностных связей.**"], ["p", "Морено исходил из того, что официальная структура коллектива не всегда совпадает с реальными отношениями между его участниками. Например, в рабочем коллективе есть начальник и подчинённые, но при этом могут существовать неформальные лидеры, группы друзей и люди, которые практически не взаимодействуют с остальными."], ["p", "Для изучения этих отношений Морено разработал специальные социометрические процедуры. Участникам группы предлагают ответить на вопросы о том, с кем они предпочли бы работать или выполнять совместное задание. На основе ответов можно увидеть, кто пользуется наибольшей популярностью, кто оказывается в центре взаимодействий, а кто остаётся в стороне."], ["p", "Результаты можно представить в виде социограммы — схемы, отображающей связи между участниками группы."], ["p", "Морено также известен развитием психодрамы и социодрамы — методов, в которых межличностные и групповые отношения исследуются через ролевое взаимодействие."], ["h", "Значение работ Мейо и Морено"], ["p", "Работы этих исследователей помогли показать, что для понимания трудового коллектива недостаточно изучить его официальную структуру и производственные показатели. Необходимо учитывать реальные отношения между людьми."], ["p", "При этом их вклад различается:"], ["ul", ["Элтон Мейо — теория человеческих отношений, Хоторнские исследования, влияние неформальных групп и психологической атмосферы на труд.", "Джейкоб Морено — социометрия, социограммы, изучение межличностных связей и структуры малых групп."]], ["p", "Главное для запоминания:"], ["tbl", [["Учёный", "Основная идея"], ["Фредерик Тейлор", "Научная организация труда, повышение производительности"], ["Элтон Мейо", "Человеческие отношения, влияние коллектива на труд"], ["Джейкоб Морено", "Социометрия, изучение межличностных связей"]]], ["p", "Общий вывод: индустриальная социология показала, что предприятие — это не только система оборудования, должностей и производственных операций, но и социальная система, в которой люди взаимодействуют, образуют группы и влияют друг на друга."]], "nb": 1}, {"n": 16, "q": "Эмпирическая социология в США: основные представители и направления исследований.", "b": [["p", "**Эмпирическая социология — направление, которое основывается на изучении реальных социальных процессов с помощью сбора и анализа фактических данных.** В отличие от теоретической социологии, которая прежде всего разрабатывает общие объяснения устройства общества, эмпирическая социология стремится получить конкретную информацию о том, как люди живут, работают, взаимодействуют и относятся к различным общественным явлениям."], ["p", "В США эмпирическая социология особенно активно развивалась в XX веке. Это было связано с быстрым ростом городов, развитием промышленности, миграцией, социальными конфликтами и необходимостью решать практические общественные проблемы."], ["h", "Основные методы эмпирической социологии"], ["p", "**Опрос — сбор информации с помощью вопросов, которые задаются определённой группе людей.** Опросы позволяют выяснить общественное мнение, отношение людей к политике, образованию, работе и другим вопросам."], ["p", "**Анкетирование — письменный или электронный вариант опроса, при котором респондент самостоятельно отвечает на подготовленные вопросы.**"], ["p", "**Интервью — получение информации в ходе беседы исследователя с человеком.** Интервью позволяет подробнее разобраться в личном опыте, взглядах и мотивах респондента."], ["p", "**Наблюдение — изучение поведения людей непосредственно в той среде, где они живут или работают.** Оно может быть включённым, когда исследователь сам становится участником изучаемой группы, и невключённым, когда он наблюдает со стороны."], ["p", "**Анализ документов — изучение писем, дневников, газет, официальных материалов, статистики и других источников информации.**"], ["p", "**Статистический анализ — обработка количественных данных, позволяющая выявлять закономерности, сравнивать группы и устанавливать связи между социальными явлениями.**"], ["h", "Основные представители и исследования"], ["p", "Альбион Смолл (1854–1926) — один из организаторов американской академической социологии. В 1892 году он организовал кафедру социологии в Чикагском университете. Способствовал превращению социологии в самостоятельную университетскую дисциплину."], ["p", "Уильям Грэм Самнер (1840–1910) — американский социолог, изучавший обычаи, традиции, социальные нормы и отношения между группами. Ввёл в широкое научное употребление понятие этноцентризма — склонности оценивать другие культуры через нормы и ценности собственной культуры."], ["p", "Роберт Парк (1864–1944) — представитель Чикагской школы, исследовавший городскую среду, миграцию, расовые отношения и взаимодействие социальных групп. Он считал, что общество необходимо изучать непосредственно, наблюдая за реальной жизнью людей."], ["p", "Уильям Томас (1863–1947) — изучал миграцию и адаптацию иммигрантов. Вместе с Флорианом Знанецким подготовил исследование «Польский крестьянин в Европе и Америке» (1918–1920). Авторы использовали письма и личные документы, чтобы понять, как меняется жизнь человека при переезде в другую страну."], ["p", "Пол Лазарсфельд (1901–1976) — один из наиболее известных представителей количественной эмпирической социологии. Разрабатывал методы опросов и изучал общественное мнение, политическое поведение и влияние массовой коммуникации. Его работы способствовали развитию современной методики социологических исследований."], ["p", "Роберт Мертон (1910–2003) — занимался теоретическими и эмпирическими исследованиями социальных структур, организаций и науки. Разработал концепцию теорий среднего уровня — теорий, которые объясняют отдельные социальные процессы и явления, не претендуя на объяснение всего общества сразу."], ["h", "Основные направления эмпирических исследований в США"], ["p", "Американские социологи изучали прежде всего конкретные проблемы общественной жизни:"], ["ul", ["Город и городская среда: развитие городов, районы проживания, социальное неравенство и преступность.", "Миграция: причины переезда, приспособление иммигрантов к новой культуре, отношения между этническими группами.", "Труд и производство: условия труда, отношения между работниками и руководством, производительность.", "Общественное мнение: отношение населения к политическим событиям, выборам и общественным проблемам.", "Семья и образование: семейные отношения, социализация, влияние образования на жизненные возможности.", "Социальное неравенство: различия в доходах, положении и доступе к общественным ресурсам."]], ["h", "Значение эмпирической социологии"], ["p", "Эмпирические исследования сделали социологию более практической и доказательной. Учёные получили возможность не только рассуждать об обществе в целом, но и проверять свои предположения на основе конкретных данных."], ["p", "Благодаря развитию опросов, интервью, наблюдений и статистики социология стала использоваться при изучении общественного мнения, разработке социальной политики, анализе образования, труда и других сфер жизни."], ["p", "Главное для запоминания:"], ["ul", ["Эмпирическая социология изучает общество на основе фактических данных.", "Основные методы — опрос, анкетирование, интервью, наблюдение, анализ документов и статистика.", "Парк — город и миграция; Томас — иммигранты и личные документы; Лазарсфельд — опросы и общественное мнение; Мертон — теории среднего уровня.", "Главная особенность американской эмпирической социологии — практическая направленность и развитие методов исследования."]]], "nb": 1}, {"n": 17, "q": "Социология социального пространства: представители и основные идеи.", "b": [["p", "**Социальное пространство — это система общественных отношений и социальных позиций, в которой располагаются люди и группы.** Оно показывает, какое положение человек занимает в обществе, к каким группам принадлежит и насколько близок или далёк от других людей по своему социальному статусу."], ["p", "Важно понимать, что социальное пространство не совпадает с географическим. Люди могут жить рядом, но занимать совершенно разное положение в обществе. И наоборот, люди, находящиеся в разных странах, могут быть близки по профессии, образованию, социальному статусу или политическим взглядам."], ["p", "Одним из основных представителей этого направления был Питирим Сорокин (1889–1968) — российско-американский социолог. Он подробно разработал представление о социальном пространстве, социальной дистанции, стратификации и мобильности."], ["h", "Питирим Сорокин: социальное пространство и социальная дистанция"], ["p", "Сорокин считал, что социальное пространство представляет собой не физическую территорию, а совокупность социальных отношений и положений людей."], ["p", "Чтобы определить положение человека в обществе, необходимо учитывать несколько признаков:"], ["ul", ["принадлежность к определённому государству;", "национальность и религию;", "профессию;", "экономическое положение;", "политические взгляды и принадлежность к организациям;", "происхождение, возраст и другие социальные характеристики."]], ["p", "Таким образом, социальное пространство является многомерным: положение человека определяется не одним признаком, а совокупностью различных характеристик."], ["p", "Например, два человека могут иметь одинаковый доход, но различаться по образованию, профессии и политическому влиянию. Поэтому их положение в обществе не будет полностью одинаковым."], ["p", "**Социальная дистанция — степень социального различия или близости между людьми и группами.** Чем сильнее различаются их общественные положения, тем больше социальная дистанция."], ["p", "Например, руководитель крупной организации и рядовой сотрудник могут работать в одном здании, но занимать разные позиции в социальной структуре. Их географическая близость не означает социального равенства."], ["h", "Горизонтальное и вертикальное социальное пространство"], ["p", "Сорокин выделял два основных измерения социальной дифференциации."], ["p", "Горизонтальное измерение отражает принадлежность человека к различным социальным группам, которые не обязательно находятся на разных ступенях иерархии. Например, человек может одновременно быть гражданином определённой страны, представителем профессии и членом религиозной или общественной организации."], ["p", "Вертикальное измерение отражает положение человека выше или ниже других в социальной иерархии. Оно связано с социальным неравенством, властью, престижем и экономическим положением."], ["p", "С этой темой тесно связано понятие социальной стратификации — разделения общества на слои, которые различаются по доходам, власти, престижу и другим признакам."], ["h", "Социальная мобильность"], ["p", "Важнейшая идея Сорокина — социальная мобильность, то есть перемещение человека или группы в социальном пространстве."], ["p", "Он выделял два основных вида мобильности."], ["p", "**Горизонтальная мобильность — переход человека из одной социальной группы в другую без существенного изменения его положения в общественной иерархии.**"], ["p", "Например, человек переезжает в другой город и устраивается на аналогичную должность с примерно таким же социальным статусом."], ["p", "**Вертикальная мобильность — перемещение человека вверх или вниз по социальной иерархии.**"], ["p", "Она бывает:"], ["ul", ["**восходящей — повышение социального положения, например получение руководящей должности;**", "**нисходящей — снижение социального положения, например потеря высокого статуса или переход на менее престижную работу.**"]], ["p", "Сорокин также изучал каналы вертикальной мобильности — социальные институты, через которые люди могут менять своё положение. К ним относятся образование, армия, церковь, политические организации, профессиональная деятельность и семья."], ["h", "Другие представители и развитие подхода"], ["p", "Роберт Парк (1864–1944) и Эмори Богардус (1882–1973) изучали социальную дистанцию преимущественно через отношения между людьми и группами, их симпатии, антипатии и готовность взаимодействовать. Богардус разработал шкалу социальной дистанции, позволяющую измерять степень принятия представителей различных социальных групп."], ["p", "Здесь важно различать подходы: Сорокин делал акцент на объективном положении групп в социальной структуре, а Парк и Богардус — на субъективном отношении людей друг к другу."], ["p", "Позднее значительный вклад в изучение социального пространства внёс Пьер Бурдьё (1930–2002) — французский социолог. Он рассматривал общество как пространство социальных позиций, которые определяются распределением различных видов капитала:"], ["ul", ["**Экономический капитал — деньги, имущество и материальные ресурсы.**", "**Культурный капитал — знания, образование, навыки и культурные компетенции.**", "**Социальный капитал — связи и отношения, которые могут помогать человеку получать ресурсы и возможности.**", "**Символический капитал — признание, авторитет, престиж и репутация.**"]], ["p", "По Бурдьё, положение человека зависит не только от количества ресурсов, но и от их сочетания. Например, высокий уровень образования может давать человеку культурный капитал, а полезные знакомства — социальный."], ["h", "Значение социологии социального пространства"], ["p", "Это направление помогает понять, почему люди занимают разные позиции в обществе, как формируется социальное неравенство и каким образом человек может изменить своё положение."], ["p", "Оно также позволяет изучать социальную мобильность, доступность образования, влияние профессии и дохода на жизненные возможности человека."], ["p", "Главное для запоминания:"], ["tbl", [["Представитель", "Основные идеи"], ["Питирим Сорокин", "Социальное пространство, социальная дистанция, стратификация и мобильность"], ["Роберт Парк", "Социальная дистанция и отношения между группами"], ["Эмори Богардус", "Шкала измерения социальной дистанции"], ["Пьер Бурдьё", "Социальное пространство, поле и различные виды капитала"]]], ["p", "Ключевая мысль: социальное пространство показывает положение людей и групп в обществе, а социальная мобильность объясняет, как это положение может меняться."]], "nb": 1}, {"n": 18, "q": "Чикагская, Гарвардская и Колумбийская социологические школы.", "b": [["p", "В XX веке американская социология развивалась вокруг крупных университетских центров. Среди наиболее известных — Чикагская, Гарвардская и Колумбийская школы."], ["p", "Они сыграли важную роль в развитии социологической теории, эмпирических исследований и профессионального образования социологов."], ["h", "1. Чикагская социологическая школа"], ["p", "Чикагская школа сформировалась вокруг Чикагского университета. В 1892 году Альбион Смолл организовал здесь университетское отделение социологии. Чикагская школа стала одним из первых крупных центров американской социологии."], ["p", "Главной особенностью школы было внимание к реальной жизни общества и изучению конкретных социальных проблем. Исследователи считали, что общество необходимо изучать непосредственно — наблюдать за людьми, анализировать городскую среду и собирать информацию о социальных группах."], ["p", "Основные представители:"], ["ul", ["Альбион Смолл — организатор социологического отделения Чикагского университета.", "Роберт Парк — исследовал город, миграцию, расовые отношения и социальные группы.", "Эрнест Бёрджесс — изучал городское развитие и социальную организацию городского пространства.", "Уильям Томас — исследовал миграцию и адаптацию иммигрантов.", "Луис Вирт — изучал городскую жизнь и особенности поведения людей в условиях большого города."]], ["p", "Основные направления исследований:"], ["p", "Чикагская школа уделяла большое внимание урбанизации, миграции, преступности, бедности, расовым и этническим отношениям, социальным конфликтам."], ["p", "Одним из наиболее известных исследований стало произведение Томаса и Знанецкого «Польский крестьянин в Европе и Америке». В нём авторы изучали, как меняется жизнь польских иммигрантов после переезда в США."], ["p", "Важным методом школы было включённое наблюдение — исследователь непосредственно погружался в изучаемую социальную среду, чтобы лучше понять поведение людей и особенности их отношений."], ["h", "2. Гарвардская социологическая школа"], ["p", "Гарвардский университет стал одним из важнейших центров развития американской социологической теории."], ["p", "Особенно значимую роль в развитии социологии Гарварда сыграли Питирим Сорокин и Толкотт Парсонс."], ["p", "Питирим Сорокин (1889–1968) — российско-американский социолог, высланный из Советской России в 1922 году. С 1930 года работал в Гарвардском университете, где организовал социологическое отделение."], ["p", "Он изучал социальную стратификацию, мобильность, революции и социокультурные изменения. Сорокин разработал теорию социокультурной динамики, согласно которой культура и общество проходят через различные исторические изменения."], ["p", "Основные работы:"], ["ul", ["«Система социологии» (1920);", "«Социология революции» (1925);", "«Социальная и культурная динамика» (1937–1941)."]], ["p", "Толкотт Парсонс (1902–1979) — американский социолог, один из главных представителей структурного функционализма. Он рассматривал общество как сложную систему, состоящую из взаимосвязанных элементов и институтов."], ["p", "По Парсонсу, различные части общества выполняют определённые функции, благодаря которым поддерживается его устойчивость. Например, семья отвечает за первичную социализацию, образование передаёт знания и нормы, а государство обеспечивает управление и регулирование общественной жизни."], ["p", "Парсонс стремился создать общую теорию социального действия и объяснить, каким образом общество сохраняет порядок и стабильность."], ["p", "Основные направления Гарвардской школы:"], ["ul", ["общая социологическая теория;", "социальная структура и стратификация;", "социальная мобильность;", "социальные системы и институты;", "социокультурные изменения."]], ["h", "3. Колумбийская социологическая школа"], ["p", "Колумбийская школа сформировалась вокруг Колумбийского университета в Нью-Йорке. Особенно большое значение она приобрела в середине XX века благодаря развитию количественных методов и эмпирических исследований."], ["p", "Основные представители:"], ["p", "Пол Лазарсфельд (1901–1976) — один из наиболее известных представителей школы. Он занимался изучением общественного мнения, политического поведения, массовых коммуникаций и методов социологических опросов."], ["p", "Лазарсфельд внёс большой вклад в развитие количественных исследований. Он стремился сделать сбор и анализ социологической информации более систематичным и точным."], ["p", "Одним из важных направлений его работы было изучение влияния средств массовой информации на поведение людей и принятие политических решений."], ["p", "Роберт Мертон (1910–2003) — американский социолог, разработавший концепцию теорий среднего уровня. Он считал, что социология должна создавать теории, которые объясняют конкретные социальные явления и могут проверяться эмпирическими исследованиями."], ["p", "Мертон также изучал социальные функции и дисфункции, а также явные и латентные функции социальных институтов."], ["p", "Например, явной функцией образования является передача знаний, а латентной может быть формирование круга общения и социальных связей."], ["p", "Основные направления Колумбийской школы:"], ["ul", ["социологические опросы и статистические исследования;", "общественное мнение;", "массовые коммуникации;", "политическое поведение;", "социальные организации;", "разработка теорий среднего уровня."]], ["h", "Сравнение трёх школ"], ["tbl", [["Школа", "Представители", "Основная направленность"], ["Чикагская", "А. Смолл, Р. Парк, Э. Бёрджесс, У. Томас", "Город, миграция, социальные группы, полевые исследования"], ["Гарвардская", "П. Сорокин, Т. Парсонс", "Социальная структура, мобильность, общая теория общества"], ["Колумбийская", "П. Лазарсфельд, Р. Мертон", "Опросы, статистика, общественное мнение, теории среднего уровня"]]], ["h", "Значение американских социологических школ"], ["p", "Эти школы способствовали превращению социологии в развитую университетскую и исследовательскую дисциплину."], ["p", "Чикагская школа показала важность непосредственного изучения городской жизни и социальных групп. Гарвардская школа внесла большой вклад в развитие общих теорий общества и изучение социальной структуры. Колумбийская школа способствовала совершенствованию методов опросов, статистики и анализа общественного мнения."], ["p", "При этом школы не были полностью однородными: внутри каждого научного центра существовали разные подходы и исследовательские интересы."], ["p", "Главное для запоминания:"], ["ul", ["Чикагская школа — изучение города и реальной жизни социальных групп.", "Гарвардская школа — общая теория общества, социальная структура и функционализм.", "Колумбийская школа — эмпирические исследования, опросы, статистика и общественное мнение."]]], "nb": 1}, {"n": 19, "q": "Социология франкфуртской школы.", "b": [["p", "**Франкфуртская школа — одно из важнейших направлений западной социологии и социальной философии XX века.** Её представители стремились не просто описывать общество, а критически анализировать его устройство, выявлять причины социального неравенства, господства и несвободы."], ["h", "Возникновение и основные идеи"], ["p", "Франкфуртская школа сформировалась в Германии вокруг Института социальных исследований, основанного во Франкфурте-на-Майне в 1923 году. Представители школы объединяли социологию, философию, политическую экономию, психологию и другие науки."], ["p", "Основой их подхода стала критическая теория общества. Она предполагала, что общество необходимо изучать не только для понимания существующего порядка, но и для его критической оценки. Учёные стремились выяснить, почему люди оказываются зависимыми от социальных и экономических систем и почему неравенство сохраняется даже в обществах, которые называют себя свободными и демократическими."], ["p", "Франкфуртские исследователи критиковали капиталистическое общество, массовую культуру, потребительство и влияние средств массовой информации. Они считали, что современное общество может управлять человеком не только с помощью прямого принуждения, но и через формирование его потребностей, привычек и представлений о нормальной жизни."], ["h", "Основные представители"], ["p", "Макс Хоркхаймер (1895–1973) — один из основателей Франкфуртской школы и разработчиков критической теории. Он считал, что наука не должна ограничиваться нейтральным описанием общества. Она должна также анализировать существующие формы власти и неравенства. Хоркхаймер выступал против такого понимания разума, при котором разум используется исключительно как инструмент достижения выгоды и контроля."], ["p", "Теодор Адорно (1903–1969) — немецкий философ и социолог, изучавший массовую культуру, искусство и механизмы общественного влияния. Вместе с Хоркхаймером написал работу «Диалектика Просвещения». Одним из главных понятий Адорно стала культурная индустрия."], ["p", "**Культурная индустрия — это массовое производство культурных продуктов, которые создаются по стандартным схемам и рассчитаны на широкую аудиторию.** Адорно и Хоркхаймер полагали, что массовая культура часто не развивает самостоятельное мышление, а приучает людей к однотипному потреблению и готовым представлениям."], ["p", "Например, фильмы, передачи и развлекательные программы могут воспроизводить одинаковые сюжеты и модели поведения. Человек привыкает потреблять уже готовые идеи, вместо того чтобы самостоятельно оценивать происходящее."], ["p", "Герберт Маркузе (1898–1979) — представитель Франкфуртской школы, автор книги «Одномерный человек». Он критиковал индустриальное общество потребления. По его мнению, современная система способна создавать у людей искусственные потребности, заставляя их связывать благополучие с приобретением товаров и постоянным потреблением."], ["p", "Понятие одномерного человека обозначает человека, который постепенно утрачивает способность критически оценивать общество и начинает воспринимать существующий порядок как единственно возможный."], ["p", "Эрих Фромм (1900–1980) — социальный психолог и философ, соединявший идеи психоанализа и социологии. В книге «Бегство от свободы» он исследовал противоречия свободы в современном обществе. Фромм считал, что свобода даёт человеку возможности для самостоятельного развития, но одновременно может вызывать тревогу и чувство одиночества. Поэтому некоторые люди стремятся отказаться от самостоятельности и подчиниться авторитету или общественным требованиям."], ["p", "Юрген Хабермас (1929–2026) — представитель более позднего поколения Франкфуртской школы. Он развивал идеи коммуникативного действия и публичной сферы. Хабермас считал, что общество может достигать взаимопонимания через свободное обсуждение, аргументацию и обмен мнениями."], ["h", "Значение Франкфуртской школы"], ["p", "Франкфуртская школа внесла значительный вклад в изучение массовой культуры, идеологии, власти, потребления и механизмов общественного контроля. Её представители показали, что влияние на человека осуществляется не только через государственные законы или экономическое принуждение, но и через культуру, информацию и повседневные привычки."], ["p", "Главное для запоминания:"], ["ul", ["Франкфуртская школа возникла вокруг Института социальных исследований, основанного в 1923 году.", "Основное направление — критическая теория общества.", "Хоркхаймер — один из основателей критической теории.", "Адорно — культурная индустрия и массовая культура.", "Маркузе — одномерный человек и общество потребления.", "Фромм — свобода, тревога и подчинение.", "Хабермас — коммуникативное действие и публичная сфера."]]], "nb": 1}, {"n": 20, "q": "Микросоциологические теории: основные идеи и представители.", "b": [["p", "**Микросоциология — направление социологии, которое изучает повседневную жизнь людей, непосредственное взаимодействие, общение, малые группы и отношения между отдельными людьми.**"], ["p", "Если макросоциология рассматривает общество в целом, то микросоциология обращает внимание на то, как общество проявляется в обычных ситуациях: в разговоре, поведении в коллективе, отношениях между друзьями, взаимодействии учителя и ученика."], ["p", "Главная идея микросоциологии заключается в том, что общество существует не только в виде крупных институтов и организаций. Оно постоянно воспроизводится через повседневные действия людей, их общение и взаимные ожидания."], ["h", "Символический интеракционизм"], ["p", "**Символический интеракционизм — направление, изучающее взаимодействие людей через символы и значения, которые они придают окружающему миру.**"], ["p", "Его интеллектуальным предшественником был Джордж Герберт Мид, а само название направления закрепил его ученик Герберт Блумер."], ["p", "Основная идея состоит в том, что люди взаимодействуют не просто с предметами и другими людьми, а с теми значениями, которые они им приписывают. Эти значения формируются и изменяются в процессе общения."], ["p", "Например, школьная форма — это не просто одежда. В определённой социальной среде она может символизировать принадлежность к школе, дисциплину и соблюдение общих правил. Люди понимают эти значения благодаря общественному опыту."], ["p", "Мид также изучал формирование личности. Он считал, что представление человека о себе возникает в процессе взаимодействия с окружающими. Важную роль играют значимые другие — люди, чьё мнение особенно важно для человека, и обобщённый другой — представление об ожиданиях общества в целом."], ["h", "Феноменологическая социология"], ["p", "Основателем феноменологической социологии считается Альфред Шюц (1899–1959)."], ["p", "Он изучал, как люди воспринимают окружающий мир и каким образом формируют общее понимание повседневной реальности."], ["p", "Главное понятие Шюца — жизненный мир. Это привычный мир повседневной жизни, который человек воспринимает как само собой разумеющийся. В нём люди используют накопленный опыт, знания и представления, чтобы понимать происходящее."], ["p", "Например, входя в аудиторию, студент обычно понимает, что здесь нужно вести себя определённым образом: слушать преподавателя, записывать материал, соблюдать правила занятия. Для этого не требуется каждый раз заново объяснять смысл ситуации — он уже известен благодаря общему социальному опыту."], ["p", "Последователями феноменологического подхода стали Питер Бергер и Томас Лукман, авторы работы «Социальное конструирование реальности» (1966). Они показали, что социальная реальность создаётся людьми в процессе взаимодействия, закрепляется в привычках и институтах, а затем воспринимается новыми поколениями как объективно существующий порядок."], ["h", "Этнометодология"], ["p", "Основателем этнометодологии является американский социолог Гарольд Гарфинкель (1917–2011)."], ["p", "Это направление изучает способы, с помощью которых люди в повседневной жизни создают, поддерживают и объясняют социальный порядок."], ["p", "Гарфинкеля интересовало, как люди понимают обычные ситуации и каким образом поддерживают общие правила поведения, даже если эти правила нигде специально не записаны."], ["p", "Например, участники разговора обычно понимают, когда наступает их очередь говорить, как нужно реагировать на вопросы и что считается вежливым поведением. Эти правила помогают поддерживать привычный порядок общения."], ["p", "Гарфинкель также использовал понятие нарушения привычных ожиданий: исследователь обращал внимание на то, как люди реагируют, когда обычный порядок взаимодействия неожиданно перестаёт соблюдаться. Такие исследования помогали выявить скрытые правила повседневной жизни."], ["h", "Драматургический подход"], ["p", "Основным представителем драматургического подхода является Эрвинг Гофман (1922–1982)."], ["p", "Он сравнивал социальное взаимодействие с театральным представлением. По его мнению, в общении люди стараются производить определённое впечатление на окружающих и подстраивают своё поведение под ситуацию."], ["p", "Гофман выделял два важных пространства взаимодействия:"], ["ul", ["**Передний план — ситуация, в которой человек демонстрирует окружающим определённую роль и старается соответствовать ожиданиям.**", "**Задний план — пространство, где человек может отойти от публичной роли и вести себя менее формально.**"]], ["p", "Например, преподаватель во время лекции придерживается профессиональной роли, следит за речью и поведением. В неформальной обстановке с друзьями он может вести себя совершенно иначе."], ["p", "Важное понятие Гофмана — управление впечатлениями, то есть стремление человека влиять на то, каким его воспринимают окружающие."], ["h", "Теория социального обмена"], ["p", "Представителями теории социального обмена являются Джордж Хоманс (1910–1989) и Питер Блау (1918–2002)."], ["p", "Теория социального обмена рассматривает взаимодействие людей через взаимные выгоды, затраты, вознаграждения и обязательства."], ["p", "Хоманс полагал, что люди склонны повторять действия, которые приносят им положительный результат. При этом взаимодействие может включать не только материальные выгоды, но и одобрение, поддержку, уважение и внимание."], ["p", "Блау развивал эти идеи и изучал, как из взаимного обмена возникают более сложные отношения, социальные обязательства и неравенство власти."], ["p", "Например, в дружеских отношениях люди обмениваются помощью, поддержкой и вниманием. При этом отношения не обязательно строятся на точном подсчёте того, кто и сколько сделал для другого."], ["h", "Главное для запоминания"], ["tbl", [["Направление", "Представитель", "Основная идея"], ["Символический интеракционизм", "Дж. Г. Мид, Г. Блумер", "Значения и символы в общении"], ["Феноменологическая социология", "А. Шюц, П. Бергер, Т. Лукман", "Повседневная реальность и её конструирование"], ["Этнометодология", "Г. Гарфинкель", "Правила повседневного взаимодействия"], ["Драматургический подход", "Э. Гофман", "Социальная жизнь как представление"], ["Теория социального обмена", "Дж. Хоманс, П. Блау", "Выгоды, затраты
